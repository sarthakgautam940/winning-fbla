# Unit 5 test: Machine Learning

- id: ut5-01
  skill: ml-nature
  tier: competitive
  type: scenario
  stem: |
    A spam filter gets better at labeling emails as spam or not spam as it is trained on more emails that people have labeled. In Tom Mitchell's definition of machine learning, what is the performance measure P?
  options:
    - "Labeling incoming emails as spam or not spam"
    - "The collection of emails that people have labeled"
    - "The percentage of emails the filter labels correctly"
    - "The number of emails that arrive each day"
  answer: C
  explain: |
    In Mitchell's definition, a program learns from experience E with respect to task T and performance measure P if its performance at T, measured by P, improves with E. Here T is labeling emails, E is the labeled emails, and P is the share labeled correctly.
  why:
    A: "Labeling emails is the task T."
    B: "The labeled emails are the experience E."
    D: "The daily volume of email does not measure how well the filter performs."

- id: ut5-02
  skill: ml-vocab
  tier: core
  type: concept
  stem: |
    A model predicts a home's sale price from its size, age, and neighborhood. What is the label?
  options:
    - "The home's size"
    - "The home's age"
    - "The neighborhood"
    - "The sale price"
  answer: D
  explain: |
    The label is the target value the model learns to predict, here the sale price. Size, age, and neighborhood are features, the inputs used to make the prediction.
  why:
    A: "Size is a feature, an input."
    B: "Age is a feature, an input."
    C: "The neighborhood is a feature, an input."

- id: ut5-03
  skill: ml-vocab
  tier: competitive
  type: concept
  stem: |
    For a decision tree, which of these is a hyperparameter rather than something learned during training?
  options:
    - "The maximum depth the tree may grow to"
    - "The feature tested at each split"
    - "The threshold used at each split"
    - "The class predicted at each leaf"
  answer: A
  explain: |
    A hyperparameter is set before training, such as the tree's maximum depth. The features, thresholds, and leaf predictions are what the training algorithm learns from the data.
  why:
    B: "Which feature to test is chosen by the algorithm during training."
    C: "Split thresholds are learned from the data during training."
    D: "Each leaf's prediction comes from the training examples that reach it."

- id: ut5-04
  skill: supervised
  tier: core
  type: scenario
  stem: |
    A teacher's model predicts each student's final exam score, from 0 to 100, using homework and quiz averages from past classes whose final scores are known. What kind of task is this?
  options:
    - "Unsupervised clustering"
    - "Supervised classification"
    - "Supervised regression"
    - "Reinforcement learning"
  answer: C
  explain: |
    The past examples come with known final scores, so the task is supervised, and the output is a number on a scale, so it is regression.
  why:
    A: "Clustering finds groups without labels, but these examples have known scores."
    B: "Classification predicts a category; an exam score is a number."
    D: "No agent acts and collects rewards; the model learns from labeled examples."

- id: ut5-05
  skill: unsupervised
  tier: competitive
  type: scenario
  stem: |
    Which of these music-app tasks is unsupervised learning?
  options:
    - "Predicting a song's play count from past songs' play counts"
    - "Labeling songs by genre using thousands of tagged songs"
    - "Learning a playlist strategy from listeners' skips and likes"
    - "Finding groups of similar songs from audio features alone"
  answer: D
  explain: |
    Grouping songs by their audio features, with no genre labels, discovers structure in unlabeled data: unsupervised clustering.
  why:
    A: "Predicting play counts from labeled past examples is supervised regression."
    B: "Learning from tagged songs is supervised classification."
    C: "Learning a strategy from feedback on its own choices is reinforcement learning."

- id: ut5-06
  skill: other-paradigms
  tier: champion
  type: scenario
  stem: |
    An image model is first trained on millions of unlabeled product photos by learning to predict hidden patches of each photo. It is then trained further on 1,000 labeled photos to spot damaged products. Which two ideas does this combine?
  options:
    - "Reinforcement learning, then clustering"
    - "Self-supervised pretraining, then transfer learning"
    - "Online learning, then batch learning"
    - "Unsupervised clustering, then lazy learning"
  answer: B
  explain: |
    Predicting hidden parts of unlabeled photos is self-supervised: the data supply their own targets. Reusing that pretrained model and fine-tuning it on a small labeled set for a new task is transfer learning.
  why:
    A: "No rewards or clusters are involved; the first stage predicts hidden parts of photos."
    C: "Online and batch learning describe how often a model updates, not these two training stages."
    D: "The first stage learns to predict hidden patches, not to form clusters, and the second builds a trained model."

- id: ut5-07
  skill: rl-basics
  tier: core
  type: recall
  stem: |
    A robot vacuum learns, by reinforcement learning, how to clean a room. Which of these is one of its actions?
  options:
    - "Turning left"
    - "The layout of the room"
    - "The points it earns for cleaning a spot"
    - "Its current position and battery level"
  answer: A
  explain: |
    An action is a choice the agent makes, such as turning left or moving forward. The room is part of the environment, the points are rewards, and its position and battery level describe its state.
  why:
    B: "The room's layout is part of the environment the agent acts in."
    C: "Points earned after an action are rewards."
    D: "Position and battery level describe the agent's state."

- id: ut5-08
  skill: rl-details
  tier: competitive
  type: calculation
  stem: |
    An agent will receive rewards of 10, 10, and 10 over the next three steps, and its discount factor is 0.5. What is the discounted value of these rewards, counting the first reward in full?
  options:
    - "10"
    - "15"
    - "17.5"
    - "30"
  ordered: true
  answer: C
  explain: |
    Each later reward is multiplied by one more factor of 0.5: 10 + 0.5 × 10 + 0.25 × 10 = 10 + 5 + 2.5 = 17.5.
  why:
    A: "10 counts only the first reward."
    B: "15 counts only the first two rewards."
    D: "30 adds the rewards with no discounting."
  verify: "10 + 0.5 * 10 + 0.25 * 10"

- id: ut5-09
  skill: choose-approach
  tier: competitive
  type: scenario
  stem: |
    An online game wants to group its players by play style, with no labels for the styles. Later, it wants to predict which new players will quit, using records of which past players quit. Which approaches fit the two tasks?
  options:
    - "Supervised classification for both"
    - "Reinforcement learning, then clustering"
    - "Regression for the groups, then clustering"
    - "Clustering for the groups, then supervised classification"
  answer: D
  explain: |
    The first task has no labels and looks for groups, so it calls for clustering. The second has known past outcomes, quit or stayed, and predicts a category, so it is supervised classification.
  why:
    A: "The play styles have no labels, so the first task cannot be supervised."
    B: "Neither task involves an agent learning from rewards, and quitting is predicted from labeled outcomes."
    C: "Grouping without labels is clustering, not regression, and the quitting task has labels to learn from."

- id: ut5-10
  skill: data-splits
  tier: core
  type: concept
  stem: |
    Which split of a labeled dataset is a common choice?
  options:
    - "10% training and 90% testing"
    - "70% training, 15% validation, and 15% testing"
    - "One third each for training, validation, and testing"
    - "100% training, then testing on the same data"
  answer: B
  explain: |
    Most of the data usually goes to training, with smaller shares held out for validation and testing; 70/15/15 and 80/10/10 are typical. Very large datasets can hold out even smaller percentages.
  why:
    A: "Training on only 10% wastes most of the data the model could learn from."
    C: "Equal thirds leave too little for training in most projects."
    D: "Testing on the training data hides overfitting, since the model has already seen every example."

- id: ut5-11
  skill: cross-validation
  tier: competitive
  type: calculation
  stem: |
    A team runs 4-fold cross-validation on 600 labeled examples. How many examples are in each validation fold?
  options:
    - "150"
    - "450"
    - "600"
    - "2,400"
  ordered: true
  answer: A
  explain: |
    The data are split into 4 equal folds of 600 / 4 = 150 examples. Each fold serves once as the validation set while the model trains on the other 450.
  why:
    B: "450 is the number of examples each model trains on, not the validation fold."
    C: "600 is the whole dataset; each fold holds a quarter of it."
    D: "2,400 multiplies by 4 instead of dividing."
  verify: "600 / 4"

- id: ut5-12
  skill: leakage
  tier: champion
  type: scenario
  stem: |
    A model predicts which customers will cancel a subscription next month. One of its features is the date each customer's account was closed. On historical data it scores 99 percent accuracy. What is the most likely problem?
  options:
    - "The model is underfitting the training data"
    - "The test set is too large to give a reliable score"
    - "Accuracy is the wrong metric for any churn model"
    - "Target leakage: the feature reveals the outcome it is meant to predict"
  answer: D
  explain: |
    An account-closed date exists only for customers who have already canceled, so the feature leaks the answer into the inputs. The model looks excellent on historical data but will fail on new customers whose future is unknown.
  why:
    A: "Underfitting produces low accuracy, not 99 percent."
    B: "A larger test set gives a more reliable score, not a misleading one."
    C: "The metric is not the issue; the feature contains the answer."

- id: ut5-13
  skill: fit-tradeoff
  tier: competitive
  type: scenario
  stem: |
    Which change is most likely to increase a decision tree's variance?
  options:
    - "Collecting more training data"
    - "Pruning its weakest branches"
    - "Letting it grow much deeper"
    - "Limiting it to two levels of splits"
  answer: C
  explain: |
    A deeper tree can carve the training data into tiny, specific regions, so it follows noise and changes a lot from one training sample to another: higher variance. The other changes all make the model more stable.
  why:
    A: "More data usually lowers variance, since quirks of any one sample matter less."
    B: "Pruning removes branches that fit noise, which lowers variance."
    D: "A two-level tree is simple, so its variance is low, though its bias may be high."

- id: ut5-14
  skill: fit-tradeoff
  tier: champion
  type: concept
  stem: |
    A k-nearest neighbors model is trained on 1,000 examples. As k is raised from 1 to 500, how does the model typically change?
  options:
    - "It moves from underfitting toward overfitting"
    - "It moves from overfitting toward underfitting"
    - "Its training error steadily falls"
    - "Its bias stays fixed while its variance rises"
  answer: B
  explain: |
    With k = 1 the model follows every quirk of the training data: high variance, overfitting. As k grows, each prediction averages over more neighbors and smooths away real local patterns, so bias rises and the model drifts toward underfitting.
  why:
    A: "This reverses the direction: small k overfits and large k underfits."
    C: "With k = 1 each training point is its own nearest neighbor, so training error starts near 0 and rises as k grows."
    D: "Raising k raises bias and lowers variance."

- id: ut5-15
  skill: regularization
  tier: competitive
  type: calculation
  stem: |
    A model's weights are 3, -2, and 1, and the regularization strength is 2. What is the L2 penalty, the strength times the sum of the squared weights?
  options:
    - "4"
    - "12"
    - "14"
    - "28"
  ordered: true
  answer: D
  explain: |
    The squared weights are 9, 4, and 1, which sum to 14. Multiplying by the strength gives 2 × 14 = 28.
  why:
    A: "4 adds the weights with their signs, 3 minus 2 plus 1, and doubles that; L2 squares each weight."
    B: "12 is the L1 penalty, which uses absolute values: 2 × (3 + 2 + 1)."
    C: "14 is the sum of squared weights before multiplying by the strength."
  verify: "2 * (3 ** 2 + (-2) ** 2 + 1 ** 2)"

- id: ut5-16
  skill: loss-gd
  tier: competitive
  type: calculation
  stem: |
    A weight w = 4 has a loss gradient of 6. With a learning rate of 0.1, what is w after one gradient descent step?
  options:
    - "3.4"
    - "3.9"
    - "4.6"
    - "10"
  ordered: true
  answer: A
  explain: |
    Gradient descent subtracts the learning rate times the gradient: 4 minus 0.1 × 6 = 4 minus 0.6 = 3.4. A positive gradient means the loss rises as w grows, so w moves down.
  why:
    B: "3.9 subtracts only the learning rate, without multiplying it by the gradient."
    C: "4.6 adds the step instead of subtracting it, moving uphill."
    D: "10 adds the full gradient, ignoring both the learning rate and the direction."
  verify: "4 - 0.1 * 6"

- id: ut5-17
  skill: loss-gd
  tier: champion
  type: calculation
  stem: |
    Gradient descent minimizes the loss $$(w - 5)^2$$, whose gradient is $$2(w - 5)$$. Starting from w = 1 with a learning rate of 0.25, what is w after two steps?
  options:
    - "-1"
    - "3"
    - "4"
    - "5"
  ordered: true
  answer: C
  explain: |
    Step 1: the gradient at w = 1 is 2 × (1 minus 5) = negative 8, so w becomes 1 minus 0.25 × (negative 8) = 3. Step 2: the gradient at w = 3 is negative 4, so w becomes 3 minus 0.25 × (negative 4) = 4. Each step closes half the remaining distance to the minimum at 5.
  why:
    A: "-1 steps with the gradient instead of against it."
    B: "3 is the result after one step, not two."
    D: "5 is the minimum itself; with this learning rate, two steps get only partway there."
  verify: |
    w = 1.0
    for _ in range(2):
        w -= 0.25 * 2 * (w - 5)
    ans = w

- id: ut5-18
  skill: decision-trees
  tier: champion
  type: calculation
  stem: |
    A tree node holds 10 examples: 4 cats, 4 dogs, and 2 birds. Using Gini = 1 minus the sum of the squared class proportions, what is the node's Gini impurity?
  options:
    - "0.36"
    - "0.64"
    - "0.67"
    - "1"
  ordered: true
  answer: B
  explain: |
    The class proportions are 0.4, 0.4, and 0.2. Their squares are 0.16, 0.16, and 0.04, which sum to 0.36, so Gini = 1 minus 0.36 = 0.64.
  why:
    A: "0.36 is the sum of the squared proportions; Gini subtracts it from 1."
    C: "0.67 is the largest possible Gini for three classes, reached only when they are equal in size."
    D: "Gini never reaches 1; with three classes it tops out at about 0.67."
  verify: "1 - (0.4 ** 2 + 0.4 ** 2 + 0.2 ** 2)"

- id: ut5-19
  skill: ensembles
  tier: competitive
  type: concept
  stem: |
    Why does a random forest usually predict better than any single one of its trees?
  options:
    - "Each tree is trained on all the data with all the features"
    - "Its trees all make the same mistakes, which cancel out"
    - "Each of its trees is grown deeper than a single tree"
    - "Its trees' different errors partly cancel when votes combine"
  answer: D
  explain: |
    Bootstrap samples and random feature choices make the trees differ, so they make different mistakes. When their votes are combined, many of those errors cancel, which lowers the variance of the forest's predictions.
  why:
    A: "Each tree sees a bootstrap sample and random subsets of features, not everything."
    B: "Identical mistakes would not cancel; the trees help because their errors differ."
    C: "Depth is not what makes a forest better; combining many different trees is."

- id: ut5-20
  skill: knn-svm-nb
  tier: competitive
  type: concept
  stem: |
    What is the likely effect of using a very large k, such as k = 500, in k-nearest neighbors trained on 1,000 points?
  options:
    - "It smooths over real local patterns and tends to underfit"
    - "It follows noise in the data and tends to overfit"
    - "It no longer needs the features to be scaled"
    - "It classifies every training point perfectly"
  answer: A
  explain: |
    With k = 500, each prediction is a vote among half the dataset, so local differences wash out and predictions drift toward the overall majority: high bias, or underfitting.
  why:
    B: "Following noise is the problem with a very small k, such as 1."
    C: "k-NN measures distances, so features still need scaling whatever k is."
    D: "Votes among 500 neighbors often outvote a point's own label, so training errors rise."

- id: ut5-21
  skill: knn-svm-nb
  tier: core
  type: concept
  stem: |
    Which boundary does a support vector machine choose between two classes?
  options:
    - "The one through the middle of all the points"
    - "The one that passes closest to the most points"
    - "The one with the widest margin between the classes"
    - "The one that weights every training point equally"
  answer: C
  explain: |
    An SVM picks the boundary that leaves the widest margin, the largest gap to the nearest points of each class. Those nearest points, the support vectors, are the only ones that fix where the boundary goes.
  why:
    A: "The boundary depends on the points nearest the gap between the classes, not on the middle of all the data."
    B: "An SVM keeps the boundary as far as possible from the nearest points, not close to many points."
    D: "Only the support vectors fix the boundary; points far from it have no effect."

- id: ut5-22
  skill: clustering-dimred
  tier: competitive
  type: concept
  stem: |
    How do k-means and DBSCAN differ in what an analyst must decide in advance?
  options:
    - "DBSCAN needs the number of clusters; k-means finds it"
    - "Both need the number of clusters chosen in advance"
    - "Neither can find clusters of unusual shapes"
    - "k-means needs the number of clusters; DBSCAN finds it from density"
  answer: D
  explain: |
    k-means requires k, the number of clusters, before it starts. DBSCAN instead grows clusters from dense regions of points, so the number of clusters comes out of the data, and it can find clusters of any shape and label sparse points as noise.
  why:
    A: "This reverses them: k-means is the one that needs k."
    B: "DBSCAN does not take the number of clusters as an input."
    C: "DBSCAN can find clusters of any shape, such as crescents."

- id: ut5-23
  skill: neurons
  tier: competitive
  type: calculation
  stem: |
    A neuron has inputs 4, 1, and 2, weights 0.5, -1, and 0.25, a bias of -0.5, and a ReLU activation. What does it output?
  options:
    - "0"
    - "1"
    - "1.5"
    - "3"
  ordered: true
  answer: B
  explain: |
    The weighted sum is 4 × 0.5 + 1 × (negative 1) + 2 × 0.25 = 2 minus 1 + 0.5 = 1.5, and adding the bias of negative 0.5 gives z = 1. ReLU passes positive values unchanged, so the output is 1.
  why:
    A: "ReLU outputs 0 only for negative inputs, and z = 1 is positive."
    C: "1.5 leaves out the bias of negative 0.5."
    D: "3 drops the minus sign on the second weight."
  verify: "max(0, 4 * 0.5 + 1 * -1 + 2 * 0.25 - 0.5)"

- id: ut5-24
  skill: activations
  tier: core
  type: concept
  stem: |
    Which activation function outputs 0 for every negative input and passes positive inputs through unchanged?
  options:
    - "ReLU"
    - "Sigmoid"
    - "Tanh"
    - "Softmax"
  answer: A
  explain: |
    ReLU, the rectified linear unit, outputs max(0, z): negative inputs become 0 and positive inputs stay as they are.
  why:
    B: "Sigmoid squashes every input into the range 0 to 1."
    C: "Tanh squashes every input into the range negative 1 to 1."
    D: "Softmax turns a group of scores into probabilities that sum to 1."

- id: ut5-25
  skill: nn-training
  tier: competitive
  type: calculation
  stem: |
    A network trains on 10,000 examples with a batch size of 50 for 5 epochs. How many weight updates does it make in total?
  options:
    - "200"
    - "1,000"
    - "2,000"
    - "50,000"
  ordered: true
  answer: B
  explain: |
    Each epoch splits the 10,000 examples into 10,000 / 50 = 200 batches, with one update per batch. Over 5 epochs that is 200 × 5 = 1,000 updates.
  why:
    A: "200 is the number of updates in a single epoch."
    C: "2,000 divides 10,000 by the 5 epochs instead of by the batch size."
    D: "50,000 is the number of examples processed, not the number of updates."
  verify: "10000 // 50 * 5"

- id: ut5-26
  skill: deep-learning
  tier: core
  type: concept
  stem: |
    In a deep network trained to recognize objects in photos, what do the later layers typically respond to?
  options:
    - "Only the brightness of single pixels"
    - "Random noise unrelated to the image"
    - "Complex parts and whole objects, such as faces"
    - "Only straight edges and color blobs"
  answer: C
  explain: |
    Early layers detect simple patterns such as edges, and each later layer combines the features below it into more complex ones, so the later layers respond to object parts and whole objects.
  why:
    A: "Even the first layers combine many pixels into patterns."
    B: "Trained layers learn useful features, not noise."
    D: "Edges and color blobs are what the earliest layers detect."

- id: ut5-27
  skill: deep-architectures
  tier: core
  type: recall
  stem: |
    What does a 2 × 2 max-pooling layer in a convolutional network do?
  options:
    - "Keeps the largest value in each window, shrinking the map"
    - "Averages every value in the image into one number"
    - "Adds a new layer of fully connected neurons"
    - "Doubles the width and height of the feature map"
  answer: A
  explain: |
    Max pooling slides a small window over a feature map and keeps only the largest value in each window. With 2 × 2 windows and a stride of 2, the map shrinks to half its width and half its height.
  why:
    B: "Pooling summarizes small windows, not the whole image at once."
    C: "Pooling has no neurons or weights to learn."
    D: "Pooling shrinks the feature map; it does not enlarge it."

- id: ut5-28
  skill: deep-architectures
  tier: champion
  type: calculation
  stem: |
    A 3 × 3 kernel slides over a 32 × 32 image one pixel at a time, with no padding. The result then goes through 2 × 2 max pooling with a stride of 2. What size is the final feature map?
  options:
    - "30 × 30"
    - "15 × 15"
    - "16 × 16"
    - "29 × 29"
  answer: B
  explain: |
    The convolution gives (32 minus 3 + 1) × (32 minus 3 + 1) = 30 × 30. Pooling with 2 × 2 windows and a stride of 2 halves each side, giving 15 × 15.
  why:
    A: "30 × 30 is the size after the convolution, before pooling."
    C: "16 × 16 halves the original 32 × 32 and skips the convolution's shrinking."
    D: "29 × 29 subtracts the kernel size but forgets to add 1."
  verify: |
    n = 32 - 3 + 1
    ans = f"{n // 2} × {n // 2}"
