# Unit 3 test: Data Analysis and Statistics for AI

- id: ut3-01
  skill: chart-choice
  tier: core
  type: scenario
  stem: |
    A teacher has quiz scores for a class of 15 students and wants a simple chart of their distribution that keeps every individual score visible as its own mark. Which chart fits best?
  options:
    - "A dot plot"
    - "A histogram"
    - "A pie chart"
    - "A line chart"
  answer: A
  explain: |
    A dot plot places one dot per value along a number line, so the shape of the distribution shows while every score stays visible. With only 15 values, nothing gets crowded.
  why:
    B: "A histogram groups the scores into bins, so individual scores disappear inside the bars."
    C: "A pie chart shows parts of a whole, not how a set of scores is spread out."
    D: "A line chart shows change over time, and these scores are not a time series."

- id: ut3-02
  skill: chart-choice
  tier: competitive
  type: scenario
  stem: |
    A company wants readers to compare the monthly sales trends of its six regions over three years. One line chart with six overlapping lines is too cluttered to read. What is the best alternative?
  options:
    - "One pie chart of each region's three-year total"
    - "Six separate line charts, each with its own scale"
    - "Six small line charts, one per region, on the same scale"
    - "A stacked bar chart of each region's yearly totals"
  answer: C
  explain: |
    Small multiples repeat the same small chart for each group on identical scales, so readers can compare the six trends at a glance without untangling overlapping lines.
  why:
    A: "A pie chart shows shares of a total and hides how sales changed from month to month."
    B: "Different scales make regions look more or less alike depending on how each axis was drawn."
    D: "Yearly totals hide the month-to-month trend the company wants readers to compare."

- id: ut3-03
  skill: misleading
  tier: competitive
  type: concept
  stem: |
    A bar chart compares two phone plans' average customer ratings, 4.1 and 4.3 out of 5, but its vertical axis starts at 4.0. What is the problem?
  options:
    - "The bars should be sorted from tallest to shortest"
    - "The truncated axis makes a small difference look several times larger"
    - "Ratings should be displayed as a pie chart instead"
    - "The chart needs a third bar showing the average rating"
  answer: B
  explain: |
    Starting the axis at 4.0 makes the bars 0.1 and 0.3 units tall, so a 0.2-point gap looks like one plan is rated three times higher. Bar charts should usually start at zero so that bar lengths stay proportional.
  why:
    A: "Sorting does not fix the distorted bar lengths."
    C: "Pie charts show parts of a whole, and two ratings are not parts of a whole."
    D: "Adding a bar does not fix the misleading axis."

- id: ut3-04
  skill: histograms
  tier: competitive
  type: visual
  stem: |
    The histogram shows household incomes in a town. Which statement best describes the distribution?
  figure:
    type: histogram
    caption: Household incomes in one town.
    xLabel: Income (thousands of dollars)
    yLabel: Households
    bins:
      - { from: 0, to: 20, count: 8 }
      - { from: 20, to: 40, count: 22 }
      - { from: 40, to: 60, count: 18 }
      - { from: 60, to: 80, count: 9 }
      - { from: 80, to: 100, count: 5 }
      - { from: 100, to: 120, count: 3 }
      - { from: 120, to: 140, count: 2 }
      - { from: 140, to: 160, count: 1 }
  options:
    - "Symmetric, so the mean and median are about equal"
    - "Left-skewed, so the mean is below the median"
    - "Uniform, so every income range is equally common"
    - "Right-skewed, so the mean is above the median"
  answer: D
  explain: |
    Most households fall in the lower bins, and a long tail stretches toward high incomes. In a right-skewed distribution, the tail pulls the mean above the median.
  why:
    A: "The long tail on the right makes the distribution asymmetric."
    B: "The long tail is on the right, not the left."
    C: "The bar heights differ a lot, so the distribution is not uniform."

- id: ut3-05
  skill: boxplots
  tier: champion
  type: visual
  stem: |
    The boxplots show the number of orders a warehouse handled per hour on two shifts. About what share of hours had more than 50 orders on each shift?
  figure:
    type: boxplot
    caption: Orders handled per hour on two shifts.
    axisLabel: Orders per hour
    groups:
      - { label: Morning, min: 18, q1: 30, median: 38, q3: 50, max: 64 }
      - { label: Evening, min: 25, q1: 40, median: 50, q3: 58, max: 70 }
  options:
    - "About 25% of morning hours and about 50% of evening hours"
    - "About 50% of morning hours and about 25% of evening hours"
    - "About 75% of morning hours and about 50% of evening hours"
    - "It cannot be estimated without the raw data"
  answer: A
  explain: |
    For the morning shift, 50 is Q3, so about a quarter of the hours lie above it. For the evening shift, 50 is the median, so about half lie above it. Each quartile marks off about 25% of the values, which is what lets you read shares from a boxplot.
  why:
    B: "This swaps the shifts: 50 is the morning Q3 and the evening median."
    C: "About 75% of morning hours fall below Q3 = 50, not above it."
    D: "Quartiles are the 25th, 50th, and 75th percentiles, so shares above them can be read from the plot."

- id: ut3-06
  skill: scatterplots
  tier: core
  type: visual
  stem: |
    How would you describe the relationship shown in the scatterplot?
  figure:
    type: scatter
    caption: Daily steps and nightly sleep for 12 adults.
    xLabel: Steps per day (thousands)
    yLabel: Hours of sleep
    series:
      - points: [[3, 6.6], [4, 7.6], [5, 6.1], [6, 7.2], [7, 6.3], [8, 7.7], [9, 6.5], [10, 7.8], [11, 6.7], [12, 7.1], [13, 7.9], [14, 6.8]]
  options:
    - "Strong and positive"
    - "Weak and negative"
    - "Weak and positive"
    - "Strong and negative"
  answer: C
  explain: |
    The points drift slightly upward from left to right, so the direction is positive, but they scatter widely around any line, so the relationship is weak. For these points r is about 0.26.
  why:
    A: "The points scatter widely instead of hugging a line, so the relationship is not strong."
    B: "Sleep tends to rise slightly as steps rise, so the direction is positive."
    D: "The points do not fall from left to right, and they do not follow a tight band."

- id: ut3-07
  skill: causation
  tier: competitive
  type: scenario
  stem: |
    A study finds that children who take music lessons score higher on math tests than children who do not. Which variable is most likely a confounder?
  options:
    - "The number of lessons per week"
    - "Family income"
    - "The difficulty of the math test"
    - "The size of each math class"
  answer: B
  explain: |
    A confounder is linked to both variables. Families with more money can more easily pay for music lessons and also tend to provide other support that raises math scores, so income could explain the association without lessons causing anything.
  why:
    A: "Lessons per week measure the explanatory variable itself, not a third variable."
    C: "Every child took the same test, so its difficulty cannot explain the gap between the groups."
    D: "Class size may affect math scores, but it has no clear link to whether a child takes music lessons."

- id: ut3-08
  skill: causation
  tier: champion
  type: visual
  stem: |
    Two basketball players' shooting records for one season are shown below.

    | Shot type | Player P made / attempted | Player Q made / attempted |
    |---|---|---|
    | Two-pointers | 18 / 30 | 50 / 90 |
    | Three-pointers | 36 / 90 | 10 / 30 |

    Which statement is true?
  options:
    - "P has the higher rate for each shot type and overall"
    - "Q has the higher rate for each shot type and overall"
    - "Q has the higher rate for each shot type, but P is higher overall"
    - "P has the higher rate for each shot type, but Q is higher overall"
  answer: D
  explain: |
    For two-pointers, P makes 60% and Q about 56%; for three-pointers, P makes 40% and Q about 33%. Overall, though, P makes 54 of 120 (45%) and Q makes 60 of 120 (50%). Most of P's shots are harder three-pointers, and that uneven mix reverses the comparison when the groups are combined: Simpson's paradox.
  why:
    A: "Overall P makes 45% and Q makes 50%, so P is not higher overall."
    B: "P has the higher rate for both shot types: 60% against about 56%, and 40% against about 33%."
    C: "This reverses which player leads within each shot type."
  verify: |
    p_each = 18 / 30 > 50 / 90 and 36 / 90 > 10 / 30
    q_total = (50 + 10) / 120 > (18 + 36) / 120
    ans = "P has the higher rate for each shot type, but Q is higher overall" if p_each and q_total else "no match"

- id: ut3-09
  skill: data-quality
  tier: core
  type: scenario
  stem: |
    A sign-up form made the phone-number field optional, and 40 percent of customer records now have no phone number. Which data quality dimension does this affect?
  options:
    - "Completeness"
    - "Uniqueness"
    - "Timeliness"
    - "Validity"
  answer: A
  explain: |
    Completeness asks whether all the expected records and values are present. Here the values were never collected, so 40 percent of the phone field is empty.
  why:
    B: "Uniqueness concerns duplicate records, not missing values."
    C: "Timeliness concerns whether the data are current enough for their use."
    D: "Validity concerns whether recorded values follow the allowed format or range; these values are missing, not malformed."

- id: ut3-10
  skill: data-quality
  tier: competitive
  type: scenario
  stem: |
    A registration form stored a student's birth date as 31/02/2009. Which data quality dimension does this value fail?
  options:
    - "Uniqueness"
    - "Timeliness"
    - "Validity"
    - "Completeness"
  answer: C
  explain: |
    February never has 31 days, so the value breaks the rules for a date. Validity means values conform to the required type, format, and range.
  why:
    A: "Uniqueness concerns duplicate records."
    B: "Timeliness concerns how current the data are."
    D: "The value is present, just impossible, so completeness is not the problem."

- id: ut3-11
  skill: sampling-bias
  tier: competitive
  type: scenario
  stem: |
    An investment company advertises that the funds it offers today earned an average of 9 percent a year over the past decade. Funds that did poorly during that time were closed and are not included. What problem does this create?
  options:
    - "Nonresponse bias"
    - "Voluntary response bias"
    - "Response bias from a leading question"
    - "Survivorship bias"
  answer: D
  explain: |
    Only the funds that survived are counted, and the closed funds, which did poorly, are left out. The 9 percent average is therefore too optimistic about how the company's funds perform.
  why:
    A: "Nonresponse bias comes from people who decline to answer; here the poor funds were removed from the record."
    B: "Nobody chose to be included; the company dropped its failures itself."
    C: "No survey question was asked, so question wording plays no part."

- id: ut3-12
  skill: sampling-bias
  tier: core
  type: scenario
  stem: |
    To learn how a city's residents get to work, a student surveys people waiting at one downtown bus stop on a weekday morning. What kind of sample is this?
  options:
    - "A simple random sample"
    - "A convenience sample"
    - "A stratified random sample"
    - "A cluster sample"
  answer: B
  explain: |
    The student surveyed whoever was easiest to reach. Nearly everyone at a bus stop rides the bus, so the sample overstates bus use and misses people who drive, walk, or work from home.
  why:
    A: "Not every resident had an equal chance to be chosen; only people at that stop could be."
    C: "No groups were defined and then sampled separately."
    D: "No groups were chosen at random and then surveyed in full."

- id: ut3-13
  skill: missing-data
  tier: champion
  type: scenario
  stem: |
    In a study of a pain medication, the patients in the most pain are the most likely to skip the follow-up pain survey. How are the missing pain scores best classified, and how will the average of the returned scores compare with the true average?
  options:
    - "MCAR; about equal to the true average"
    - "MAR; higher than the true average"
    - "MNAR; lower than the true average"
    - "MNAR; higher than the true average"
  answer: C
  explain: |
    Whether a score is missing depends on the pain score itself, which was never recorded, so the data are missing not at random. The missing scores are the high ones, so averaging only the returned surveys understates the patients' pain.
  why:
    A: "Missingness depends on how much pain a patient feels, so it is not completely random, and the average is biased."
    B: "Missingness depends on the unrecorded score itself, not only on observed variables, and leaving out high scores pulls the average down."
    D: "The skipped scores are the highest ones, so leaving them out lowers the average instead of raising it."

- id: ut3-14
  skill: missing-data
  tier: competitive
  type: scenario
  stem: |
    A customer table's preferred-contact column (email, phone, or text) has a few values missing completely at random. If the analyst fills each gap with one value, which choice makes sense?
  options:
    - "The mode, the most common method"
    - "The mean of the methods coded as 1, 2, 3"
    - "The value from the row above each gap"
    - "Delete the whole column"
  answer: A
  explain: |
    The column is categorical, so the usual single-value fill is mode imputation: the most common category. Means and medians only make sense for numbers.
  why:
    B: "Codes such as 1, 2, and 3 are labels, so their mean, such as 1.8, names no real method."
    C: "Copying the row above suits time series in order; customer rows have no natural order."
    D: "Dropping the column throws away a mostly complete variable to fix a few gaps."

- id: ut3-15
  skill: clean-issues
  tier: core
  type: scenario
  stem: |
    A dates column mixes entries such as 2025-03-04, 03/04/2025, and March 4, 2025. What should the analyst do?
  options:
    - "Delete every row not in the first format"
    - "Sort the column alphabetically"
    - "Leave them, since each entry is readable"
    - "Convert every entry to one standard format"
  answer: D
  explain: |
    Software treats differently formatted dates as different values, so sorting, grouping, and date arithmetic all break. Converting every entry to one format, after confirming whether 03/04 means March 4 or April 3 in the source, fixes the problem without losing rows.
  why:
    A: "Deleting rows throws away good data that only needs reformatting."
    B: "Sorting text dates alphabetically neither fixes the formats nor puts them in time order."
    C: "People can read each format, but software cannot compare dates written in different formats."

- id: ut3-16
  skill: validate-clean
  tier: champion
  type: scenario
  stem: |
    An analyst merges a 5,000-row orders table with a customers table on customer ID. Each order belongs to exactly one customer, yet the merged table has 5,600 rows. What is the most likely cause?
  options:
    - "Some orders had no matching customer and were dropped"
    - "Some customer IDs appear more than once in the customers table"
    - "The merge sorted the orders by customer ID"
    - "Some orders were missing their customer ID"
  answer: B
  explain: |
    When a customer ID appears twice in the customers table, each of that customer's orders matches both rows and is duplicated. Checking that the row count is what you expect, and that the key is unique in the lookup table, catches the problem.
  why:
    A: "Dropped orders would make the result smaller than 5,000 rows, not larger."
    C: "Sorting changes the order of rows, not how many there are."
    D: "An order with no ID matches nothing, so it cannot add rows."

- id: ut3-17
  skill: why-clean
  tier: core
  type: concept
  stem: |
    A store's category column contains "Electronics", "electronics ", and "ELECTRONICS". If an analyst charts total sales by category without cleaning, what will the chart show?
  options:
    - "One electronics bar with the correct total"
    - "An error, because the chart cannot be drawn"
    - "Three electronics bars, each below the true total"
    - "One electronics bar with three times the total"
  answer: C
  explain: |
    To software, the three spellings are three different categories, so electronics sales are split across three bars and none shows the real total. Standardizing the labels first gives one correct bar.
  why:
    A: "Software does not merge labels that differ in case or spacing on its own."
    B: "The chart draws without complaint; the error is silent, which is what makes it dangerous."
    D: "Each sale is counted once, under whichever spelling it has, so nothing is tripled."

- id: ut3-18
  skill: multivariate
  tier: competitive
  type: scenario
  stem: |
    A bank wants to use eight financial measurements to predict which of three risk groups (low, medium, or high) a new applicant belongs to. Which kind of method fits?
  options:
    - "A dependence method, such as discriminant analysis"
    - "An interdependence method, such as factor analysis"
    - "An interdependence method, such as cluster analysis"
    - "A univariate method, such as one histogram per measurement"
  answer: A
  explain: |
    The bank has a known outcome, the risk group, to predict from the measurements, so it needs a dependence method. Discriminant analysis predicts which of several known groups a case belongs to.
  why:
    B: "Factor analysis looks for hidden factors among the measurements and predicts no outcome."
    C: "Cluster analysis forms new groups; here the three risk groups already exist and must be predicted."
    D: "Looking at one measurement at a time cannot combine eight measurements into one prediction."

- id: ut3-19
  skill: interdependence
  tier: champion
  type: scenario
  stem: |
    A marketing team has survey ratings of how similar 15 sneaker brands are to one another. It wants a two-dimensional map on which similar brands sit close together. Which method fits best?
  options:
    - "Factor analysis"
    - "Multidimensional scaling"
    - "Cluster analysis"
    - "Discriminant analysis"
  answer: B
  explain: |
    Multidimensional scaling turns a table of similarities into a map, placing similar items near each other. It is an interdependence method, since no outcome is being predicted.
  why:
    A: "Factor analysis finds latent factors behind a set of variables; it does not map items by their similarity."
    C: "Cluster analysis sorts the brands into groups but does not place them on a map."
    D: "Discriminant analysis predicts a known group label, which is a dependence task."

- id: ut3-20
  skill: multiple-regression
  tier: competitive
  type: calculation
  stem: |
    A model predicts a home's price, in dollars, as 50,000 + 120 × (square feet) + 8,000 × (bedrooms). What price does it predict for a 1,500-square-foot home with 3 bedrooms?
  options:
    - "204,000"
    - "230,000"
    - "238,000"
    - "254,000"
  ordered: true
  answer: D
  explain: |
    Substitute the values: 50,000 + 120 × 1,500 + 8,000 × 3 = 50,000 + 180,000 + 24,000 = 254,000.
  why:
    A: "204,000 leaves out the intercept of 50,000."
    B: "230,000 leaves out the bedrooms term."
    C: "238,000 adds the bedroom coefficient once instead of multiplying it by 3 bedrooms."
  verify: "50000 + 120 * 1500 + 8000 * 3"

- id: ut3-21
  skill: multiple-regression
  tier: champion
  type: concept
  stem: |
    An analyst adds a column of random numbers as an extra predictor in a multiple regression. What typically happens to R squared and adjusted R squared?
  options:
    - "Both fall, because the new predictor adds only random noise to the model"
    - "Both rise by the same amount, because the model now has more information"
    - "R squared rises slightly or stays the same, while adjusted R squared tends to fall"
    - "Adjusted R squared rises, while R squared falls by the same amount"
  answer: C
  explain: |
    R squared can never decrease when a predictor is added, even a useless one. Adjusted R squared penalizes extra predictors, so it falls unless the new one improves the fit more than chance would.
  why:
    A: "R squared cannot fall when a predictor is added."
    B: "Adjusted R squared penalizes the extra predictor, so the two do not rise together."
    D: "This reverses the behavior of the two measures."

- id: ut3-22
  skill: logistic-regression
  tier: competitive
  type: calculation
  stem: |
    A logistic regression model estimates a 0.6 probability that a website visitor will sign up for a newsletter. What are the odds that the visitor signs up?
  options:
    - "0.4"
    - "0.6"
    - "0.67"
    - "1.5"
  ordered: true
  answer: D
  explain: |
    Odds compare the chance of the event with the chance of no event: 0.6 / 0.4 = 1.5, which is often read as 3 to 2.
  why:
    A: "0.4 is the probability of not signing up, 1 minus 0.6."
    B: "0.6 is the probability, not the odds."
    C: "0.67 is 0.4 / 0.6, the odds against signing up."
  verify: "0.6 / (1 - 0.6)"

- id: ut3-23
  skill: tree-applied
  tier: competitive
  type: scenario
  stem: |
    A clinic wants a model that triage nurses can follow as a short series of yes-or-no questions, and every decision must be easy to explain to patients. Which algorithm fits best?
  options:
    - "A decision tree"
    - "k-means clustering"
    - "A deep neural network"
    - "Principal component analysis"
  answer: A
  explain: |
    A decision tree predicts through a sequence of simple questions, such as whether a temperature is above a threshold, so every decision can be traced and explained.
  why:
    B: "k-means groups unlabeled data; it does not make triage predictions from labeled examples."
    C: "A deep neural network can be accurate but is hard to explain decision by decision."
    D: "PCA reduces the number of variables; it does not make decisions."

- id: ut3-24
  skill: kmeans-applied
  tier: competitive
  type: scenario
  stem: |
    An analyst runs k-means twice on the same data with k = 4 and gets noticeably different clusters each time. What is the most likely reason?
  options:
    - "k-means cannot handle more than 3 clusters"
    - "The data must have changed between the runs"
    - "The two runs started from different initial centroids"
    - "The elbow method picked a different k each time"
  answer: C
  explain: |
    k-means usually begins by placing centroids at random, and different starting points can settle into different final clusters. Software therefore runs the algorithm several times and keeps the result with the smallest within-cluster sum of squares.
  why:
    A: "k-means works with any k the analyst chooses."
    B: "The data were the same; the random start alone can change the result."
    D: "k was fixed at 4 in both runs, so the elbow method played no part."

- id: ut3-25
  skill: algo-match
  tier: core
  type: scenario
  stem: |
    A hospital wants to predict how many days each patient will stay, using age, diagnosis, and type of surgery. What kind of task is this?
  options:
    - "Classification"
    - "Regression"
    - "Clustering"
    - "Association rules"
  answer: B
  explain: |
    The answer is a number, days in the hospital, so the task is regression. Classification would predict a label from a fixed set, such as short stay or long stay.
  why:
    A: "Classification predicts a category, but the length of a stay is a number."
    C: "Clustering finds groups in unlabeled data; here there is a known numeric target."
    D: "Association rules find items that occur together, such as products bought in one trip."

- id: ut3-26
  skill: reg-metrics
  tier: competitive
  type: calculation
  stem: |
    A model overestimates the prices of two houses by 2 and 3 thousand dollars and underestimates two others by 1 and 2 thousand dollars. What is its mean absolute error, in thousands of dollars?
  options:
    - "0.5"
    - "2"
    - "2.12"
    - "4.5"
  ordered: true
  answer: B
  explain: |
    MAE averages the sizes of the errors, ignoring direction: (2 + 3 + 1 + 2) / 4 = 2. The model misses by $2,000 on average.
  why:
    A: "0.5 averages the signed errors, letting overestimates and underestimates cancel."
    C: "2.12 is the RMSE, which squares the errors before averaging."
    D: "4.5 is the MSE, the mean of the squared errors."
  verify: "statistics.mean([2, 3, 1, 2])"

- id: ut3-27
  skill: confusion-matrix
  tier: competitive
  type: visual
  stem: |
    The confusion matrix shows a churn model's results for 250 customers. What is its recall?
  figure:
    type: confusion
    caption: A churn model's results for 250 customers.
    tp: 45
    fp: 15
    fn: 30
    tn: 160
    positive: Churned
    negative: Stayed
  options:
    - "0.6"
    - "0.75"
    - "0.82"
    - "0.91"
  ordered: true
  answer: A
  explain: |
    Recall is the share of actual positives the model catches: TP / (TP + FN) = 45 / (45 + 30) = 0.6. The model misses 30 of the 75 customers who churned.
  why:
    B: "0.75 is precision, 45 / 60, which divides by the customers predicted to churn."
    C: "0.82 is accuracy, 205 / 250."
    D: "0.91 is specificity, 160 / 175, the share of staying customers correctly cleared."
  verify: "45 / (45 + 30)"

- id: ut3-28
  skill: metric-choice
  tier: champion
  type: scenario
  stem: |
    A model that ranks loan applicants by risk of default has an AUC of 0.80. What does this mean?
  options:
    - "It labels 80% of all applicants correctly at its threshold"
    - "80% of the applicants it flags as risky really do default"
    - "It flags 80% of the applicants who really do default"
    - "It ranks a random defaulter above a random non-defaulter 80% of the time"
  answer: D
  explain: |
    AUC summarizes the ROC curve across every threshold. It equals the probability that the model gives a randomly chosen positive case, here an applicant who defaults, a higher score than a randomly chosen negative case.
  why:
    A: "That describes accuracy, which depends on a single threshold; AUC summarizes all thresholds."
    B: "That describes a precision of 0.80."
    C: "That describes a recall of 0.80."
