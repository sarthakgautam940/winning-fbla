# Unit 6 test: AI Basics

- id: ut6-01
  skill: ai-definitions
  tier: core
  type: concept
  stem: |
    Where do today's generative AI models sit among artificial intelligence, machine learning, and deep learning?
  options:
    - "Inside deep learning, which is part of machine learning and AI"
    - "Outside machine learning, as a separate branch of AI"
    - "Above AI, as the broadest of the four fields"
    - "Inside machine learning but outside deep learning"
  answer: A
  explain: |
    AI contains machine learning, which contains deep learning. Today's generative models, such as large language models and image generators, are deep neural networks, so they sit inside deep learning.
  why:
    B: "Generative models learn from data, so they are machine learning, not a separate branch."
    C: "AI is the broadest field; everything else sits inside it."
    D: "Generative models are deep neural networks, so they belong inside deep learning."

- id: ut6-02
  skill: ai-definitions
  tier: competitive
  type: concept
  stem: |
    Which system is an example of symbolic AI rather than connectionist AI?
  options:
    - "A neural network trained on thousands of labeled photos"
    - "A model that learns word embeddings from text"
    - "An expert system that applies hand-written if-then rules"
    - "A deep network that learns a game from experience"
  answer: C
  explain: |
    Symbolic AI represents knowledge as readable symbols, rules, and logic that people write down, as an expert system does. Connectionist AI instead learns patterns from data with networks of artificial neurons.
  why:
    A: "A neural network that learns from photos is connectionist."
    B: "Learning embeddings from text is done by neural networks, which is connectionist."
    D: "A deep network learning from experience is connectionist, even when it plays a game."

- id: ut6-03
  skill: ai-history
  tier: competitive
  type: recall
  stem: |
    In what year did Frank Rosenblatt introduce the perceptron, an artificial neuron that learns from examples?
  options:
    - "1950"
    - "1955"
    - "1956"
    - "1958"
  ordered: true
  answer: D
  explain: |
    Rosenblatt's perceptron dates from 1958. It came just after the field was named and launched in 1955 and 1956.
  why:
    A: "1950 is the year of Turing's paper proposing the imitation game."
    B: "1955 is the year of the proposal that coined the term artificial intelligence."
    C: "1956 is the year of the Dartmouth summer workshop."

- id: ut6-04
  skill: ai-history
  tier: competitive
  type: recall
  stem: |
    Which IBM system won the television quiz show Jeopardy! against two champions in 2011?
  options:
    - "Deep Blue"
    - "Watson"
    - "AlphaGo"
    - "ELIZA"
  answer: B
  explain: |
    IBM's Watson won Jeopardy! in 2011, answering natural-language clues against two of the show's champions.
  why:
    A: "Deep Blue was IBM's chess computer, which beat Garry Kasparov in 1997."
    C: "AlphaGo was DeepMind's Go program, which beat Lee Sedol in 2016."
    D: "ELIZA was a 1960s chatbot built at MIT."

- id: ut6-05
  skill: computer-vision
  tier: core
  type: concept
  stem: |
    In a typical 8-bit grayscale image, a pixel value of 0 appears black. What does a pixel value of 255 appear as?
  options:
    - "Black"
    - "White"
    - "Middle gray"
    - "Red"
  answer: B
  explain: |
    Each grayscale pixel holds one number, typically from 0 (black) to 255 (white), with the values in between giving shades of gray.
  why:
    A: "0 is black; 255 is the other end of the scale."
    C: "Middle gray is near 128, halfway along the scale."
    D: "A grayscale image has no color channels; red would need a separate red value."

- id: ut6-06
  skill: computer-vision
  tier: competitive
  type: calculation
  stem: |
    A handwritten-digit image is 28 pixels wide and 28 pixels tall, in grayscale. How many numbers does a computer store to represent it?
  options:
    - "28"
    - "56"
    - "784"
    - "2,352"
  ordered: true
  answer: C
  explain: |
    A grayscale image stores one number per pixel, and the grid has 28 × 28 = 784 pixels.
  why:
    A: "28 counts only one row of pixels."
    B: "56 adds the width and height instead of multiplying them."
    D: "2,352 multiplies by 3 for red, green, and blue, but a grayscale image needs one number per pixel."
  verify: "28 * 28"

- id: ut6-07
  skill: nlp-speech
  tier: competitive
  type: scenario
  stem: |
    A navigation app reads street names aloud to the driver. Which technology turns the written names into spoken audio?
  options:
    - "Speech recognition"
    - "Speech synthesis"
    - "Sentiment analysis"
    - "Named entity recognition"
  answer: B
  explain: |
    Speech synthesis, also called text-to-speech, turns text into spoken audio. Speech recognition does the reverse, turning speech into text.
  why:
    A: "Speech recognition turns spoken words into text, the opposite direction."
    C: "Sentiment analysis judges whether text is positive or negative."
    D: "Named entity recognition finds names of people, places, and dates in text."

- id: ut6-08
  skill: nlp-speech
  tier: champion
  type: concept
  stem: |
    In the sentence "Maria told Ana that the package had arrived for her," a system must work out who "her" refers to. What kind of ambiguity is this?
  options:
    - "Polysemy"
    - "Attachment ambiguity"
    - "A speech recognition error"
    - "Reference ambiguity"
  answer: D
  explain: |
    Reference ambiguity arises when a pronoun could point to more than one noun: "her" could mean Maria or Ana. Resolving it takes context or world knowledge.
  why:
    A: "Polysemy is one word with several related meanings, such as head as a body part or as a leader."
    B: "Attachment ambiguity concerns which part of a sentence a phrase connects to."
    C: "The sentence is written text, so there is nothing to mishear."

- id: ut6-09
  skill: ai-subfields
  tier: core
  type: scenario
  stem: |
    A farm robot uses cameras to spot ripe strawberries, decides which ones to pick first, and then moves a gripper arm to pick them. Which part of this is the "act" step of sense, plan, act?
  options:
    - "Moving the gripper arm to pick the berries"
    - "Spotting ripe strawberries with cameras"
    - "Deciding which berries to pick first"
    - "Storing a map of the strawberry field"
  answer: A
  explain: |
    Acting means changing the world through actuators, such as motors and grippers. Spotting berries with cameras is sensing, and choosing the order is planning.
  why:
    B: "Cameras are sensors, so spotting the berries is the sense step."
    C: "Choosing which berries to pick first is the plan step."
    D: "Storing a map is knowledge the robot uses to plan, not an action on the world."

- id: ut6-10
  skill: genai-nature
  tier: core
  type: concept
  stem: |
    An image generator is asked for "a fox reading a newspaper" and produces a picture. How does it typically create it?
  options:
    - "It looks up a stored photo that matches"
    - "It edits the single closest training image"
    - "It combines learned patterns into a new image"
    - "It searches the internet for the image"
  answer: C
  explain: |
    A generative model learns patterns from many training images, such as what foxes and newspapers look like, and combines them into new content. It does not store copies of its training images to look up.
  why:
    A: "Generative models do not keep a library of photos to retrieve; they generate from learned patterns."
    B: "The model creates a new image rather than editing one training example."
    D: "An image generator produces the image itself; it does not search the web for it."

- id: ut6-11
  skill: genai-models
  tier: competitive
  type: concept
  stem: |
    Compared with a GAN, what is a typical drawback of the images a variational autoencoder (VAE) produces?
  options:
    - "Its training is far less stable"
    - "It cannot generate new samples"
    - "It suffers more from mode collapse"
    - "Its images tend to be blurrier"
  answer: D
  explain: |
    VAEs train stably and learn a smooth, well-organized latent space, but their images tend to be blurrier than those of GANs or diffusion models.
  why:
    A: "Unstable training is a known weakness of GANs, not VAEs."
    B: "A VAE generates new samples by decoding points from its latent space."
    C: "Mode collapse is a known GAN failure, where the generator keeps producing nearly the same output."

- id: ut6-12
  skill: genai-models
  tier: champion
  type: concept
  stem: |
    Which pairing of a generative model family with one of its typical weaknesses is correct?
  options:
    - "GAN: unstable training and mode collapse"
    - "Diffusion model: blurry images from a smooth latent space"
    - "VAE: slow generation over many denoising steps"
    - "Autoregressive transformer: unable to generate text"
  answer: A
  explain: |
    GANs produce sharp images in one fast pass, but their training is unstable and can collapse onto a few outputs. Blurriness belongs to VAEs, slow step-by-step generation to diffusion models, and autoregressive transformers are the standard way to generate text.
  why:
    B: "Blurry output from a smooth latent space describes a VAE; diffusion models are known for high quality."
    C: "Slow generation over many denoising steps describes a diffusion model."
    D: "Autoregressive transformers generate text one token at a time; that is their main use."

- id: ut6-13
  skill: genai-uses
  tier: core
  type: scenario
  stem: |
    A company's support team uses a generative model to draft replies to customer emails, and agents edit each draft before sending it. Which area of use is this?
  options:
    - "Healthcare"
    - "Scientific research"
    - "Digital art and media"
    - "Business"
  answer: D
  explain: |
    Drafting routine messages that people then review is a common business use of generative AI. It saves time while a person stays responsible for what is sent.
  why:
    A: "Nothing here involves patients or medical care."
    B: "The drafts answer customers; they do not advance a research question."
    C: "The output is customer correspondence, not art or media content."

- id: ut6-14
  skill: genai-limits
  tier: competitive
  type: scenario
  stem: |
    A user pastes a 400-page technical manual into a chatbot and asks about chapter 1, but the chatbot seems unaware of the early chapters. Which limitation is the most likely cause?
  options:
    - "The model's knowledge cutoff"
    - "The model's context window"
    - "A temperature setting that is too low"
    - "Poisoning of the model's training data"
  answer: B
  explain: |
    The context window is the maximum number of tokens a model can consider at once. Text beyond that limit is cut off or never seen, so a very long document may not fit.
  why:
    A: "A knowledge cutoff limits what the model learned in training, not what it can read in a prompt."
    C: "Temperature controls randomness, not how much text the model can see."
    D: "Nothing suggests tampering with the training data."

- id: ut6-15
  skill: llm-definition
  tier: core
  type: concept
  stem: |
    ChatGPT, released in 2022, was built by fine-tuning which kind of model?
  options:
    - "A model from the GPT-3.5 series"
    - "BERT, an encoder-only model"
    - "AlexNet, an image classifier"
    - "Deep Blue, a chess program"
  answer: A
  explain: |
    ChatGPT is a chat model: a GPT-3.5-series large language model that was fine-tuned further, with human feedback, to follow instructions and hold conversations.
  why:
    B: "BERT is an encoder-only model built for understanding text, not for generating chat replies."
    C: "AlexNet is a 2012 image classifier, not a language model."
    D: "Deep Blue was a 1990s chess computer, not a language model."

- id: ut6-16
  skill: tokens
  tier: competitive
  type: calculation
  stem: |
    A model has a context window of 8,000 tokens, and a user wants room for a reply of up to 2,000 tokens. At most how many tokens can the prompt, including any pasted documents, use?
  options:
    - "2,000"
    - "4,000"
    - "6,000"
    - "8,000"
  ordered: true
  answer: C
  explain: |
    The context window holds everything at once: instructions, documents, conversation, and the reply. Reserving 2,000 tokens for the reply leaves 8,000 minus 2,000 = 6,000 tokens for the prompt.
  why:
    A: "2,000 is the room saved for the reply, not the room left for the prompt."
    B: "4,000 splits the window in half, but only the reply's 2,000 tokens need to be reserved."
    D: "8,000 forgets that the reply must fit in the same window as the prompt."
  verify: "8000 - 2000"

- id: ut6-17
  skill: transformers-attention
  tier: competitive
  type: concept
  stem: |
    In the sentence "The trophy didn't fit in the suitcase because it was too big," what does self-attention help a transformer do as it processes the word "it"?
  options:
    - "Translate the whole sentence into another language first"
    - "Count how many tokens the sentence contains in total"
    - "Delete the words that carry little or no meaning"
    - "Weigh how much each other word, such as trophy, matters to it"
  answer: D
  explain: |
    Self-attention lets each token look at every other token in the input and decide how much each one matters to its meaning. Linking "it" to "trophy" is exactly this kind of context building.
  why:
    A: "Translation is a task a model can perform, not what attention does inside it."
    B: "Counting tokens is the tokenizer's job, not attention's."
    C: "Attention reweights words; it does not delete them."

- id: ut6-18
  skill: transformers-attention
  tier: champion
  type: concept
  stem: |
    A company needs a model that reads support tickets and sorts them into categories; it does not need to generate text. Which design fits best, and why?
  options:
    - "Encoder-only, like BERT, since it reads text in both directions"
    - "Decoder-only, like GPT, since it reads text in both directions"
    - "Encoder-only, like BERT, since it predicts the next token"
    - "Decoder-only, like GPT, since it cannot generate text"
  answer: A
  explain: |
    Sorting tickets is an understanding task. Encoder-only models such as BERT read each token with context from both sides, which suits classification. Decoder-only models such as GPT predict each next token from earlier ones and are built for generation.
  why:
    B: "Decoder-only models see only earlier tokens; reading in both directions is the encoder's strength."
    C: "BERT is not trained to predict the next token; that is how decoder-only models like GPT work."
    D: "Decoder-only models are the ones built to generate text."

- id: ut6-19
  skill: llm-training
  tier: competitive
  type: concept
  stem: |
    In reinforcement learning from human feedback (RLHF), what do human labelers typically provide?
  options:
    - "The full text of every document used in pretraining"
    - "New model architectures for the team to test"
    - "Rankings of different model responses, used to train a reward model"
    - "Hand-written rules the model must follow word for word"
  answer: C
  explain: |
    In RLHF, people compare or rank model outputs. Those preferences train a reward model, and reinforcement learning then tunes the language model toward responses people prefer.
  why:
    A: "Pretraining text comes from large collections, not from labelers writing documents."
    B: "Labelers judge outputs; they do not design architectures."
    D: "RLHF learns from preferences rather than rigid rules."

- id: ut6-20
  skill: llm-training
  tier: champion
  type: concept
  stem: |
    Which stage of building a chat model trains it on human-written examples of good responses to instructions?
  options:
    - "Pretraining"
    - "Training the reward model"
    - "Optimizing against the reward model"
    - "Instruction tuning"
  answer: D
  explain: |
    Instruction tuning fine-tunes the pretrained model on demonstrations: instructions paired with good responses written by people. RLHF comes after it, using people's rankings of responses rather than written examples.
  why:
    A: "Pretraining uses huge amounts of ordinary text with next-token prediction, not demonstrations."
    B: "The reward model learns from people's rankings of responses, not from written examples."
    C: "This RLHF step improves the model using the reward model's scores, not human-written answers."

- id: ut6-21
  skill: prompting
  tier: core
  type: scenario
  stem: |
    Which prompt is an example of zero-shot prompting?
  options:
    - "Three labeled reviews, then a new review to label"
    - "A request to label a review, with no examples given"
    - "One labeled review, then a new review to label"
    - "A model retrained on 1,000 labeled reviews"
  answer: B
  explain: |
    Zero-shot prompting asks for a task with no examples in the prompt. Giving one or more worked examples is few-shot prompting, and retraining the model is fine-tuning, not prompting.
  why:
    A: "Three examples make this few-shot prompting."
    C: "Even one example makes this few-shot prompting, sometimes called one-shot."
    D: "Retraining changes the model's weights; that is fine-tuning, not prompting."

- id: ut6-22
  skill: prompting
  tier: competitive
  type: concept
  stem: |
    Why does few-shot prompting often beat zero-shot prompting on an unusual task?
  options:
    - "The examples show the pattern wanted, through in-context learning"
    - "The examples permanently retrain the model's weights"
    - "Adding examples lowers the model's temperature"
    - "Longer prompts always produce better answers"
  answer: A
  explain: |
    Worked examples in the prompt show the model exactly what output is wanted, and it follows the pattern within that conversation. This in-context learning changes no weights; the effect lasts only as long as the examples are in the prompt.
  why:
    B: "In-context learning changes no weights; the examples affect only this prompt."
    C: "Temperature is a separate sampling setting; examples do not change it."
    D: "Length alone does not help; irrelevant text can even hurt. The examples help because they show the pattern."

- id: ut6-23
  skill: sampling
  tier: competitive
  type: concept
  stem: |
    A developer wants a model to give the same answer every time it receives the same prompt. Which sampling setting does that?
  options:
    - "Top-k sampling with k = 50"
    - "Top-p sampling with p = 1"
    - "Top-k sampling with k = 1"
    - "A temperature of 2"
  answer: C
  explain: |
    Top-k keeps only the k most likely tokens. With k = 1 only the top token survives, so the model always picks it and repeats the same answer. A larger k, a top-p of 1, or a high temperature all leave room for sampling to vary.
  why:
    A: "With k = 50 the model samples among 50 tokens, so answers vary."
    B: "Top-p with p = 1 keeps every token, so the model can pick any of them."
    D: "A high temperature flattens the probabilities, making answers vary more."

- id: ut6-24
  skill: embeddings
  tier: competitive
  type: calculation
  stem: |
    Two documents have embedding vectors a = (1, 1, 0, 1) and b = (1, 0, 1, 1). What is their cosine similarity, to the nearest thousandth?
  options:
    - "0.333"
    - "0.667"
    - "1"
    - "2"
  ordered: true
  answer: B
  explain: |
    Cosine similarity divides the dot product by the product of the lengths. The dot product is 1 + 0 + 0 + 1 = 2, and each vector has length √3, so the similarity is 2 / 3, about 0.667.
  why:
    A: "0.333 divides by 3 + 3 = 6 instead of by √3 × √3 = 3."
    C: "1 would mean the vectors point in exactly the same direction, but they differ."
    D: "2 is the raw dot product, before dividing by the lengths."
  verify: |
    a = np.array([1, 1, 0, 1])
    b = np.array([1, 0, 1, 1])
    ans = float(a @ b / (np.linalg.norm(a) * np.linalg.norm(b)))

- id: ut6-25
  skill: rag-agents
  tier: competitive
  type: scenario
  stem: |
    In a retrieval-augmented generation (RAG) system, how are the passages added to the prompt usually chosen?
  options:
    - "By exact keyword matching that ignores meaning"
    - "By retraining the model on all documents each time"
    - "By letting the model recall them from its training"
    - "By embedding similarity between question and passages"
  answer: D
  explain: |
    The question is turned into an embedding, and a vector database finds the stored passages whose embeddings are most similar, which means the closest in meaning. Those passages are added to the prompt for the model to answer from.
  why:
    A: "Retrieval in RAG usually matches meaning through embeddings, so it finds passages that use different words."
    B: "RAG works at question time without retraining; that is its advantage over fine-tuning."
    C: "RAG supplies passages from outside the model so it does not have to rely on memory."

- id: ut6-26
  skill: llm-capabilities
  tier: champion
  type: scenario
  stem: |
    For a report due tomorrow, an LLM gives a fluent, confident answer that includes three specific statistics but no sources. What is the best next step?
  options:
    - "Verify each statistic in a reliable source before using it"
    - "Ask the same model whether it is sure, and accept a yes"
    - "Use the numbers, since a confident tone signals accuracy"
    - "Rephrase the prompt until two answers agree, then use them"
  answer: A
  explain: |
    Fluency is not accuracy: an LLM can state invented numbers in the same confident tone as real ones. Specific figures need checking against a reliable source before they go into a report.
  why:
    B: "The same model can confirm its own mistake just as confidently, so its yes adds little."
    C: "Confidence in the wording says nothing about whether a number is true."
    D: "Two sampled answers can agree on the same wrong number; agreement is not a source."
