# Unit 7 test: Perception, Representation, and Reasoning

- id: ut7-01
  skill: big-ideas
  tier: core
  type: scenario
  stem: |
    A phone unlocks when its camera recognizes the owner's face. Which of AI4K12's five big ideas does this mainly illustrate?
  options:
    - "Natural interaction"
    - "Societal impact"
    - "Perception"
    - "Learning"
  answer: C
  explain: |
    Perception is the big idea that computers perceive the world through sensors, extracting meaning from raw sensor data such as camera pixels. Recognizing a face is perception.
  why:
    A: "Natural interaction is about communicating with people, such as through language or emotion."
    B: "Societal impact concerns how AI affects people and society."
    D: "Learning is about computers learning from data; the unlock step itself is recognizing a face."

- id: ut7-02
  skill: kr-forms
  tier: core
  type: concept
  stem: |
    A knowledge base describes the concept Dog with entries such as is-a: Mammal, legs: 4, and sound: bark. Which form of knowledge representation is this?
  options:
    - "A frame with slots and fillers"
    - "An IF-THEN production rule"
    - "A truth table for a formula"
    - "A Bayesian network of variables"
  answer: A
  explain: |
    A frame is a structured record for a concept, with slots (attributes such as legs) and fillers (values such as 4). The is-a slot links Dog to a more general frame, so Dog can inherit Mammal's properties.
  why:
    B: "A production rule is an IF-THEN statement."
    C: "A truth table lists the truth values of a logical formula."
    D: "A Bayesian network represents probabilistic dependencies between variables."

- id: ut7-03
  skill: kg-ontology
  tier: competitive
  type: concept
  stem: |
    A knowledge graph stores the triple (Paris, capitalOf, France). What role does capitalOf play?
  options:
    - "The subject, the node the statement is about"
    - "The predicate, the labeled edge that relates the two nodes"
    - "The object, the node at the end of the edge"
    - "A probability attached to the statement"
  answer: B
  explain: |
    A knowledge-graph triple has the form subject, predicate, object. Paris is the subject, France is the object, and capitalOf is the predicate, the labeled edge that says how they are related.
  why:
    A: "The subject is Paris."
    C: "The object is France."
    D: "Triples state facts; they carry no probabilities."

- id: ut7-04
  skill: kg-ontology
  tier: champion
  type: concept
  stem: |
    A semantic network says that Bird has the property CanFly, Penguin is-a Bird, and Penguin has the property CannotFly. What should a reasoner conclude about whether penguins fly?
  options:
    - "Penguins can fly, because properties are always inherited from general classes"
    - "Nothing, because the network contradicts itself and is unusable"
    - "Penguins can fly, because Bird is listed before Penguin"
    - "Penguins cannot fly, because a property on the specific class overrides the inherited default"
  answer: D
  explain: |
    Inheritance passes properties down from general classes, but those properties act as defaults. A property stored directly on a more specific class, such as Penguin, overrides the inherited one, which is how semantic networks and frames handle exceptions.
  why:
    A: "Inherited properties are defaults that more specific information can override."
    B: "Exceptions are expected; the more specific property resolves the conflict."
    C: "The order in which facts are listed does not decide inheritance."

- id: ut7-05
  skill: prop-logic
  tier: core
  type: concept
  stem: |
    The statement $$P \rightarrow Q$$ is read "if P, then Q." What is its truth value when P is false and Q is false?
  options:
    - "True"
    - "False"
    - "Undefined"
    - "True only if P is later shown to be true"
  answer: A
  explain: |
    An implication is false only when its condition is true and its conclusion is false. When P is false, the implication makes no claim that could be broken, so it counts as true, often called vacuously true.
  why:
    B: "The implication fails only when P is true and Q is false."
    C: "In propositional logic every combination of truth values has a defined result."
    D: "The truth value is fixed by the current values of P and Q."

- id: ut7-06
  skill: prop-logic
  tier: competitive
  type: concept
  stem: |
    Which statement is logically equivalent to "If it rains, the game is canceled"?
  options:
    - "If the game is canceled, it rained"
    - "If it does not rain, the game is not canceled"
    - "If the game is not canceled, it did not rain"
    - "It rains and the game is canceled"
  answer: C
  explain: |
    The contrapositive, if not Q then not P, is always equivalent to if P then Q. The converse and the inverse are not equivalent: the game could be canceled for another reason.
  why:
    A: "This is the converse; the game might be canceled for some other reason."
    B: "This is the inverse, which is equivalent to the converse, not to the original."
    D: "An implication does not claim that it actually rains."

- id: ut7-07
  skill: prop-logic
  tier: champion
  type: calculation
  stem: |
    How many of the 8 rows in the truth table for $$(P \wedge Q) \rightarrow R$$ make the formula false?
  options:
    - "1"
    - "2"
    - "4"
    - "7"
  ordered: true
  answer: A
  explain: |
    An implication is false only when its condition is true and its conclusion is false. The condition, P and Q, is true only when both are true, so the formula is false in exactly one row: P true, Q true, R false.
  why:
    B: "The condition is true in only two rows, and R is false in just one of them."
    C: "4 counts every row where R is false, ignoring the condition."
    D: "7 is the number of rows where the formula is true."
  verify: |
    vals = [True, False]
    ans = sum(1 for p in vals for q in vals for r in vals if p and q and not r)

- id: ut7-08
  skill: fol-syntax
  tier: competitive
  type: concept
  stem: |
    In the first-order logic sentence $$Teaches(Osei, Ava)$$, what is Teaches?
  options:
    - "A constant"
    - "A predicate"
    - "A variable"
    - "A quantifier"
  answer: B
  explain: |
    Teaches is a predicate: it states a relationship between objects and is either true or false. Osei and Ava are constants that name specific objects.
  why:
    A: "Constants name specific objects, such as Osei and Ava."
    C: "Variables, such as x, stand for unspecified objects."
    D: "Quantifiers are the symbols for all and there exists."

- id: ut7-09
  skill: fol-translate
  tier: competitive
  type: concept
  stem: |
    Which first-order logic sentence says "Every student owns a laptop"?
  options:
    - '$$\forall x\,(Student(x) \wedge OwnsLaptop(x))$$'
    - '$$\exists x\,(Student(x) \wedge OwnsLaptop(x))$$'
    - '$$\forall x\,(OwnsLaptop(x) \rightarrow Student(x))$$'
    - '$$\forall x\,(Student(x) \rightarrow OwnsLaptop(x))$$'
  answer: D
  explain: |
    A universal statement pairs "for all" with an implication: for anything, if it is a student, then it owns a laptop. Using "and" instead would claim that everything in the domain is a student.
  why:
    A: "With and, the sentence claims everything is both a student and a laptop owner."
    B: "This says only that some student owns a laptop."
    C: "This reverses the implication: everyone who owns a laptop is a student."

- id: ut7-10
  skill: fol-translate
  tier: champion
  type: concept
  stem: |
    Which first-order logic sentence says "Some robot is red"?
  options:
    - '$$\forall x\,(Robot(x) \rightarrow Red(x))$$'
    - '$$\exists x\,(Robot(x) \rightarrow Red(x))$$'
    - '$$\exists x\,(Robot(x) \wedge Red(x))$$'
    - '$$\forall x\,(Robot(x) \wedge Red(x))$$'
  answer: C
  explain: |
    An existential statement pairs "there exists" with "and": there is something that is both a robot and red. With an implication instead, the sentence would be true as soon as anything is not a robot, because a false condition makes an implication true.
  why:
    A: "This says every robot is red."
    B: "This is the classic trap: any non-robot satisfies it, so it does not guarantee a red robot exists."
    D: "This says everything is a red robot."

- id: ut7-11
  skill: fol-negation
  tier: competitive
  type: concept
  stem: |
    What is the negation of "All birds fly," written $$\forall x\,(Bird(x) \rightarrow Flies(x))$$?
  options:
    - '$$\forall x\,(Bird(x) \rightarrow \neg Flies(x))$$'
    - '$$\exists x\,(Bird(x) \rightarrow Flies(x))$$'
    - '$$\forall x\,(\neg Bird(x) \rightarrow \neg Flies(x))$$'
    - '$$\exists x\,(Bird(x) \wedge \neg Flies(x))$$'
  answer: D
  explain: |
    Negating a universal statement gives an existential one: "not all birds fly" means "some bird does not fly." Moving the negation inside turns "for all" into "there exists" and the implication into "and" with a negated conclusion.
  why:
    A: "This says no bird flies, which is much stronger than saying not all birds fly."
    B: "This only weakens the quantifier and keeps the original implication; it is not a negation."
    C: "This is the inverse, a different statement about things that are not birds."

- id: ut7-12
  skill: inference-rules
  tier: core
  type: concept
  stem: |
    If the fire alarm sounds, the building is evacuated. The fire alarm sounds. Therefore, the building is evacuated. Which rule of inference is this?
  options:
    - "Modus ponens"
    - "Modus tollens"
    - "Affirming the consequent"
    - "Denying the antecedent"
  answer: A
  explain: |
    Modus ponens takes "if P, then Q" together with "P" and concludes "Q." It is the most basic valid rule of inference.
  why:
    B: "Modus tollens reasons from not Q to not P."
    C: "Affirming the consequent reasons from Q back to P, which is invalid."
    D: "Denying the antecedent reasons from not P to not Q, which is invalid."

- id: ut7-13
  skill: inference-rules
  tier: champion
  type: concept
  stem: |
    If a shape is a square, it has four sides. This shape has four sides. Therefore, it is a square. How should this argument be judged?
  options:
    - "Valid, by modus ponens"
    - "Valid, by modus tollens"
    - "Invalid, because it affirms the consequent"
    - "Invalid, because it denies the antecedent"
  answer: C
  explain: |
    The argument reasons from the rule's conclusion (four sides) back to its condition (square), which is the fallacy of affirming the consequent. A rectangle or a trapezoid also has four sides.
  why:
    A: "Modus ponens would need the shape to be known to be a square first."
    B: "Modus tollens would reason from not having four sides to not being a square."
    D: "Denying the antecedent would reason from not a square to not four sides."

- id: ut7-14
  skill: chaining
  tier: competitive
  type: scenario
  stem: |
    A diagnostic expert system starts from the hypothesis "the engine has a fuel problem" and works backward through its rules to find the facts that would confirm it. What strategy is this?
  options:
    - "Forward chaining"
    - "Backward chaining"
    - "Breadth-first search"
    - "Gradient descent"
  answer: B
  explain: |
    Backward chaining is goal-driven: it starts from a hypothesis and looks for the rules and facts that would establish it. MYCIN, the medical expert system, used this goal-oriented strategy.
  why:
    A: "Forward chaining is data-driven: it starts from known facts and fires rules to derive new ones."
    C: "Breadth-first search explores a state space level by level, not rules toward a goal."
    D: "Gradient descent trains models by minimizing a loss."

- id: ut7-15
  skill: chaining
  tier: champion
  type: calculation
  stem: |
    A rule system starts with the facts A and B and has four rules: if A and B, then C; if C, then D; if B, then E; if D and E, then F. Forward chaining fires rules until nothing new can be derived. Which new facts are derived?
  options:
    - "C only"
    - "C and D only"
    - "C, D, and E only"
    - "C, D, E, and F"
  answer: D
  explain: |
    A and B give C, and B gives E. C then gives D, and once D and E are both known, the last rule gives F. No further rule can fire, so the new facts are C, D, E, and F.
  why:
    A: "C also triggers the rule that gives D."
    B: "B alone gives E, and D with E then gives F."
    C: "With D and E both derived, the last rule fires and gives F."
  verify: |
    facts = {"A", "B"}
    rules = [({"A", "B"}, "C"), ({"C"}, "D"), ({"B"}, "E"), ({"D", "E"}, "F")]
    changed = True
    while changed:
        changed = False
        for cond, new in rules:
            if cond <= facts and new not in facts:
                facts.add(new)
                changed = True
    new = sorted(facts - {"A", "B"})
    ans = ", ".join(new[:-1]) + ", and " + new[-1]

- id: ut7-16
  skill: kr-ml
  tier: competitive
  type: scenario
  stem: |
    A tax-preparation program applies hundreds of IF-THEN rules written by tax experts instead of a model learned from examples. What is a main strength of this rule-based approach?
  options:
    - "Each conclusion can be traced to the exact rules that produced it"
    - "It learns new rules automatically from millions of tax returns"
    - "It handles situations that its experts never anticipated"
    - "It needs no updates when the tax laws change"
  answer: A
  explain: |
    Rule-based systems are transparent: every conclusion comes with the chain of rules that fired, so experts can check and explain it. Their weaknesses are brittleness in situations no rule covers and the effort of updating rules by hand.
  why:
    B: "Learning rules from data is what machine learning does; these rules are written by experts."
    C: "Rule-based systems are brittle when no rule covers a situation."
    D: "When laws change, someone must rewrite the rules."

- id: ut7-17
  skill: logic-vs-prob
  tier: core
  type: concept
  stem: |
    How does probability-based reasoning differ from logic-based reasoning?
  options:
    - "It can only handle facts that are entirely true or false"
    - "It represents uncertainty with degrees of belief between 0 and 1"
    - "It never changes its conclusions when new evidence arrives"
    - "It works only with numbers, never with words or categories"
  answer: B
  explain: |
    Logic treats statements as true or false and derives certain conclusions. Probability-based reasoning assigns degrees of belief between 0 and 1 and updates them as evidence arrives, which suits noisy, uncertain information.
  why:
    A: "Handling only true-or-false facts describes classical logic."
    C: "Updating beliefs with evidence, as in Bayes' theorem, is central to probabilistic reasoning."
    D: "Probabilities can describe categories and events, not just numbers."

- id: ut7-18
  skill: logic-vs-prob
  tier: competitive
  type: scenario
  stem: |
    A smart thermostat treats 22 degrees as "warm" to a degree of 0.6 and "hot" to a degree of 0.2. Which approach is this?
  options:
    - "Bayesian probability"
    - "Propositional logic"
    - "Fuzzy logic"
    - "First-order logic"
  answer: C
  explain: |
    Fuzzy logic, introduced by Lotfi Zadeh in 1965, lets a statement be true to a degree between 0 and 1. Here 0.6 measures how well 22 degrees fits the vague category "warm," not the chance that it is warm.
  why:
    A: "A probability measures uncertainty about whether something is true, not how well a value fits a vague category."
    B: "Propositional logic treats each statement as entirely true or false."
    D: "First-order logic adds predicates and quantifiers but keeps truth values true or false."

- id: ut7-19
  skill: bayes-reasoning
  tier: champion
  type: calculation
  stem: |
    Thirty percent of a company's email is spam. The word "winner" appears in 40 percent of spam emails and in 2 percent of other emails. If an email contains "winner," what is the probability that it is spam, to the nearest hundredth?
  options:
    - "0.12"
    - "0.30"
    - "0.40"
    - "0.90"
  ordered: true
  answer: D
  explain: |
    Picture 1,000 emails: 300 are spam, and 120 of them contain "winner"; 700 are not spam, and 14 of them contain it. Of the 134 emails with the word, 120 are spam, and 120 / 134 is about 0.90.
  why:
    A: "0.12 is the share of all emails that are spam and contain the word."
    B: "0.30 is the base rate, before the word is seen."
    C: "0.40 is P(winner given spam), the reverse of what was asked."
  verify: "0.3 * 0.4 / (0.3 * 0.4 + 0.7 * 0.02)"

- id: ut7-20
  skill: bn-structure
  tier: core
  type: concept
  stem: |
    In a Bayesian network, what does a directed edge from Rain to WetRoad mean?
  options:
    - "Rain and WetRoad are independent of each other in every case"
    - "Rain directly influences WetRoad, so WetRoad's table is conditioned on Rain"
    - "WetRoad directly causes Rain, so Rain's table depends on WetRoad"
    - "Rain and WetRoad always take exactly the same value"
  answer: B
  explain: |
    An edge points from a parent to a child, meaning the parent directly influences the child. The child's conditional probability table gives its probabilities for each value of its parents.
  why:
    A: "An edge represents a direct dependence, not independence."
    C: "The arrow points from Rain to WetRoad, the direction of influence."
    D: "Influence is probabilistic: rain makes a wet road likely, not certain."

- id: ut7-21
  skill: bn-joint
  tier: competitive
  type: calculation
  stem: |
    In a Bayesian network, Study and Sleep both point to Pass, and all three are true-or-false variables. How many probabilities must the network's tables specify?
  options:
    - "3"
    - "6"
    - "7"
    - "8"
  ordered: true
  answer: B
  explain: |
    A true-or-false node with k true-or-false parents needs 2 to the k numbers. Study and Sleep have no parents, so each needs 1, and Pass has 2 parents, so it needs 4. That makes 1 + 1 + 4 = 6, compared with 7 for a full joint table.
  why:
    A: "3 gives each node a single number, ignoring Pass's four parent combinations."
    C: "7 is the size of a full joint table, 2 to the 3rd minus 1."
    D: "8 counts every row of the full joint table without using the fact that the probabilities sum to 1."
  verify: "1 + 1 + 2 ** 2"

- id: ut7-22
  skill: bn-joint
  tier: champion
  type: calculation
  stem: |
    A Bayesian network has Study and Sleep as parents of Pass. P(Study) = 0.6, P(Sleep) = 0.7, and P(Pass given Study and no Sleep) = 0.5. What is the probability that a student studies, does not sleep, and passes?
  options:
    - "0.09"
    - "0.15"
    - "0.21"
    - "0.5"
  ordered: true
  answer: A
  explain: |
    The joint probability is the product of each variable's probability given its parents: P(Study) × P(no Sleep) × P(Pass given Study and no Sleep) = 0.6 × 0.3 × 0.5 = 0.09.
  why:
    B: "0.15 leaves out P(Study)."
    C: "0.21 uses P(Sleep) = 0.7 instead of P(no Sleep) = 0.3."
    D: "0.5 is only the conditional probability of passing."
  verify: "0.6 * (1 - 0.7) * 0.5"

- id: ut7-23
  skill: bn-independence
  tier: competitive
  type: scenario
  stem: |
    A fever can be caused by flu or by a bacterial infection, and the two causes are independent of each other. A patient has a fever, and a lab test then confirms a bacterial infection. What happens to the probability that the patient also has flu?
  options:
    - "It rises, because the patient is clearly sick"
    - "It stays the same, because flu and infection are independent"
    - "It becomes 1, because a fever requires both causes"
    - "It falls, because the infection already explains the fever"
  answer: D
  explain: |
    Flu and infection are independent until their common effect, the fever, is observed. Once the confirmed infection explains the fever, flu becomes less likely. This pattern is called explaining away.
  why:
    A: "Confirming one cause makes the other less needed, so its probability falls."
    B: "The causes are independent only until their shared effect is observed."
    C: "Either cause alone can produce a fever."

- id: ut7-24
  skill: bn-inference
  tier: competitive
  type: concept
  stem: |
    A doctor's Bayesian network has arrows from diseases to symptoms. Using it to estimate the probability of a disease from an observed symptom is which kind of reasoning?
  options:
    - "Predictive (causal) reasoning"
    - "Forward chaining"
    - "Diagnostic reasoning"
    - "Adversarial search"
  answer: C
  explain: |
    Diagnostic reasoning runs against the arrows, from an observed effect back to its likely causes, using Bayes' theorem. Predictive reasoning runs with the arrows, from causes to effects.
  why:
    A: "Predictive reasoning goes from causes to effects, such as from a disease to likely symptoms."
    B: "Forward chaining fires logical rules from known facts; it does not update probabilities."
    D: "Adversarial search chooses moves in games against an opponent."

- id: ut7-25
  skill: search-basics
  tier: competitive
  type: calculation
  stem: |
    Three nodes are waiting to be expanded. P has a path cost so far of g = 2 and a heuristic estimate of h = 6; Q has g = 7 and h = 3; R has g = 4 and h = 5. Which node does A* search expand next?
  options:
    - "P"
    - "Q"
    - "R"
    - "P and R are tied"
  answer: A
  explain: |
    A* expands the node with the lowest f = g + h: P has 2 + 6 = 8, Q has 7 + 3 = 10, and R has 4 + 5 = 9. P has the lowest total. Greedy best-first search, which looks only at h, would choose Q instead.
  why:
    B: "Q has the lowest h, which is what greedy best-first search uses; A* adds the cost so far."
    C: "R's f is 9, higher than P's 8."
    D: "P's f is 8 and R's is 9, so they are not tied."
  verify: |
    f = {"P": 2 + 6, "Q": 7 + 3, "R": 4 + 5}
    ans = min(f, key=f.get)

- id: ut7-26
  skill: reasoning-types
  tier: core
  type: scenario
  stem: |
    An AI must choose its moves in a two-player board game against an opponent who is trying to win. Which kind of reasoning problem is this, and which algorithm fits?
  options:
    - "Classification, solved with a decision tree"
    - "Statistical inference, solved with a Bayesian network"
    - "Combinatorial search, solved with breadth-first search"
    - "Adversarial search, solved with minimax and alpha-beta pruning"
  answer: D
  explain: |
    Games against an opponent are adversarial search problems. Minimax assumes the opponent plays its best moves, and alpha-beta pruning skips branches that cannot change the decision, so the program can search deeper.
  why:
    A: "Classification assigns categories; choosing moves against an opponent is a search problem."
    B: "Statistical inference estimates probabilities from evidence."
    C: "Breadth-first search ignores the opponent's attempts to win."
