# Unit 7 test: Perception, Representation, and Reasoning

- id: ut7-01
  skill: big-ideas
  tier: core
  type: scenario
  stem: |
    A self-checkout camera recognizes which fruit a shopper places on the scale. Which of AI4K12's five big ideas does this mainly show?
  options:
    - "Learning"
    - "Natural Interaction"
    - "Perception"
    - "Societal Impact"
  answer: C
  explain: |
    Perception is a computer extracting meaning from sensor data, here turning camera pixels into "this is a banana." The other big ideas concern learning from data, interacting with people, and effects on society.
  why:
    A: "Learning is how a model improves from data; the scenario describes recognizing what a camera sees."
    B: "Natural Interaction concerns conversing with people and reading their emotions."
    D: "Societal Impact concerns AI's effects on people and society, not a recognition task."

- id: ut7-02
  skill: kr-forms
  tier: core
  type: concept
  stem: |
    A knowledge base describes the concept Dog with entries such as is-a: Mammal, legs: 4, and sound: bark. Which form of knowledge representation is this?
  options:
    - "A frame with slots and fillers"
    - "An IF-THEN production rule"
    - "A truth table for a formula"
    - "A Bayesian network of variables"
  answer: A
  explain: |
    A frame is a structured record for a concept, with slots (attributes such as legs) and fillers (values such as 4). The is-a slot links Dog to a more general frame, so Dog can inherit Mammal's properties.
  why:
    B: "A production rule is an IF-THEN statement."
    C: "A truth table lists the truth values of a logical formula."
    D: "A Bayesian network represents probabilistic dependencies between variables."

- id: ut7-03
  skill: kg-ontology
  tier: competitive
  type: concept
  stem: |
    How are an ontology and a knowledge graph usually related?
  options:
    - "They are two different names for exactly the same structure"
    - "The ontology sets the classes and relations; the graph holds the facts"
    - "The graph is a neural network trained to predict the ontology"
    - "The ontology is an alphabetical index of the graph's nodes"
  answer: B
  explain: |
    An ontology defines a domain's classes, properties, and rules, such as Person, Film, and directedBy. A knowledge graph is the network of specific entities and the labeled facts that link them, and it is usually organized by an ontology so that programs can query it and reason over it.
  why:
    A: "They are different layers: one defines the vocabulary, and the other stores facts that use it."
    C: "A knowledge graph stores facts as labeled links; it is not a neural network."
    D: "An ontology defines meanings and rules, not an index of node names."

- id: ut7-04
  skill: kg-ontology
  tier: champion
  type: concept
  stem: |
    A knowledge graph stores (Mars, orbits, Sun) and (Phobos, orbits, Mars). A rule says that if X orbits Y and Y orbits Z, then X indirectlyOrbits Z. Which new triple can a reasoner add?
  options:
    - "(Sun, indirectlyOrbits, Phobos)"
    - "(Mars, indirectlyOrbits, Phobos)"
    - "(Phobos, orbits, Sun)"
    - "(Phobos, indirectlyOrbits, Sun)"
  answer: D
  explain: |
    Match the rule with X = Phobos, Y = Mars, and Z = Sun: Phobos orbits Mars and Mars orbits the Sun, so Phobos indirectlyOrbits the Sun. Rules like this let a knowledge graph derive facts that were never stored.
  why:
    A: "This reverses the direction of the relationship."
    B: "Mars orbits the Sun, not Phobos; the subject and object are swapped."
    C: "The rule concludes indirectlyOrbits, not orbits; Phobos does not orbit the Sun directly."

- id: ut7-05
  skill: prop-logic
  tier: core
  type: concept
  stem: |
    Let S mean "the alarm is set" and L mean "the door is locked." Which expression says "The alarm is set and the door is not locked"?
  options:
    - "$$S \\land \\neg L$$"
    - "$$S \\lor \\neg L$$"
    - "$$\\neg S \\land L$$"
    - "$$S \\rightarrow \\neg L$$"
  answer: A
  explain: |
    "And" becomes a conjunction, and "not locked" becomes the negation of L, so the sentence is S AND NOT L. It claims that both parts are true at once.
  why:
    B: "OR would be true if only one part held, but the sentence says both hold."
    C: "This negates the wrong part: it says the alarm is not set and the door is locked."
    D: "An implication says one part leads to the other; the sentence simply states that both are true."

- id: ut7-06
  skill: prop-logic
  tier: competitive
  type: concept
  stem: |
    What is the negation of "The printer is out of paper or it is jammed"?
  options:
    - "The printer is not out of paper or it is not jammed"
    - "The printer is out of paper and it is jammed"
    - "The printer is not out of paper and it is not jammed"
    - "The printer is not out of paper, so it is jammed"
  answer: C
  explain: |
    By De Morgan's laws, the negation of "P or Q" is "not P and not Q." For the OR to be false, both parts must be false: the printer is not out of paper, and it is not jammed.
  why:
    A: "Negating an OR turns it into an AND; keeping OR is the classic slip."
    B: "This keeps both parts true, the opposite of what a negation needs."
    D: "A negation does not create an if-then link between the parts."

- id: ut7-07
  skill: prop-logic
  tier: champion
  type: calculation
  stem: |
    For how many of the 8 combinations of truth values for P, Q, and R is $$(P \rightarrow Q) \land R$$ true?
  options:
    - "3"
    - "4"
    - "6"
    - "8"
  ordered: true
  answer: A
  explain: |
    The expression needs R true and P implies Q true. R is true in 4 of the 8 combinations, and among the 4 combinations of P and Q, the implication is false only when P is true and Q is false. That leaves 3.
  why:
    B: "4 counts every combination with R true, including the one where P is true and Q is false."
    C: "6 counts the combinations where the implication is true, ignoring R."
    D: "The expression is false whenever R is false, so it cannot be true for every combination."
  verify: |
    ans = sum(1 for p in (True, False) for q in (True, False) for r in (True, False) if ((not p) or q) and r)

- id: ut7-08
  skill: fol-syntax
  tier: competitive
  type: concept
  stem: |
    The predicate Taller(x, y) means "x is taller than y." How should a knowledge base record the fact that Rosa is taller than Theo?
  options:
    - "Rosa(Taller, Theo)"
    - "Taller(Rosa, Theo)"
    - "Taller(Rosa) ∧ Taller(Theo)"
    - "Taller(Theo, Rosa)"
  answer: B
  explain: |
    A predicate is applied to its arguments in order: Taller(Rosa, Theo) says the first argument, Rosa, is taller than the second, Theo.
  why:
    A: "Rosa is a constant, not a predicate, so it cannot take arguments."
    C: "Taller takes two arguments; this uses it with one and loses the comparison."
    D: "This says Theo is taller than Rosa, the reverse."

- id: ut7-09
  skill: fol-translate
  tier: competitive
  type: concept
  stem: |
    Which first-order logic sentence says "Every student owns a laptop"?
  options:
    - '$$\forall x\,(Student(x) \wedge OwnsLaptop(x))$$'
    - '$$\exists x\,(Student(x) \wedge OwnsLaptop(x))$$'
    - '$$\forall x\,(OwnsLaptop(x) \rightarrow Student(x))$$'
    - '$$\forall x\,(Student(x) \rightarrow OwnsLaptop(x))$$'
  answer: D
  explain: |
    A universal statement pairs "for all" with an implication: for anything, if it is a student, then it owns a laptop. Using "and" instead would claim that everything in the domain is a student.
  why:
    A: "With and, the sentence claims everything is both a student and a laptop owner."
    B: "This says only that some student owns a laptop."
    C: "This reverses the implication: everyone who owns a laptop is a student."

- id: ut7-10
  skill: fol-translate
  tier: champion
  type: concept
  stem: |
    Which sentence says "Every student has a teacher who knows them"?
  options:
    - "$$\\forall x\\, \\exists y\\, (\\text{Student}(x) \\land \\text{Teacher}(y) \\land \\text{Knows}(y, x))$$"
    - "$$\\exists y\\, \\forall x\\, (\\text{Student}(x) \\rightarrow (\\text{Teacher}(y) \\land \\text{Knows}(y, x)))$$"
    - "$$\\forall x\\, (\\text{Student}(x) \\rightarrow \\exists y\\, (\\text{Teacher}(y) \\land \\text{Knows}(y, x)))$$"
    - "$$\\forall x\\, (\\text{Student}(x) \\land \\exists y\\, (\\text{Teacher}(y) \\rightarrow \\text{Knows}(y, x)))$$"
  answer: C
  explain: |
    For every x that is a student, there exists some y who is a teacher and knows x. The universal pairs with an implication, the existential pairs with "and," and the teacher may differ from student to student.
  why:
    A: "Using AND with the universal claims that everything is a student."
    B: "Putting the existential first says one single teacher knows every student."
    D: "This pairs the universal with AND and the existential with an implication, the classic double error."

- id: ut7-11
  skill: fol-negation
  tier: competitive
  type: concept
  stem: |
    What is the negation of "Some student answered every question"?
  options:
    - "No student answered any question"
    - "Some student missed every question"
    - "Every student answered some question"
    - "Every student missed at least one question"
  answer: D
  explain: |
    Negating "some student" gives "every student," and negating "answered every question" gives "missed at least one question." So the negation says every student missed at least one question.
  why:
    A: "This is far stronger: a student could answer most questions and still make the original false."
    B: "This keeps the existential, but a negation must switch some to every."
    C: "This switches the quantifiers but never negates answering."

- id: ut7-12
  skill: inference-rules
  tier: core
  type: concept
  stem: |
    If the fire alarm sounds, the building is evacuated. The fire alarm sounds. Therefore, the building is evacuated. Which rule of inference is this?
  options:
    - "Modus ponens"
    - "Modus tollens"
    - "Affirming the consequent"
    - "Denying the antecedent"
  answer: A
  explain: |
    Modus ponens takes "if P, then Q" together with "P" and concludes "Q." It is the most basic valid rule of inference.
  why:
    B: "Modus tollens reasons from not Q to not P."
    C: "Affirming the consequent reasons from Q back to P, which is invalid."
    D: "Denying the antecedent reasons from not P to not Q, which is invalid."

- id: ut7-13
  skill: inference-rules
  tier: champion
  type: concept
  stem: |
    If the pump fails, the tank overflows. If the tank overflows, a warning buzzer sounds. The buzzer did not sound. What follows?
  options:
    - "The tank overflowed"
    - "The pump failed"
    - "The pump did not fail"
    - "Nothing can be concluded"
  answer: C
  explain: |
    Apply modus tollens twice. The buzzer did not sound, so the tank did not overflow; the tank did not overflow, so the pump did not fail.
  why:
    A: "An overflow would have set off the buzzer, which did not sound."
    B: "A failed pump would have led, through the overflow, to the buzzer."
    D: "Modus tollens works backward through both rules, so a conclusion does follow."

- id: ut7-14
  skill: chaining
  tier: competitive
  type: concept
  stem: |
    Why is backward chaining efficient when a system must answer one specific question?
  options:
    - "It fires every rule on every known fact"
    - "It explores only the rules relevant to the goal"
    - "It never needs any facts to reach a goal"
    - "It always finds more conclusions overall"
  answer: B
  explain: |
    Backward chaining starts from the goal and looks only for rules that could prove it, then for the facts those rules need. Rules that have nothing to do with the question are never touched.
  why:
    A: "Firing every rule on every fact describes forward chaining."
    C: "It still needs facts to finish each proof."
    D: "It aims at one goal; forward chaining is what derives every reachable conclusion."

- id: ut7-15
  skill: chaining
  tier: champion
  type: calculation
  stem: |
    A rule system starts with the facts A and B and has four rules: if A and B, then C; if C, then D; if B, then E; if D and E, then F. Forward chaining fires rules until nothing new can be derived. Which new facts are derived?
  options:
    - "C only"
    - "C and D only"
    - "C, D, and E only"
    - "C, D, E, and F"
  answer: D
  explain: |
    A and B give C, and B gives E. C then gives D, and once D and E are both known, the last rule gives F. No further rule can fire, so the new facts are C, D, E, and F.
  why:
    A: "C also triggers the rule that gives D."
    B: "B alone gives E, and D with E then gives F."
    C: "With D and E both derived, the last rule fires and gives F."
  verify: |
    facts = {"A", "B"}
    rules = [({"A", "B"}, "C"), ({"C"}, "D"), ({"B"}, "E"), ({"D", "E"}, "F")]
    changed = True
    while changed:
        changed = False
        for cond, new in rules:
            if cond <= facts and new not in facts:
                facts.add(new)
                changed = True
    new = sorted(facts - {"A", "B"})
    ans = ", ".join(new[:-1]) + ", and " + new[-1]

- id: ut7-16
  skill: kr-ml
  tier: competitive
  type: scenario
  stem: |
    Which task is better handled by a learned model than by hand-written rules?
  options:
    - "Recognizing spoken words from many different voices"
    - "Applying a published tax formula exactly"
    - "Checking that every order has an ID number"
    - "Converting distances from kilometers to miles"
  answer: A
  explain: |
    Voices vary in endless ways that no one could list as rules, so a model that learns patterns from many examples suits speech recognition. Exact formulas and fixed checks are better written as explicit rules.
  why:
    B: "A published formula is exact and must be explainable, a natural fit for rules."
    C: "A fixed check like this is a simple rule; nothing needs to be learned."
    D: "Unit conversion is an exact formula."

- id: ut7-17
  skill: logic-vs-prob
  tier: core
  type: concept
  stem: |
    Which statement uses logic-based reasoning?
  options:
    - "Clouds are thick, so it will probably rain"
    - "12 is divisible by 4, so by rule it is even"
    - "This photo is 90 percent likely to show a cat"
    - "The patient most likely has the flu"
  answer: B
  explain: |
    Logic-based reasoning applies rules to facts to reach certain conclusions: every number divisible by 4 is even, and 12 is divisible by 4, so 12 is even. The others express degrees of belief.
  why:
    A: "\"Probably\" signals a degree of belief, which is probability-based reasoning."
    C: "A percentage likelihood is a degree of belief."
    D: "\"Most likely\" weighs uncertain evidence, which is probability-based."

- id: ut7-18
  skill: logic-vs-prob
  tier: competitive
  type: scenario
  stem: |
    A washing machine's controller uses rules such as "IF the load is fairly heavy THEN wash longer," where "fairly heavy" holds to a degree between 0 and 1. What does this approach give the machine?
  options:
    - "Certain conclusions proved from exact, complete rules"
    - "The probability that the load will turn out to be heavy"
    - "Smooth adjustments instead of abrupt jumps between settings"
    - "Wash settings learned from many labeled example loads"
  answer: C
  explain: |
    This is fuzzy logic: the load is heavy to some degree, and rules that apply to matching degrees let the controller blend smoothly between settings rather than switching abruptly at a cutoff. That is why fuzzy logic is used in appliance and industrial control.
  why:
    A: "Classical logic gives certain true-or-false conclusions; here the rule holds only to a degree."
    B: "The degree describes how heavy the load is, which is already known, so it measures vagueness, not uncertainty."
    D: "The rules are written by people; nothing is learned from labeled examples."

- id: ut7-19
  skill: bayes-reasoning
  tier: champion
  type: calculation
  stem: |
    Three percent of checked bags at an airport contain a banned item. A scanner flags 85 percent of bags that contain one and 6 percent of bags that do not. If a bag is flagged, about what is the probability that it contains a banned item?
  options:
    - "3%"
    - "6%"
    - "8.4%"
    - "30.5%"
  ordered: true
  answer: D
  explain: |
    Imagine 10,000 bags: 300 contain a banned item, and the scanner flags 255 of them. Of the 9,700 other bags, it flags 582. So 255 of the 837 flagged bags hold a banned item: 255 / 837, about 30.5%.
  why:
    A: "3% is the prior, before the scan result is taken into account."
    B: "6% is the rate at which bags without a banned item are flagged."
    C: "8.4% is the share of all bags that get flagged, 837 of 10,000."
  verify: "0.03 * 0.85 / (0.03 * 0.85 + 0.97 * 0.06) * 100"

- id: ut7-20
  skill: bn-structure
  tier: core
  type: concept
  stem: |
    In a Bayesian network, what are the nodes that have no parents, and what do their tables hold?
  options:
    - "Nodes that depend directly on every other node"
    - "Root nodes, which need only their own prior probability"
    - "Nodes whose values can never be observed"
    - "Nodes with the most children, which hold the full joint"
  answer: B
  explain: |
    A root node has no incoming edges, so nothing in the network conditions it. Its table is simply its prior probability, such as P(Cloudy).
  why:
    A: "A node with no parents depends directly on none of the others."
    C: "Root nodes can be observed like any other variable."
    D: "No single table holds the full joint distribution; the network factors it into small tables."

- id: ut7-21
  skill: bn-joint
  tier: competitive
  type: calculation
  stem: |
    In a Bayesian network, Study and Sleep both point to Pass, and all three are true-or-false variables. How many probabilities must the network's tables specify?
  options:
    - "3"
    - "6"
    - "7"
    - "8"
  ordered: true
  answer: B
  explain: |
    A true-or-false node with k true-or-false parents needs 2 to the k numbers. Study and Sleep have no parents, so each needs 1, and Pass has 2 parents, so it needs 4. That makes 1 + 1 + 4 = 6, compared with 7 for a full joint table.
  why:
    A: "3 gives each node a single number, ignoring Pass's four parent combinations."
    C: "7 is the size of a full joint table, 2 to the 3rd minus 1."
    D: "8 counts every row of the full joint table without using the fact that the probabilities sum to 1."
  verify: "1 + 1 + 2 ** 2"

- id: ut7-22
  skill: bn-joint
  tier: champion
  type: calculation
  stem: |
    A Bayesian network has Study and Sleep as parents of Pass. P(Study) = 0.6, P(Sleep) = 0.7, and P(Pass given Study and no Sleep) = 0.5. What is the probability that a student studies, does not sleep, and passes?
  options:
    - "0.09"
    - "0.15"
    - "0.21"
    - "0.5"
  ordered: true
  answer: A
  explain: |
    The joint probability is the product of each variable's probability given its parents: P(Study) × P(no Sleep) × P(Pass given Study and no Sleep) = 0.6 × 0.3 × 0.5 = 0.09.
  why:
    B: "0.15 leaves out P(Study)."
    C: "0.21 uses P(Sleep) = 0.7 instead of P(no Sleep) = 0.3."
    D: "0.5 is only the conditional probability of passing."
  verify: "0.6 * (1 - 0.7) * 0.5"

- id: ut7-23
  skill: bn-independence
  tier: competitive
  type: scenario
  stem: |
    A fever can be caused by flu or by a bacterial infection, and the two causes are independent of each other. A patient has a fever, and a lab test then confirms a bacterial infection. What happens to the probability that the patient also has flu?
  options:
    - "It rises, because the patient is clearly sick"
    - "It stays the same, because flu and infection are independent"
    - "It becomes 1, because a fever requires both causes"
    - "It falls, because the infection already explains the fever"
  answer: D
  explain: |
    Flu and infection are independent until their common effect, the fever, is observed. Once the confirmed infection explains the fever, flu becomes less likely. This pattern is called explaining away.
  why:
    A: "Confirming one cause makes the other less needed, so its probability falls."
    B: "The causes are independent only until their shared effect is observed."
    C: "Either cause alone can produce a fever."

- id: ut7-24
  skill: bn-inference
  tier: competitive
  type: concept
  stem: |
    A doctor's Bayesian network has arrows from diseases to symptoms. Using it to estimate the probability of a disease from an observed symptom is which kind of reasoning?
  options:
    - "Predictive (causal) reasoning"
    - "Forward chaining"
    - "Diagnostic reasoning"
    - "Adversarial search"
  answer: C
  explain: |
    Diagnostic reasoning runs against the arrows, from an observed effect back to its likely causes, using Bayes' theorem. Predictive reasoning runs with the arrows, from causes to effects.
  why:
    A: "Predictive reasoning goes from causes to effects, such as from a disease to likely symptoms."
    B: "Forward chaining fires logical rules from known facts; it does not update probabilities."
    D: "Adversarial search chooses moves in games against an opponent."

- id: ut7-25
  skill: search-basics
  tier: competitive
  type: calculation
  stem: |
    Three nodes are waiting to be expanded. P has a path cost so far of g = 2 and a heuristic estimate of h = 6; Q has g = 7 and h = 3; R has g = 4 and h = 5. Which node does A* search expand next?
  options:
    - "P"
    - "Q"
    - "R"
    - "P and R are tied"
  answer: A
  explain: |
    A* expands the node with the lowest f = g + h: P has 2 + 6 = 8, Q has 7 + 3 = 10, and R has 4 + 5 = 9. P has the lowest total. Greedy best-first search, which looks only at h, would choose Q instead.
  why:
    B: "Q has the lowest h, which is what greedy best-first search uses; A* adds the cost so far."
    C: "R's f is 9, higher than P's 8."
    D: "P's f is 8 and R's is 9, so they are not tied."
  verify: |
    f = {"P": 2 + 6, "Q": 7 + 3, "R": 4 + 5}
    ans = min(f, key=f.get)

- id: ut7-26
  skill: reasoning-types
  tier: core
  type: scenario
  stem: |
    A streaming service must tag each uploaded song as rock, jazz, pop, or classical. Which kind of reasoning problem is this?
  options:
    - "Prediction"
    - "Adversarial search"
    - "Logical deduction"
    - "Classification"
  answer: D
  explain: |
    Assigning each item to one of a fixed set of categories is classification, which AI4K12 pairs with algorithms such as decision trees and neural networks. Prediction would estimate a number, such as how many times a song will be played.
  why:
    A: "Prediction estimates a number; here the output is a category."
    B: "Adversarial search plans moves against an opponent, as in games."
    C: "Logical deduction applies exact rules to reach certain conclusions, but genre has to be recognized from patterns in the audio."
