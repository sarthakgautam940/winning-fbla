# Unit 1 test: Data Literacy and Foundations

- id: ut1-01
  skill: ds-analytics
  tier: core
  type: scenario
  stem: |
    A delivery company's software looks at each driver's packages, traffic, and fuel costs, then chooses the order of stops that will use the least fuel. Which kind of analytics is this?
  options:
    - "Descriptive analytics"
    - "Diagnostic analytics"
    - "Predictive analytics"
    - "Prescriptive analytics"
  answer: D
  explain: |
    Prescriptive analytics recommends what to do, often by optimizing. Choosing the best order of stops is a decision the software makes, not just a forecast or a report.
  why:
    A: "Descriptive analytics reports what already happened, such as last week's fuel use."
    B: "Diagnostic analytics explains why something happened."
    C: "Predictive analytics forecasts what will happen; this system goes further and picks an action."

- id: ut1-02
  skill: ds-roles
  tier: competitive
  type: scenario
  stem: |
    A hospital asks which patients are most at risk of complications after surgery. One team member turns the question into a modeling problem, builds and validates a predictive model, and explains which factors drive the risk. Which role fits best?
  options:
    - "Data scientist"
    - "Data engineer"
    - "Data analyst"
    - "Machine learning engineer"
  answer: A
  explain: |
    Data scientists frame open questions, build predictive models, and design experiments. Turning a question into a model and explaining what drives its predictions is their core work.
  why:
    B: "Data engineers build the pipelines and storage that deliver the data."
    C: "Data analysts query existing data and report what it shows."
    D: "Machine learning engineers deploy and monitor models in production; building and validating the model comes first."

- id: ut1-03
  skill: data-structure
  tier: core
  type: scenario
  stem: |
    A company stores four kinds of data. Which one is semi-structured?
  options:
    - "A CSV file of each store's daily sales totals"
    - "Recorded audio of customer phone calls"
    - "Scanned images of paper store receipts"
    - "Log lines such as time=09:14 path=/cart status=200"
  answer: D
  explain: |
    Each log line labels its own values with keys (time, path, status), but lines need not share one fixed table layout. Self-describing records without a fixed schema are semi-structured, like JSON.
  why:
    A: "A CSV file is a table of rows and columns, so it is structured."
    B: "Audio recordings have no labeled fields, so they are unstructured."
    C: "Scanned images are unstructured until software extracts their content."

- id: ut1-04
  skill: metadata
  tier: competitive
  type: scenario
  stem: |
    Two analysts report different totals from the same revenue column, because one assumes it includes sales tax and the other assumes it does not. Which document would have prevented the confusion?
  options:
    - "A data dictionary"
    - "A data lake"
    - "A data pipeline"
    - "A primary key"
  answer: A
  explain: |
    A data dictionary records each field's meaning, type, and allowed values. With "revenue" defined in one place, both analysts would read the column the same way.
  why:
    B: "A data lake stores raw data; it does not define what fields mean."
    C: "A pipeline moves data between systems; it does not document meanings."
    D: "A primary key identifies rows; it says nothing about what a column means."

- id: ut1-05
  skill: data-structure
  tier: competitive
  type: concept
  stem: |
    Which statement about unstructured data, such as photos and emails, is accurate?
  options:
    - "It has no organization of any kind"
    - "It lacks a schema that labels its meaning in fields"
    - "It can be filtered with SQL just like a table"
    - "It is always smaller than the structured data a company holds"
  answer: B
  explain: |
    Unstructured does not mean disorganized: a photo is a grid of pixels and an email is a sequence of words. What is missing is a schema that labels the meaning of the content in fields you can query.
  why:
    A: "A photo is an organized grid of pixels; what is missing is labeled meaning, not all organization."
    C: "SQL filters on fields, and the meaning of a photo or an email is not stored in fields."
    D: "Unstructured data is a large and fast-growing share of what organizations collect."

- id: ut1-06
  skill: var-num-cat
  tier: core
  type: scenario
  stem: |
    Which of these variables is categorical even though its values are written with digits?
  options:
    - "Hours of sleep per night"
    - "Number of siblings"
    - "Ticket price in dollars"
    - "Airline flight number"
  answer: D
  explain: |
    A flight number such as 1729 is a label: adding or averaging flight numbers means nothing. Digits do not make a variable numeric; what matters is whether arithmetic on the values makes sense.
  why:
    A: "Hours of sleep is a measured quantity, so it is numeric."
    B: "Number of siblings is a count, so it is numeric."
    C: "A price is a numeric amount that can be averaged."

- id: ut1-07
  skill: var-levels
  tier: core
  type: recall
  stem: |
    A store records T-shirt sizes as small, medium, large, and extra large. Which level of measurement is this?
  options:
    - "Ordinal"
    - "Nominal"
    - "Interval"
    - "Ratio"
  answer: A
  explain: |
    The sizes have a natural order, but the gaps between them are not equal measured amounts, so the level is ordinal.
  why:
    B: "Nominal categories have no order, but sizes do."
    C: "Interval data have equal, meaningful differences, which size labels lack."
    D: "Ratio data need equal differences and a true zero."

- id: ut1-08
  skill: var-levels
  tier: champion
  type: concept
  stem: |
    Temperatures in degrees Fahrenheit are interval data. Which statement about them is meaningful?
  options:
    - "80 degrees is twice as hot as 40 degrees"
    - "0 degrees means the complete absence of heat"
    - "The ratio of 90 degrees to 30 degrees is 3"
    - "A 10-degree rise is the same change at 40 degrees as at 70"
  answer: D
  explain: |
    Interval data have equal, meaningful differences but no true zero. Differences can be compared, so a 10-degree rise is the same change anywhere on the scale, but ratios such as "twice as hot" are meaningless because 0 degrees Fahrenheit is not the absence of heat.
  why:
    A: "Ratios need a true zero, which the Fahrenheit scale lacks."
    B: "0 degrees Fahrenheit is an arbitrary point on the scale, not zero heat."
    C: "Ratios of interval values are not meaningful."

- id: ut1-09
  skill: var-disc-cont
  tier: competitive
  type: scenario
  stem: |
    A pediatric clinic records four variables at each visit. Which one is discrete?
  options:
    - "The child's weight in kilograms"
    - "The number of teeth the child has"
    - "The child's height in centimeters"
    - "The child's body temperature"
  answer: B
  explain: |
    Teeth are counted, so the variable takes only whole-number values: it is discrete. Weight, height, and temperature are measured and can take any value in a range.
  why:
    A: "Weight is measured, so it is continuous."
    C: "Height is measured, so it is continuous."
    D: "Temperature is measured, so it is continuous."

- id: ut1-10
  skill: base-binary
  tier: core
  type: calculation
  stem: |
    A device's status register shows the bit pattern 1011001. What number is that in base 10?
  options:
    - "77"
    - "89"
    - "91"
    - "178"
  ordered: true
  answer: B
  explain: |
    Write the place values under the seven bits: 64, 32, 16, 8, 4, 2, 1. The 1 bits sit under 64, 16, 8, and 1, and 64 + 16 + 8 + 1 = 89.
  why:
    A: "77 reads the bits in reverse order."
    C: "91 adds a 2 that is not in the pattern."
    D: "178 shifts every bit one place left, doubling the value."
  verify: 'int("1011001", 2)'

- id: ut1-11
  skill: base-binary
  tier: competitive
  type: calculation
  stem: |
    A student converts 150 to binary by repeatedly dividing by 2 and recording the remainders. Which 8-bit result is correct?
  options:
    - "01101001"
    - "10010100"
    - "10010110"
    - "10100110"
  ordered: true
  answer: C
  explain: |
    The remainders, from first to last, are 0, 1, 1, 0, 1, 0, 0, 1. Reading them from last to first gives 10010110, and 128 + 16 + 4 + 2 = 150 confirms it.
  why:
    A: "01101001 lists the remainders in the order they were found, which reverses the bits."
    B: "10010100 is 148; it is missing the 2's place."
    D: "10100110 is 166; it puts a 1 in the 32's place instead of the 16's."
  verify: |
    ans = format(150, "08b")

- id: ut1-12
  skill: base-hex
  tier: core
  type: calculation
  stem: |
    A web color code contains the hexadecimal pair 3C. What is 3C in decimal?
  options:
    - "42"
    - "60"
    - "61"
    - "195"
  ordered: true
  answer: B
  explain: |
    The left digit is in the 16s place and C means 12, so 3 × 16 + 12 = 60.
  why:
    A: "42 treats the 3 as tens, as if the number were decimal."
    C: "61 treats C as 13; C is 12."
    D: "195 is C3, the digits reversed."
  verify: 'int("3C", 16)'

- id: ut1-13
  skill: base-hex
  tier: competitive
  type: calculation
  stem: |
    Convert the 8-bit pattern 11010110 to hexadecimal.
  options:
    - "6D"
    - "B6"
    - "E6"
    - "D6"
  answer: D
  explain: |
    Split the bits into nibbles: 1101 and 0110. 1101 is 13, which is D, and 0110 is 6, so the result is D6.
  why:
    A: "6D swaps the two nibbles."
    B: "B is 1011; the first nibble, 1101, is 13, which is D."
    C: "E is 1110; the first nibble is 1101."
  verify: 'format(int("11010110", 2), "X")'

- id: ut1-14
  skill: feature-eng
  tier: competitive
  type: scenario
  stem: |
    To predict which new members stay loyal, an analyst creates the feature "days from sign-up to first purchase" from the sign_up_date and first_purchase_date columns. What kind of engineered feature is this?
  options:
    - "A difference between two existing columns"
    - "An aggregate summarizing many rows"
    - "A one-hot encoding of a category"
    - "A transformation that reduces skew"
  answer: A
  explain: |
    Subtracting one date from another turns two raw columns into a single, more meaningful number. Differences and ratios between existing columns are common engineered features.
  why:
    B: "An aggregate summarizes many rows, such as orders in the last 30 days; this uses two columns of one row."
    C: "One-hot encoding turns categories into columns of 0s and 1s."
    D: "A skew-reducing transformation, such as a log, reshapes one column's values."

- id: ut1-15
  skill: text-encoding
  tier: core
  type: calculation
  stem: |
    A message of 1,000 plain English letters, digits, and spaces is saved in UTF-8. How many bytes does it take?
  options:
    - "125"
    - "875"
    - "1,000"
    - "8,000"
  ordered: true
  answer: C
  explain: |
    UTF-8 stores every plain ASCII character, such as English letters, digits, and spaces, in exactly 1 byte. So 1,000 characters take 1,000 bytes.
  why:
    A: "125 divides by 8, as if each character were a single bit."
    B: "875 packs 7-bit ASCII codes together, but each character is stored in a full byte."
    D: "8,000 is the size in bits, not bytes."
  verify: 'len(("a" * 1000).encode("utf-8"))'

- id: ut1-16
  skill: bits-bytes
  tier: champion
  type: calculation
  stem: |
    How many more bytes are in 5 MiB (mebibytes) than in 5 MB (megabytes)?
  options:
    - "48,576"
    - "120,000"
    - "242,880"
    - "5,242,880"
  ordered: true
  answer: C
  explain: |
    One MiB is 1,024 × 1,024 = 1,048,576 bytes, and one MB is 1,000,000 bytes. 5 MiB is 5,242,880 bytes and 5 MB is 5,000,000 bytes, so the difference is 242,880 bytes.
  why:
    A: "48,576 is the difference for one MiB; it forgets to multiply by 5."
    B: "120,000 treats a MiB as 1,024,000 bytes, mixing binary and decimal steps."
    D: "5,242,880 is the size of 5 MiB itself, not the difference."
  verify: "5 * 1024 ** 2 - 5 * 10 ** 6"

- id: ut1-17
  skill: bin-arith
  tier: competitive
  type: calculation
  stem: |
    Two unsigned 4-bit values, 0111 and 0101, are added. What is the result, and does it fit in 4 bits?
  options:
    - "0010, and it fits in 4 bits"
    - "1100, but it overflows 4 bits"
    - "11100, so it needs 5 bits"
    - "1100, and it fits in 4 bits"
  answer: D
  explain: |
    Add column by column with carries: 0111 + 0101 = 1100, which is 7 + 5 = 12. An unsigned 4-bit value holds 0 to 15, so 12 fits.
  why:
    A: "0010 adds each column without carrying the 1s."
    B: "Unsigned 4 bits hold any value up to 15; a leading 1 is not a sign here."
    C: "11100 is 28; it carries one time too many."
  verify: |
    total = 0b0111 + 0b0101
    ans = f"{total:04b}, and it fits in 4 bits" if total < 16 else "overflow"

- id: ut1-18
  skill: bin-arith
  tier: champion
  type: calculation
  stem: |
    A thermometer stores readings as 8-bit two's complement integers. One reading is stored as 11110110. What temperature does it record, in degrees?
  options:
    - "-118"
    - "-10"
    - "10"
    - "246"
  ordered: true
  answer: B
  explain: |
    The leftmost bit is worth negative 128, and the remaining 1 bits add 64 + 32 + 16 + 4 + 2 = 118. So the value is negative 128 + 118, which is negative 10.
  why:
    A: "-118 treats the leading 1 as a minus sign on the other bits, which is sign-magnitude, not two's complement."
    C: "10 is the size of the number without its sign."
    D: "246 reads the pattern as an unsigned number."
  verify: |
    v = int("11110110", 2)
    ans = v - 256 if v >= 128 else v

- id: ut1-19
  skill: bits-bytes
  tier: core
  type: calculation
  stem: |
    What is the largest whole number a 16-bit unsigned integer can hold?
  options:
    - "32,767"
    - "65,535"
    - "65,536"
    - "4,294,967,295"
  ordered: true
  answer: B
  explain: |
    16 bits give 2 to the 16th power = 65,536 different values. Counting from 0, the largest is 65,536 minus 1 = 65,535.
  why:
    A: "32,767 is the largest 16-bit value when one bit is used for the sign."
    C: "65,536 is how many values there are; the largest is one less, because 0 is one of them."
    D: "4,294,967,295 is the largest 32-bit value."
  verify: "2 ** 16 - 1"

- id: ut1-20
  skill: ds-nature
  tier: competitive
  type: scenario
  stem: |
    A reader sees a viral chart and asks where its numbers came from, whether its axis starts at zero, and what data might be missing. Which ability is the reader using?
  options:
    - "Domain expertise"
    - "Machine learning"
    - "Prescriptive analytics"
    - "Data literacy"
  answer: D
  explain: |
    Data literacy is the ability to read, work with, analyze, and communicate with data, including questioning it. Asking about a chart's source, its axis, and what is missing is exactly that.
  why:
    A: "Domain expertise is knowledge of a subject area, such as medicine; the reader is questioning data in general."
    B: "Machine learning builds models that learn from data."
    C: "Prescriptive analytics recommends actions."

- id: ut1-21
  skill: media-encoding
  tier: competitive
  type: calculation
  stem: |
    An uncompressed mono recording uses 8,000 samples per second at 8 bits per sample. The file is 240,000 bytes. How many seconds long is it?
  options:
    - "3.75"
    - "15"
    - "30"
    - "240"
  ordered: true
  answer: C
  explain: |
    At 8 bits per sample, each sample is 1 byte, so one second of mono audio takes 8,000 bytes. 240,000 bytes / 8,000 bytes per second = 30 seconds.
  why:
    A: "3.75 divides the size in bytes by the rate in bits per second (64,000), mixing units."
    B: "15 assumes two channels, but the recording is mono."
    D: "240 divides the size in bits by the sample rate, forgetting the 8 bits per sample."
  verify: "240000 / (8000 * 8 / 8)"

- id: ut1-22
  skill: media-encoding
  tier: champion
  type: calculation
  stem: |
    Which RGB triple matches the hex color code #1E90C8?
  options:
    - "(30, 144, 200)"
    - "(30, 90, 200)"
    - "(225, 9, 140)"
    - "(30, 144, 184)"
  answer: A
  explain: |
    Split the code into pairs and convert each from hex: 1E = 16 + 14 = 30, 90 = 9 × 16 = 144, and C8 = 12 × 16 + 8 = 200.
  why:
    B: "90 was read as a decimal number; in hex it is 144."
    C: "This reverses the digits within each pair (E1, 09, 8C)."
    D: "184 is B8; C is 12, so C8 is 200."
  verify: |
    r, g, b = (int("1E90C8"[i:i + 2], 16) for i in (0, 2, 4))
    ans = f"({r}, {g}, {b})"

- id: ut1-23
  skill: study-types
  tier: competitive
  type: scenario
  stem: |
    A researcher randomly assigns 200 volunteers to drink either coffee or water before a memory test, then compares their scores. What kind of study is this, and what can it support?
  options:
    - "An observational study; it can show correlation but not cause"
    - "A census; it describes every member of a population"
    - "A secondary-data study; it reuses data someone else collected"
    - "An experiment; random assignment lets it support a causal claim"
  answer: D
  explain: |
    The researcher assigns the treatment at random, which makes this an experiment. Random assignment balances other factors between the groups, so a difference in scores can be attributed to the drink.
  why:
    A: "In an observational study researchers only observe; here they assigned the drinks."
    B: "A census measures an entire population; this study uses 200 volunteers."
    C: "The researcher collected new data, so this is primary data."

- id: ut1-24
  skill: big-data
  tier: core
  type: scenario
  stem: |
    A video platform stores billions of hours of footage, far more than any single server could hold. Which V of big data does this describe most directly?
  options:
    - "Velocity"
    - "Volume"
    - "Variety"
    - "Veracity"
  answer: B
  explain: |
    Volume is the sheer amount of data. Storage that outgrows any one machine is the classic volume challenge, which is why big data systems spread data across many computers.
  why:
    A: "Velocity is how fast data arrives, not how much is stored."
    C: "Variety is the mix of data types and formats."
    D: "Veracity is how accurate and trustworthy the data is."

- id: ut1-25
  skill: process-models
  tier: competitive
  type: recall
  stem: |
    In CRISP-DM, which phase comes immediately after Data Preparation?
  options:
    - "Modeling"
    - "Evaluation"
    - "Data Understanding"
    - "Deployment"
  answer: A
  explain: |
    CRISP-DM's six phases run Business Understanding, Data Understanding, Data Preparation, Modeling, Evaluation, and Deployment, and projects often loop back and forth between Data Preparation and Modeling.
  why:
    B: "Evaluation follows Modeling."
    C: "Data Understanding comes before Data Preparation."
    D: "Deployment is the final phase."

- id: ut1-26
  skill: wrangling
  tier: competitive
  type: visual
  stem: |
    A teacher wants one row per student, with the math and reading scores side by side. Which reshape turns this table into that layout?

    | student | subject | score |
    |---|---|---|
    | Ana | math | 81 |
    | Ana | reading | 88 |
    | Ben | math | 74 |
    | Ben | reading | 79 |
  options:
    - "Melt it from wide to long"
    - "Sort the rows by subject"
    - "Pivot it from long to wide"
    - "Drop the subject column"
  answer: C
  explain: |
    The table is in long format, one row per measurement. Pivoting to wide format spreads the subject values into their own columns, giving one row per student with a math column and a reading column.
  why:
    A: "Melting goes the other way, from wide to long; this table is already long."
    B: "Sorting changes the order of rows, not their layout."
    D: "Dropping the subject column would leave scores that can no longer be told apart."

- id: ut1-27
  skill: scaling
  tier: competitive
  type: calculation
  stem: |
    A feature ranges from a minimum of 12 to a maximum of 60. What is the min-max normalized value of 48?
  options:
    - "0.25"
    - "0.6"
    - "0.75"
    - "0.8"
  ordered: true
  answer: C
  explain: |
    Min-max normalization computes (x minus min) / (max minus min) = (48 minus 12) / (60 minus 12) = 36 / 48 = 0.75.
  why:
    A: "0.25 is 1 minus the correct value, measuring from the maximum instead of the minimum."
    B: "0.6 divides by the maximum, 60, instead of the range, 48."
    D: "0.8 divides 48 by the maximum without subtracting the minimum."
  verify: "(48 - 12) / (60 - 12)"

- id: ut1-28
  skill: scaling
  tier: champion
  type: concept
  stem: |
    A right-skewed feature is z-score standardized. Which statement about the result is true?
  options:
    - "Its mean and spread change, but its shape and the order of its values do not"
    - "It becomes normally distributed, because standardizing removes the skew"
    - "Its values are re-ranked so that the smallest becomes 0"
    - "Nothing changes except the name of its units"
  answer: A
  explain: |
    Standardizing subtracts the mean and divides by the standard deviation, a shift and a stretch. The result has mean 0 and standard deviation 1, but the distribution keeps its shape, so a right-skewed feature stays right-skewed, and every value keeps its rank.
  why:
    B: "A shift and a stretch cannot remove skew; a log transform is the tool for that."
    C: "Standardizing never reorders values, and the smallest value usually becomes negative, not 0."
    D: "The values themselves change: the mean becomes 0 and the standard deviation becomes 1."

- id: ut1-29
  skill: encoding-cats
  tier: core
  type: calculation
  stem: |
    A dataset has a color column with 3 values and a size column with 4 values. One-hot encoding keeps a column for every value of both. How many new columns does it create?
  options:
    - "2"
    - "4"
    - "7"
    - "12"
  ordered: true
  answer: C
  explain: |
    One-hot encoding makes one 0-or-1 column per category, separately for each column: 3 for color plus 4 for size gives 7.
  why:
    A: "2 counts the original columns, not their categories."
    B: "4 encodes only the size column."
    D: "12 multiplies the counts, as if every color-size combination got its own column."
  verify: "3 + 4"

- id: ut1-30
  skill: process-models
  tier: champion
  type: recall
  stem: |
    Which stage appears in IBM's data science methodology but has no separate phase of its own in CRISP-DM?
  options:
    - "Modeling"
    - "Evaluation"
    - "Analytic approach"
    - "Deployment"
  answer: C
  explain: |
    IBM's methodology splits the early work into more stages than CRISP-DM, including an explicit analytic-approach stage that decides how data can answer the question. Modeling, evaluation, and deployment appear in both.
  why:
    A: "Modeling is a phase in both CRISP-DM and IBM's methodology."
    B: "Evaluation is a phase in both."
    D: "Deployment is a phase in both."
