- id: ut4-11
  skill: sql-aggregate
  tier: champion
  type: sql
  stem: |
    Which query lists the product categories whose average price is above 10?
  options:
    - "`SELECT category FROM products WHERE AVG(price) > 10 GROUP BY category;`"
    - "`SELECT category FROM products WHERE price > 10 GROUP BY category;`"
    - "`SELECT category, AVG(price) FROM products ORDER BY AVG(price) > 10;`"
    - "`SELECT category FROM products GROUP BY category HAVING AVG(price) > 10;`"
  answer: D
  explain: |
    Conditions on aggregates such as AVG belong in HAVING, which filters groups after GROUP BY. WHERE runs before grouping, so it cannot use AVG.
  why:
    A: "WHERE cannot contain an aggregate function, so this query is an error."
    B: "This keeps categories with any single product over 10, not categories whose average is over 10."
    C: "Without GROUP BY there are no categories to average, and ORDER BY sorts rather than filters."

- id: ut4-12
  skill: sql-joins
  tier: competitive
  type: sql
  stem: |
    How many rows does this query return on the shop database?

    ```sql
    SELECT c.name, o.order_id
    FROM customers c
    LEFT JOIN orders o ON c.customer_id = o.customer_id;
    ```
  options:
    - "5"
    - "6"
    - "7"
    - "11"
  ordered: true
  answer: C
  explain: |
    Each order matches its customer, giving 6 rows: Maya 2, Noah 1, Priya 2, and Liam 1. A LEFT JOIN also keeps Zoe, who has no orders, with a NULL order_id, for 7 rows in all.
  why:
    A: "5 is the number of customers, but customers with two orders appear twice."
    B: "6 is what an INNER JOIN returns; a LEFT JOIN keeps the customer with no orders."
    D: "11 adds the numbers of customers and orders instead of matching rows."
  verify: 'rows("shop", "SELECT c.name, o.order_id FROM customers c LEFT JOIN orders o ON c.customer_id = o.customer_id")'

- id: ut4-13
