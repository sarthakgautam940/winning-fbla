- id: ut4-28
  skill: dev-tools
  tier: core
  type: scenario
  stem: |
    A data team wants to track every change to its analysis code, see who changed what, and roll back a mistake. Which tool is built for this?
  options:
    - "A spreadsheet"
    - "Git"
    - "A virtual environment"
    - "A Jupyter notebook"
  answer: B
