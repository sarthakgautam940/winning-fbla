- id: ut4-08
  skill: sql-null
  tier: champion
  type: sql
  stem: |
    In the school database, the CS1 course has four enrollments, with scores 92, NULL, 68, and 97. What does this query return?

    ```sql
    SELECT ROUND(AVG(score), 2) FROM enrollments WHERE course_id = 'CS1';
    ```
  options:
    - "64.25"
    - "85.67"
    - "92"
    - "257"
  ordered: true
  answer: B
  explain: |
    AVG skips NULL values, so it averages only the three real scores: (92 + 68 + 97) / 3 = 257 / 3, which rounds to 85.67.
  why:
    A: "64.25 divides by 4, treating the NULL as 0."
    C: "92 is the median of the three scores, not their average."
    D: "257 is the sum of the three scores."
  verify: |
    ans = scalar("school", "SELECT ROUND(AVG(score), 2) FROM enrollments WHERE course_id = 'CS1'")

- id: ut4-09
  skill: sql-aggregate
  tier: competitive
  type: sql
  stem: |
    Which customer_id values does this query return on the shop database?

    ```sql
    SELECT customer_id FROM orders
    GROUP BY customer_id
    HAVING COUNT(*) >= 2;
    ```
  options:
    - "1 only"
    - "3 only"
    - "1, 2, 3, and 4"
    - "1 and 3"
  answer: D
  explain: |
    Grouping orders by customer gives counts of 2 for customer 1, 1 for customer 2, 2 for customer 3, and 1 for customer 4. HAVING keeps the groups with at least 2 orders: customers 1 and 3.
  why:
    A: "Customer 3 also placed 2 orders."
    B: "Customer 1 also placed 2 orders."
    C: "HAVING removes customers 2 and 4, who placed only 1 order each."
  verify: |
    r = sql("shop", "SELECT customer_id FROM orders GROUP BY customer_id HAVING COUNT(*) >= 2 ORDER BY customer_id")
    ans = " and ".join(str(x[0]) for x in r)

