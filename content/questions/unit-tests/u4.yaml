    How many rows does this query return on the shop database?

    ```sql
    SELECT DISTINCT city FROM customers;
    ```
  options:
    - "2"
    - "3"
    - "4"
    - "5"
  ordered: true
  answer: B
  explain: |
    The five customers live in Austin, Denver, Austin, Boston, and Denver. DISTINCT removes repeated values, leaving Austin, Denver, and Boston: 3 rows.
