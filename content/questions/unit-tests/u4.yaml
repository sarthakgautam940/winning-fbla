# Unit 4 test: Tools for Data and AI

- id: ut4-01
  skill: keys
  tier: core
  type: concept
  stem: |
    In the shop database, every value in orders.customer_id must match a value in customers.customer_id. What is orders.customer_id?
  options:
    - "A foreign key"
    - "The primary key of orders"
    - "A composite key"
    - "An index on customers"
  answer: A
  explain: |
    A foreign key is a column whose values must match the primary key of another table. Here it links each order to the customer who placed it.
  why:
    B: "The primary key of orders is order_id, which identifies each order."
    C: "A composite key combines two or more columns; this is a single column."
    D: "An index speeds up lookups; it does not link tables."

- id: ut4-02
  skill: keys
  tier: competitive
  type: concept
  stem: |
    The order_items table has the primary key (order_id, product_id). What does this composite key prevent?
  options:
    - "An order containing more than one product"
    - "A product appearing in more than one order"
    - "A quantity greater than 1 for any product"
    - "The same product being listed twice in one order"
  answer: D
  explain: |
    A primary key must be unique, so each pair of order_id and product_id can appear only once. One order can hold many products and one product can appear in many orders, but a product cannot be listed twice in the same order; the quantity column records how many.
  why:
    A: "Different product_id values make different pairs, so an order can hold many products."
    B: "Different order_id values make different pairs, so a product can appear in many orders."
    C: "The quantity column is not part of the key and can hold any number."

- id: ut4-03
  skill: normalization
  tier: champion
  type: concept
  stem: |
    A table has the columns order_id (the primary key), customer_id, customer_city, and order_date. Each customer's city is repeated on every one of that customer's orders. Which normal form does this table violate?
  options:
    - "First normal form"
    - "Second normal form"
    - "Third normal form"
    - "None; the table is fully normalized"
  answer: C
  explain: |
    customer_city depends on customer_id, which in turn depends on order_id: a transitive dependency of one non-key column on another. Third normal form forbids that, so the city belongs in the customers table.
  why:
    A: "Every value is atomic, so first normal form holds."
    B: "The key is a single column, so no partial dependency is possible, and second normal form holds."
    D: "Repeating the city on every order is exactly the redundancy normalization removes."

- id: ut4-04
  skill: db-integrity
  tier: competitive
  type: scenario
  stem: |
    A bank transfer subtracts $500 from one account, but the system crashes before adding the money to the other account. Which ACID property ensures that the subtraction is undone?
  options:
    - "Atomicity"
    - "Consistency"
    - "Isolation"
    - "Durability"
  answer: A
  explain: |
    Atomicity means a transaction happens completely or not at all. Because the transfer did not finish, the database rolls back the partial change.
  why:
    B: "Consistency keeps data valid under the database's rules; all-or-nothing behavior is atomicity."
    C: "Isolation keeps concurrent transactions from interfering with one another."
    D: "Durability preserves committed changes after a crash; this transaction never committed."

- id: ut4-05
  skill: sql-nosql
  tier: competitive
  type: scenario
  stem: |
    Which workload is the best fit for a NoSQL document database rather than a relational database?
  options:
    - "Bank account balances that need strict transactions"
    - "Payroll records with a fixed set of columns"
    - "Student grades that are joined to course tables"
    - "A product catalog where each item type has different attributes"
  answer: D
  explain: |
    Document databases store flexible, JSON-like records, so items with different attributes, such as shoe sizes for one product and screen sizes for another, fit without a rigid schema.
  why:
    A: "Strict multi-table transactions are a strength of relational databases."
    B: "A fixed set of columns fits a relational table well."
    C: "Joins between related tables are a relational strength."

- id: ut4-06
  skill: sql-select
  tier: core
