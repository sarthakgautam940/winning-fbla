  tier: competitive
  type: concept
  stem: |
    In PyTorch, what does autograd do?
  options:
    - "Automatically chooses the best model architecture for a dataset"
    - "Grades a model's predictions against the test set"
    - "Records operations on tensors and computes gradients automatically"
    - "Converts a pandas DataFrame into a SQL table"
  answer: C
