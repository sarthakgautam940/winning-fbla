- id: ut4-19
  skill: pandas-cleaning
  tier: competitive
  type: code
  stem: |
    What does this code print?

    ```python
    import pandas as pd
    df = pd.DataFrame({"name": ["Ana", "Ben", "Cy", "Dee"],
                       "score": [88, None, 92, None]})
    print(len(df.dropna()), df["score"].isna().sum())
    ```
  options:
    - "4 2"
    - "2 0"
    - "4 0"
    - "2 2"
  answer: D
  explain: |
    dropna removes every row that has a missing value, leaving the 2 rows for Ana and Cy, and isna().sum() counts the 2 missing scores. dropna returns a new DataFrame, so df itself still has 4 rows.
  why:
    A: "dropna does remove the 2 rows with missing scores from its result."
    B: "isna().sum() counts the missing scores in df, which dropna did not change."
    C: "Both numbers ignore the missing values."
  verify: |
    df = pd.DataFrame({"name": ["Ana", "Ben", "Cy", "Dee"], "score": [88, None, 92, None]})
    ans = f"{len(df.dropna())} {df['score'].isna().sum()}"

- id: ut4-20
  skill: pandas-reshape
  tier: competitive
  type: code
  stem: |
    In the output of this code, what is the value for team A?

    ```python
    df = pd.DataFrame({"team": ["A", "B", "A", "B", "A"],
                       "pts": [10, 4, 7, 8, 4]})
    print(df.groupby("team")["pts"].mean())
    ```
  options:
    - "6"
    - "7"
    - "10.5"
    - "21"
  ordered: true
  answer: B
  explain: |
    groupby splits the rows by team, and mean averages each group. Team A's points are 10, 7, and 4, which sum to 21, and 21 / 3 = 7.
  why:
    A: "6 is team B's mean, (4 + 8) / 2."
    C: "10.5 divides team A's total by 2 instead of 3."
    D: "21 is team A's total, the result of sum, not mean."
  verify: |
    df = pd.DataFrame({"team": ["A", "B", "A", "B", "A"], "pts": [10, 4, 7, 8, 4]})
    ans = df.groupby("team")["pts"].mean()["A"]

