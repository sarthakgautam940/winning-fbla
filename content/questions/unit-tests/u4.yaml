- id: ut4-14
  skill: sql-subqueries
  tier: competitive
  type: sql
  stem: |
    What does this query return on the shop database?

    ```sql
    SELECT name FROM products
    WHERE price > (SELECT AVG(price) FROM products);
    ```
  options:
    - "Backpack only"
    - "Calculator and Backpack"
    - "USB drive, Calculator, and Backpack"
    - "All five products"
  answer: B
