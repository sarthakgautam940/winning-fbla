- id: ut4-13
  skill: sql-joins
  tier: champion
  type: sql
  stem: |
    Two tables are joined with the query below.

    | teams.team_id | teams.name |
    |---|---|
    | 1 | Red |
    | 2 | Blue |
    | 3 | Gold |

    | players.player_id | players.team_id |
    |---|---|
    | 10 | 1 |
    | 11 | 1 |
    | 12 | 2 |
    | 13 | 4 |

    ```sql
    SELECT t.name, p.player_id
    FROM teams t
    FULL OUTER JOIN players p ON t.team_id = p.team_id;
    ```

    Which rows of the result contain a NULL?
  options:
    - "The Gold team's row and player 13's row"
    - "Only the Gold team's row"
    - "Only player 13's row"
    - "No rows, since every key matches"
  answer: A
  explain: |
    A full outer join keeps unmatched rows from both tables. Gold has no players, so its row has a NULL player_id, and player 13 points to team 4, which does not exist, so that row has a NULL name. Red's two players and Blue's one player match normally.
  why:
    B: "That is the result of a LEFT JOIN from teams; a full join also keeps unmatched players."
    C: "That is the result of a RIGHT JOIN toward players; a full join also keeps unmatched teams."
    D: "Gold has no players and team 4 does not exist, so two rows go unmatched."
  verify: |
    db = make_db("CREATE TABLE teams(team_id INT, name TEXT); INSERT INTO teams VALUES (1,'Red'),(2,'Blue'),(3,'Gold'); CREATE TABLE players(player_id INT, team_id INT); INSERT INTO players VALUES (10,1),(11,1),(12,2),(13,4);")
    r = sql(db, "SELECT t.name, p.player_id FROM teams t FULL OUTER JOIN players p ON t.team_id = p.team_id")
    nulls = sorted(str(x[0]) if x[1] is None else str(x[1]) for x in r if x[0] is None or x[1] is None)
    ans = "The Gold team's row and player 13's row" if nulls == ["13", "Gold"] else "no match"

