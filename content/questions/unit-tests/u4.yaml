- id: ut4-19
  skill: pandas-cleaning
  tier: competitive
  type: code
  stem: |
    What does this code print?

    ```python
    import pandas as pd
    df = pd.DataFrame({"name": ["Ana", "Ben", "Cy", "Dee"],
                       "score": [88, None, 92, None]})
