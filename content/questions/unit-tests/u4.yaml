- id: ut4-15
  skill: sql-dml-ddl
  tier: core
  type: sql
  stem: |
    Which statement changes the price of product 102 to 3.50 and changes nothing else?
  options:
    - "`INSERT INTO products (product_id, price) VALUES (102, 3.50);`"
    - "`UPDATE products SET price = 3.50;`"
    - "`ALTER TABLE products SET price = 3.50 WHERE product_id = 102;`"
    - "`UPDATE products SET price = 3.50 WHERE product_id = 102;`"
  answer: D
  explain: |
    UPDATE changes existing rows, and the WHERE clause limits the change to product 102. Without WHERE, UPDATE changes every row in the table.
  why:
    A: "INSERT adds a new row, and this one would clash with the existing primary key 102."
    B: "Without WHERE, every product's price would become 3.50."
    C: "ALTER TABLE changes a table's structure, not its data."

- id: ut4-16
  skill: sql-window
  tier: champion
  type: sql
  stem: |
    In the school database, Chloe and Hiro share the highest GPA, 3.9, and Elena has the next highest, 3.8. In the result of this query, what value of r does Elena get?

    ```sql
    SELECT name, RANK() OVER (ORDER BY gpa DESC) AS r FROM students;
    ```
  options:
    - "1"
    - "2"
    - "3"
    - "4"
  ordered: true
  answer: C
  explain: |
    RANK gives tied rows the same rank and then skips ahead: Chloe and Hiro are both 1, so the next rank is 3. DENSE_RANK would give Elena 2.
  why:
    A: "Rank 1 belongs to the two students tied at 3.9."
    B: "2 is what DENSE_RANK gives; RANK skips a number after a tie."
    D: "4 would skip two places after a tie of only two students."
  verify: |
    r = dict(sql("school", "SELECT name, RANK() OVER (ORDER BY gpa DESC) AS r FROM students"))
    ans = r["Elena"]

- id: ut4-17
  skill: numpy
  tier: competitive
  type: code
  stem: |
    What does this code print?

    ```python
    import numpy as np
    a = np.array([1, 2, 3])
    print(a * 2 + 1)
    ```
  options:
    - "[3 5 7]"
    - "[2 4 6]"
    - "[1 2 3 1 2 3]"
    - "An error, because an array cannot be added to a number"
  answer: A
  explain: |
    NumPy operations are vectorized, and the scalars are broadcast to every element: each element is doubled and then increased by 1, giving [3 5 7].
  why:
    B: "This doubles the elements but forgets to add 1."
    C: "Repeating the elements is what * does to a Python list; NumPy multiplies element by element."
    D: "Broadcasting lets NumPy add a single number to every element."
  verify: "str(np.array([1, 2, 3]) * 2 + 1)"

- id: ut4-18
