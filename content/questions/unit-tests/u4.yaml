# Unit 4 test: Tools for Data and AI

- id: ut4-01
  skill: keys
  tier: core
  type: concept
  stem: |
    In a company database, each employee has exactly one parking badge, and each badge is assigned to exactly one employee. What type of relationship links employees and badges?
  options:
    - "One-to-one"
    - "One-to-many"
    - "Many-to-one"
    - "Many-to-many"
  answer: A
  explain: |
    Each employee matches at most one badge, and each badge matches at most one employee, so the relationship is one-to-one. It can be stored with a foreign key in the badges table that allows each employee ID only once.
  why:
    B: "One-to-many would let one employee hold several badges."
    C: "Many-to-one would let several employees share one badge."
    D: "Many-to-many would let employees hold many badges and badges belong to many employees."

- id: ut4-02
  skill: keys
  tier: competitive
  type: concept
  stem: |
    The order_items table has the primary key (order_id, product_id). What does this composite key prevent?
  options:
    - "An order containing more than one product"
    - "A product appearing in more than one order"
    - "A quantity greater than 1 for any product"
    - "The same product being listed twice in one order"
  answer: D
  explain: |
    A primary key must be unique, so each pair of order_id and product_id can appear only once. One order can hold many products and one product can appear in many orders, but a product cannot be listed twice in the same order; the quantity column records how many.
  why:
    A: "Different product_id values make different pairs, so an order can hold many products."
    B: "Different order_id values make different pairs, so a product can appear in many orders."
    C: "The quantity column is not part of the key and can hold any number."

- id: ut4-03
  skill: normalization
  tier: champion
  type: concept
  stem: |
    An enrollments table stores each student's course along with the course's instructor and room. The only student taking Astronomy drops it, and deleting that row also erases the record that Astronomy is taught by Dr. Kim in Room 12. What is this problem, and what design change prevents it?
  options:
    - "An update anomaly; add an index on the course column"
    - "An insertion anomaly; allow NULL instructors"
    - "A deletion anomaly; store course details in their own table"
    - "A deletion anomaly; never allow students to drop courses"
  answer: C
  explain: |
    Deleting the last enrollment also deletes the only record of the course's instructor and room: a deletion anomaly. It happens because facts about courses are stored inside enrollment rows. Moving course details into a courses table that enrollments reference keeps each fact in one place.
  why:
    A: "Nothing was updated, and an index speeds searches without changing what the table stores."
    B: "Nothing was inserted; information was lost by deleting a row."
    D: "Banning drops treats the symptom; the design flaw is storing course facts inside enrollment rows."

- id: ut4-04
  skill: db-integrity
  tier: competitive
  type: scenario
  stem: |
    A bank's database has a rule that no account balance may fall below zero. A transfer that would leave an account at negative $50 is rejected, and the database stays as it was. Which ACID property does this rule-keeping illustrate?
  options:
    - "Consistency"
    - "Atomicity"
    - "Isolation"
    - "Durability"
  answer: A
  explain: |
    Consistency means a transaction can only move the database from one valid state to another; a change that would break a rule, such as a CHECK constraint on balances, is rejected. Atomicity is related but different: it makes a transaction all or nothing.
  why:
    B: "Atomicity makes a transaction all or nothing; the point here is that the result would break a rule."
    C: "Isolation keeps simultaneous transactions from interfering with each other."
    D: "Durability keeps committed changes safe through crashes."

- id: ut4-05
  skill: sql-nosql
  tier: competitive
  type: scenario
  stem: |
    Which workload is the best fit for a NoSQL document database rather than a relational database?
  options:
    - "Bank account balances that need strict transactions"
    - "Payroll records with a fixed set of columns"
    - "Student grades that are joined to course tables"
    - "A product catalog where each item type has different attributes"
  answer: D
  explain: |
    Document databases store flexible, JSON-like records, so items with different attributes, such as shoe sizes for one product and screen sizes for another, fit without a rigid schema.
  why:
    A: "Strict multi-table transactions are a strength of relational databases."
    B: "A fixed set of columns fits a relational table well."
    C: "Joins between related tables are a relational strength."

