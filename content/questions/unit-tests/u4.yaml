- id: ut4-16
  skill: sql-window
  tier: champion
  type: sql
  stem: |
    A scores table holds Ana 92, Ben 88, Cy 92, Dee 85, and Eli 88. In the result of this query, what are r and d for Ben?

    ```sql
    SELECT name,
           RANK() OVER (ORDER BY score DESC) AS r,
           DENSE_RANK() OVER (ORDER BY score DESC) AS d
    FROM scores;
    ```
  options:
    - "r = 2 and d = 2"
    - "r = 3 and d = 3"
    - "r = 3 and d = 2"
    - "r = 4 and d = 2"
  answer: C
  explain: |
    Both functions give Ana and Cy, tied at 92, rank 1. RANK then skips a number for the tie, so the two 88s get 3; DENSE_RANK leaves no gaps, so they get 2. Ben's row shows r = 3 and d = 2.
  why:
    A: "RANK does not give the 88s a 2; it skips past the two people tied at 92."
    B: "This applies RANK's gap to DENSE_RANK as well, but DENSE_RANK never skips numbers."
    D: "Tied rows share a rank, so Ben and Eli both get 3 under RANK."
  verify: |
    db = make_db("CREATE TABLE scores(name TEXT, score INT); INSERT INTO scores VALUES ('Ana',92),('Ben',88),('Cy',92),('Dee',85),('Eli',88);")
    r = {x[0]: (x[1], x[2]) for x in sql(db, "SELECT name, RANK() OVER (ORDER BY score DESC), DENSE_RANK() OVER (ORDER BY score DESC) FROM scores")}
    ans = f"r = {r['Ben'][0]} and d = {r['Ben'][1]}"

- id: ut4-17
