    B: "Evaluation is a separate step that compares predictions with labels."
    D: "Autograd has nothing to do with converting data formats."

- id: ut4-23
  skill: sklearn
  tier: champion
  type: code
  stem: |
    What is wrong with this code?

    ```python
    scaler = StandardScaler()
    X_train_s = scaler.fit_transform(X_train)
    X_test_s = scaler.fit_transform(X_test)
    ```
  options:
    - "StandardScaler cannot be fitted on training data at all"
    - "fit_transform should be called on the test data first"
    - "The training data should be scaled with transform only"
    - "Line 3 refits the scaler on the test data; it should only transform"
  answer: D
  explain: |
    The scaler should learn its mean and standard deviation from the training data only, then apply that same transformation to the test data with scaler.transform(X_test). Refitting on the test set scales the two sets differently and lets test statistics leak in.
  why:
    A: "Fitting on the training data is exactly what a scaler is for."
    B: "The test data should never be used to fit the scaler."
    C: "The training data must be fitted first; only the test data should use transform alone."

