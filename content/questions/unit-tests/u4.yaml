  stem: |
    Which statement changes the price of product 102 to 3.50 and changes nothing else?
  options:
    - "`INSERT INTO products (product_id, price) VALUES (102, 3.50);`"
    - "`UPDATE products SET price = 3.50;`"
    - "`ALTER TABLE products SET price = 3.50 WHERE product_id = 102;`"
    - "`UPDATE products SET price = 3.50 WHERE product_id = 102;`"
