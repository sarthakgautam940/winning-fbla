  tier: champion
  type: code
  stem: |
    What is wrong with this code?

    ```python
    scaler = StandardScaler()
    X_train_s = scaler.fit_transform(X_train)
    X_test_s = scaler.fit_transform(X_test)
    ```
  options:
    - "StandardScaler cannot be fitted on training data at all"
