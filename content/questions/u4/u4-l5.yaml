- id: pandas-basics-05
  skill: pandas-basics
  tier: competitive
  type: code
  use: quiz
  stem: |
    Which expression keeps the rows where grade is 10 and gpa is above 3.5?
  options:
    - "`df[(df['grade'] == 10) and (df['gpa'] > 3.5)]`"
    - "`df[df['grade'] == 10 & df['gpa'] > 3.5]`"
    - "`df[(df['grade'] == 10) | (df['gpa'] > 3.5)]`"
    - "`df[(df['grade'] == 10) & (df['gpa'] > 3.5)]`"
  answer: D
  explain: |
    pandas combines conditions element by element with &, and each condition needs its own parentheses because & binds more tightly than the comparison operators.
  why:
    A: "Python's and cannot combine whole columns; it raises a ValueError."
    B: "Without parentheses, & is applied to 10 and df['gpa'] before the comparisons, which fails."
    C: "The | operator means or, so it keeps rows that meet either condition."

