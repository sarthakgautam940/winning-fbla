    `df` is a pandas DataFrame with a column named "gpa". What type of object does `df["gpa"]` return?
  options:
    - "A Series"
    - "A DataFrame"
    - "A Python list"
    - "A NumPy array"
  answer: A
  explain: |
    Selecting a single column with single brackets returns a Series: the column's values with their index labels. Double brackets, df[["gpa"]], would return a one-column DataFrame.
  why:
    B: "A DataFrame comes back from double brackets, such as df[['gpa']]."
    C: "pandas returns its own labeled Series, not a plain list."
    D: "A Series wraps an array of values but adds an index, so it is not a bare NumPy array."
  verify: |
    import pandas as pd
    df = pd.DataFrame({"gpa": [3.6, 2.9]})
    ans = "A " + type(df["gpa"]).__name__

