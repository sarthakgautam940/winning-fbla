- id: numpy-08
  skill: numpy
  tier: champion
  type: code
  use: bank
  stem: |
    What happens when this code runs?

    ```python
    import numpy as np
    print(np.ones((2, 3)) + np.array([1, 2]))
    ```
  options:
    - "It adds 1 and 2 to the first two values of each row, leaving the third."
    - "It returns a 2-by-2 array after trimming the extra column away."
    - "It raises an error, since shapes (2, 3) and (2,) cannot broadcast."
    - "It adds 3, the sum of 1 and 2, to every value in the array."
  answer: C
  explain: |
    Broadcasting compares shapes from the right. The last dimensions are 3 and 2, which are neither equal nor 1, so NumPy raises a ValueError. A length-3 row would broadcast fine.
  why:
    A: "NumPy never pads or partly applies an array; incompatible shapes are an error."
    B: "Broadcasting never shrinks an array to a new shape."
    D: "NumPy does not collapse an array into its sum before adding."
  verify: |
    import numpy as np
    try:
        np.ones((2, 3)) + np.array([1, 2])
        ans = "other"
    except ValueError:
        ans = "It raises an error, since shapes (2, 3) and (2,) cannot broadcast."

