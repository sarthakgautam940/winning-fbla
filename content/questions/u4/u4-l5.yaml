    ans = "`" + str(np.array([1, 2.5, 3]).dtype) + "`"

- id: numpy-10
  skill: numpy
  tier: competitive
  type: concept
  use: bank
  stem: |
    Why are NumPy arrays much faster than Python lists for numerical work?
  options:
    - "Arrays can hold any mix of value types in a single structure."
    - "Arrays are automatically moved onto a GPU for every calculation."
    - "Arrays let Python skip all of its usual checks for errors."
    - "Arrays store one type compactly, and their math runs in compiled code."
  answer: D
  explain: |
    An array's values share one type and sit side by side in memory, so NumPy can loop over them in fast compiled code. A list holds separate Python objects of any type, which Python must handle one at a time.
  why:
    A: "Holding mixed types is what lists do; it is part of why they are slower."
    B: "NumPy arrays live in ordinary memory; GPU arrays come from libraries such as PyTorch."
    C: "NumPy still checks for errors, such as incompatible shapes."

