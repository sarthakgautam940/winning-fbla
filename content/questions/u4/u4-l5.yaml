# ---------------------------------------------------------------- numpy
- id: numpy-01
  skill: numpy
  tier: core
  type: code
  use: check
  stem: |
    What does this Python code print?

    ```python
    print([1, 2] + [3, 4])
    ```
  options:
    - "`[4, 6]`"
    - "`[1, 2, 3, 4]`"
    - "`[3, 8]`"
    - "An error, because lists cannot be added"
  answer: B
  explain: |
    For Python lists, + joins them end to end. Element-wise addition, which would give [4, 6], requires NumPy arrays.
  why:
    A: "This is what adding two NumPy arrays would give, not two lists."
    C: "This multiplies the pairs, which neither lists nor arrays do with +."
    D: "Adding two lists is allowed; it concatenates them."
  verify: |
    ans = "`" + str([1, 2] + [3, 4]) + "`"

- id: numpy-02
  skill: numpy
  tier: competitive
  type: code
  use: check
  stem: |
    What does this code print?

    ```python
    import numpy as np
    print(np.array([1, 2, 3]) * 10)
    ```
  options:
    - "`60`"
    - "The list 1, 2, 3 repeated 10 times"
    - "An error, because the shapes differ"
    - "`[10 20 30]`"
  answer: D
  explain: |
    NumPy broadcasts the scalar 10 to every element, so each value is multiplied by 10. Arrays print without commas.
  why:
    A: "This would be the sum after multiplying; the code multiplies but does not add."
    B: "Repetition is what * does to a Python list, not to a NumPy array."
    C: "A scalar is compatible with any shape, so broadcasting works."
  verify: |
    import numpy as np
    ans = "`" + str(np.array([1, 2, 3]) * 10) + "`"

