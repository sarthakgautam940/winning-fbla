- id: numpy-06
  skill: numpy
  tier: champion
  type: code
  use: quiz
  stem: |
    What does this code print?

    ```python
    import numpy as np
    print(np.std(np.array([2, 4, 4, 4, 5, 5, 7, 9])))
    ```
  options:
    - "2.0"
    - "2.14"
    - "4.0"
    - "4.57"
  ordered: true
  answer: A
  explain: |
    np.std divides by n by default (ddof=0), giving the population standard deviation. The squared deviations from the mean of 5 sum to 32, so the variance is 32 / 8 = 4 and the standard deviation is 2.0.
  why:
    B: "This is the sample standard deviation, which needs ddof=1 in NumPy (it is pandas' default)."
    C: "This is the population variance, before taking the square root."
    D: "This is the sample variance, 32 / 7."
  verify: |
    import numpy as np
    ans = np.std(np.array([2, 4, 4, 4, 5, 5, 7, 9]))

