- id: pandas-basics-03
  skill: pandas-basics
  tier: competitive
  type: code
  use: check
  stem: |
    A DataFrame `df` has 10 rows and the default index 0, 1, 2, and so on. How many rows does `df.loc[1:3]` return?
  options:
    - "1"
    - "2"
    - "3"
    - "4"
  ordered: true
  answer: C
  explain: |
    loc selects by label, and its slices include the end label, so it returns the rows labeled 1, 2, and 3. The position-based df.iloc[1:3] would stop before position 3 and return 2 rows.
  why:
    A: "A slice from 1 to 3 covers more than one label."
    B: "This is the iloc result, which excludes the end position."
    D: "The slice starts at label 1, so label 0 is not included."
  verify: |
    import pandas as pd
    ans = len(pd.DataFrame({"x": range(10)}).loc[1:3])

