- id: numpy-04
  skill: numpy
  tier: core
  type: concept
  use: quiz
  stem: |
    In NumPy and pandas, what does vectorization mean?
  options:
    - "Converting every value in a table into text"
    - "Storing each row of a table in a separate file"
    - "Applying an operation to a whole array at once instead of looping"
    - "Drawing the data as arrows on a chart"
  answer: C
  explain: |
    Vectorized code such as prices * 2 operates on every element in one step. The looping happens inside NumPy's compiled code, which makes it much faster than a Python for loop.
  why:
    A: "Vectorization works on numbers directly; it does not convert them."
    B: "Vectorization is about how operations run, not how data is stored."
    D: "Vector here means an array of values, not an arrow on a chart."

- id: numpy-05
  skill: numpy
  tier: competitive
  type: code
  use: quiz
  stem: |
    What does this code print?

    ```python
