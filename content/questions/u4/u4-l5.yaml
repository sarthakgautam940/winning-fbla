- id: pandas-basics-07
  skill: pandas-basics
  tier: champion
  type: code
  use: quiz
  stem: |
    `df` has columns named "name" and "gpa". What happens with `df[["name", "gpa"]]` and with `df["name", "gpa"]`?
  options:
    - "Both return a DataFrame with the two columns."
    - "The first returns a DataFrame; the second raises a KeyError."
    - "The first raises a KeyError; the second returns a DataFrame."
    - "Both return a Series that joins the two columns."
  answer: B
  explain: |
    Double brackets pass a list of column names, so pandas returns those columns as a DataFrame. With single brackets, "name", "gpa" is read as one key, the tuple ("name", "gpa"), and no column has that name, so pandas raises a KeyError.
  why:
    A: "Only the list inside double brackets selects several columns."
    C: "This reverses the two expressions."
    D: "Selecting several columns gives a DataFrame, never one joined Series."
  verify: |
    import pandas as pd
    df = pd.DataFrame({"name": ["Ava"], "gpa": [3.6]})
    first = type(df[["name", "gpa"]]).__name__
    try:
        df["name", "gpa"]
        second = "ok"
    except KeyError:
        second = "KeyError"
    ans = "The first returns a DataFrame; the second raises a KeyError." if (first, second) == ("DataFrame", "KeyError") else "other"

