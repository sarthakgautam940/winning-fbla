    B: "tidyr reshapes data between wide and long forms."
    D: "readr reads data files such as CSVs."

- id: r-vs-python-06
  skill: r-vs-python
  tier: champion
  type: recall
  use: bank
  stem: |
    Ross Ihaka and Robert Gentleman created R at the University of Auckland as a version of which earlier language?
  options:
    - "C"
    - "SAS"
    - "Python"
    - "S"
  answer: D
  explain: |
    R began as an implementation of a dialect of S, a statistics language. Ihaka and Gentleman first announced it in 1993, and R 1.0.0 arrived in 2000.
  why:
    A: "Parts of R are written in C, but R's language is based on S."
    B: "SAS is a separate commercial statistics package."
    C: "Python is a separate language that was not R's model."
