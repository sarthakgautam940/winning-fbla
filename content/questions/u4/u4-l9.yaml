    print([x for x in [5, 12, 8, 20] if x > 10])
    ```
  options:
    - "`[5, 8]`"
    - "`[True, True]`"
    - "`[12, 20]`"
    - "`2`"
  answer: C
  explain: |
    The comprehension keeps each x for which the condition x > 10 is true, in the original order: 12 and 20.
  why:
    A: "These are the values that fail the condition."
    B: "The expression before for is x, so the list holds the values, not True and False."
    D: "This counts the matches, but a comprehension builds a list of them."
  verify: |
    ans = "`" + str([x for x in [5, 12, 8, 20] if x > 10]) + "`"

- id: python-core-04
  skill: python-core
  tier: core
  type: concept
  use: quiz
  stem: |
    Which built-in Python type cannot be changed after it is created?
  options:
    - "list"
    - "tuple"
    - "dictionary"
    - "set"
  answer: B
  explain: |
    A tuple is immutable: its elements cannot be replaced, added, or removed once it exists. Trying to assign to one of them raises a TypeError.
  why:
    A: "Lists are mutable; you can append to and change them."
    C: "Dictionaries are mutable; keys can be added and values changed."
    D: "Sets are mutable; items can be added and removed."

- id: python-core-05
  skill: python-core
  tier: competitive
  type: code
  use: quiz
  stem: |
    What does this code print?

    ```python
    nums = [4, 7, 1, 9]
    print(nums[-1])
    ```
  options:
    - "`1`"
    - "`4`"
    - "`7`"
    - "`9`"
  ordered: true
  answer: D
  explain: |
    Negative indexes count from the end of a list, so -1 is the last element, 9.
  why:
    A: "1 is nums[-2], the second to last element."
    B: "4 is nums[0], the first element."
    C: "7 is nums[1]."
  verify: |
    ans = "`" + str([4, 7, 1, 9][-1]) + "`"

- id: python-core-06
  skill: python-core
  tier: competitive
  type: code
  use: quiz
  stem: |
    What happens when this code runs?

    ```python
    gpa = {"Ava": 3.6, "Ben": 2.9}
    print(gpa["Zoe"])
    ```
  options:
    - "It raises a KeyError."
    - "It raises an IndexError."
    - "It prints None."
    - "It prints 0."
  answer: A
  explain: |
    Looking up a key that is not in a dictionary raises a KeyError. To get a default value instead, use gpa.get("Zoe", 0).
  why:
    B: "IndexError is for positions past the end of a sequence, not missing dictionary keys."
    C: "get() with no default would return None, but square brackets raise an error."
    D: "0 would come only from get() with a default of 0."
  verify: |
    try:
        {"Ava": 3.6, "Ben": 2.9}["Zoe"]
        ans = "other"
    except KeyError:
        ans = "It raises a KeyError."

- id: python-core-07
  skill: python-core
  tier: champion
  type: code
  use: quiz
  stem: |
    What does this code print?

    ```python
    a = [1, 2]
    b = a
    b.append(3)
    print(a)
    ```
  options:
    - "`[1, 2]`"
    - "`[1, 2, [3]]`"
    - "`[1, 2, 3]`"
    - "`[3]`"
  answer: C
  explain: |
    b = a does not copy the list; it makes b a second name for the same list. Appending through b changes that one list, so a shows the 3 as well. b = a.copy() would make an independent copy.
  why:
    A: "This assumes b = a made a copy, but both names point to one list."
    B: "append adds the value 3 itself, not a list containing 3."
    D: "append adds to the existing list rather than replacing it."
  verify: |
    a = [1, 2]
    b = a
    b.append(3)
    ans = "`" + str(a) + "`"

- id: python-core-08
  skill: python-core
  tier: core
  type: code
  use: bank
  stem: |
    What does this code print?

    ```python
    total = 0
    for x in [3, 5, 7]:
        total += x
    print(total)
    ```
  options:
    - "7"
    - "10"
    - "15"
    - "105"
  ordered: true
  answer: C
  explain: |
    The loop adds each value to total in turn: 0 + 3 = 3, then 3 + 5 = 8, then 8 + 7 = 15.
  why:
    A: "This is only the last value, as if total were replaced instead of added to."
    B: "This leaves out the first value, 3."
    D: "This multiplies the values, but += adds."
  verify: |
    total = 0
    for x in [3, 5, 7]:
        total += x
    ans = total

- id: python-core-09
  skill: python-core
  tier: competitive
  type: code
  use: bank
  stem: |
    What does this code print?

    ```python
    count = 0
    for i in range(1, 10):
        if i % 3 == 0:
            count += 1
    print(count)
    ```
  options:
    - "2"
    - "3"
    - "4"
    - "9"
  ordered: true
  answer: B
  explain: |
    range(1, 10) gives 1 through 9, stopping before 10. The numbers divisible by 3 are 3, 6, and 9, so count reaches 3.
  why:
    A: "This misses 9, which range(1, 10) does include."
    C: "This includes a value past 9, but range stops before its end value."
    D: "This counts every number in the range, not just the multiples of 3."
  verify: |
    count = 0
    for i in range(1, 10):
        if i % 3 == 0:
            count += 1
    ans = count

