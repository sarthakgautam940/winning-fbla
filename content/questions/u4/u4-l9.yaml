- id: dev-tools-09
  skill: dev-tools
  tier: core
  type: recall
  use: bank
  stem: |
    What does `git clone` do?
  options:
    - "It copies a remote repository and its history to your computer."
    - "It saves a snapshot of your current changes with a message."
    - "It combines the commits of two branches into a single branch."
    - "It deletes a repository from GitHub and from every computer."
  answer: A
  explain: |
    Cloning downloads a full copy of a repository, including every earlier commit, so you can work on it locally.
  why:
    B: "Saving a snapshot is a commit."
    C: "Combining branches is a merge."
    D: "Cloning copies a repository; it never deletes one."

- id: dev-tools-10
  skill: dev-tools
  tier: champion
  type: scenario
  use: bank
  stem: |
    Two branches each change the same line of the same file in different ways, and Git cannot combine them automatically. What is this situation called?
  options:
    - "A pull request"
    - "A clone"
    - "A merge conflict"
    - "A detached kernel"
  answer: C
  explain: |
    When both branches edit the same lines, Git cannot know which version to keep, so it reports a merge conflict and marks the spot for a person to resolve.
  why:
    A: "A pull request proposes a merge; the conflict is what Git finds while merging."
    B: "A clone is a copy of a repository."
    D: "Kernels belong to notebooks, not to Git."
