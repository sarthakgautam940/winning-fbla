# Lesson 4.9: The data scientist's toolkit

# ---------------------------------------------------------------- python-core
- id: python-core-01
  skill: python-core
  tier: core
  type: scenario
  use: check
  stem: |
    A program must store the IDs of website visitors, keeping each ID only once no matter how many times the visitor returns. Which built-in Python type fits best?
  options:
    - "list"
    - "tuple"
    - "dictionary"
    - "set"
  answer: D
  explain: |
    A set holds only unique items, so adding a repeat ID changes nothing, and checking whether an ID is present is fast.
  why:
    A: "A list keeps every repeat, so duplicates would pile up."
    B: "A tuple cannot change after it is created, so new visitors could not be added."
    C: "A dictionary needs a value for each key; a set is the simpler fit for unique items alone."

- id: python-core-02
  skill: python-core
  tier: competitive
  type: code
  use: check
  stem: |
    What does this code print?

    ```python
    nums = [4, 7, 1, 9]
    print(nums[1:3])
    ```
  options:
    - "`[7, 1]`"
    - "`[7, 1, 9]`"
    - "`[4, 7]`"
    - "`[4, 7, 1]`"
  answer: A
  explain: |
    Python indexes from 0, and a slice stops before its end position. nums[1:3] takes positions 1 and 2, which hold 7 and 1.
  why:
    B: "This includes position 3, but slices stop before the end position."
    C: "This starts at position 0, but the slice starts at position 1."
    D: "This counts from 1, the way R does, and includes the end."
  verify: |
    ans = "`" + str([4, 7, 1, 9][1:3]) + "`"

- id: python-core-03
  skill: python-core
  tier: competitive
