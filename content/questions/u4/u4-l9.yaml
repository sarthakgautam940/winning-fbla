    D: "This is word[-1], the last letter only."
  verify: |
    ans = "`" + "data"[::-1] + "`"

- id: python-core-11
  skill: python-core
  tier: competitive
  type: code
  use: quiz
  stem: |
    What happens when Python runs `"3" + 4`?
  options:
    - "It prints `34`."
    - "It prints `7`."
    - "It raises a TypeError."
    - "It raises a ValueError."
  answer: C
  explain: |
    Python will not add a string and an integer, because the two types are incompatible, so it raises a TypeError. Converting first works: int("3") + 4 gives 7, and "3" + str(4) gives "34".
  why:
    A: "Joining text requires both values to be strings."
    B: "Python does not convert the string to a number automatically."
    D: "ValueError is for a right type with a bad value, such as int('abc')."
  verify: |
    try:
        "3" + 4
        ans = "other"
    except TypeError:
        ans = "It raises a TypeError."

# ---------------------------------------------------------------- dev-tools
- id: dev-tools-01
  skill: dev-tools
  tier: core
  type: concept
  use: check
  stem: |
    In a Jupyter notebook, what is the kernel?
  options:
    - "A Markdown cell that explains the analysis"
    - "The running process that executes code and holds the variables"
    - "The file format used to save notebooks"
    - "The website where notebooks are shared"
  answer: B
  explain: |
    The kernel is the engine behind a notebook: it runs each code cell and remembers every variable created so far. Restarting it clears that memory.
  why:
    A: "Markdown cells hold text; they are not executed by the kernel."
    C: "Notebooks are saved as .ipynb files, which the kernel does not define."
    D: "Notebooks can be shared online, but the kernel is the process that runs the code."

- id: dev-tools-02
  skill: dev-tools
  tier: competitive
  type: concept
  use: check
  stem: |
    What is the difference between Git and GitHub?
  options:
    - "Git hosts code online; GitHub tracks changes on your own computer."
    - "They are two names for the same program."
    - "GitHub is a programming language, and Git is its compiler."
    - "Git tracks versions of files; GitHub hosts Git repositories online."
  answer: D
  explain: |
    Git is the version-control system itself, and it runs on your computer, even offline. GitHub is a service that stores Git repositories online and adds collaboration tools such as pull requests.
  why:
    A: "This reverses the two."
    B: "One is a tool and the other is a hosting service; GitLab and Bitbucket host Git repositories too."
    C: "Neither is a programming language or a compiler."

- id: dev-tools-03
  skill: dev-tools
  tier: competitive
  type: scenario
  use: check
  stem: |
    A data engineering team processes very large datasets with Apache Spark and wants to work in the language that Spark itself is written in. Which language is that?
  options:
    - "Scala"
    - "R"
    - "Julia"
    - "SQL"
  answer: A
  explain: |
    Apache Spark is written in Scala, which makes Scala a natural choice for Spark-heavy big data work, although Spark can also be used from Python, R, Java, and SQL.
  why:
    B: "R can call Spark, but Spark is not written in R."
    C: "Julia is a language for high-performance scientific computing."
    D: "Spark accepts SQL queries, but it is not written in SQL."

- id: dev-tools-04
  skill: dev-tools
  tier: core
  type: recall
  use: quiz
  stem: |
    In Git, what is a commit?
  options:
    - "A copy of a remote repository on your computer"
    - "An independent line of development"
    - "A saved snapshot of changes, with a message"
    - "A request to merge one branch into another"
  answer: C
  explain: |
    A commit records the state of the tracked files at one moment, with a message describing what changed, so the project's history is a chain of commits.
  why:
    A: "Copying a remote repository is cloning."
    B: "An independent line of development is a branch."
    D: "A request to merge, with review, is a pull request."

- id: dev-tools-05
  skill: dev-tools
  tier: competitive
  type: scenario
  use: quiz
  stem: |
    A teammate has finished a new feature on a branch and wants others to review the changes on GitHub before they become part of the main branch. What should the teammate do?
  options:
    - "Delete the main branch and rename theirs"
    - "Open a pull request"
    - "Clone the repository again"
    - "Copy the files into an email"
  answer: B
  explain: |
    A pull request proposes merging a branch, shows exactly what changed, and lets teammates comment and approve before the merge happens.
  why:
    A: "Deleting the main branch would discard everyone else's work and skip review."
    C: "Cloning makes another copy; it does not propose changes."
    D: "Emailing files loses the history and the review tools Git and GitHub provide."

- id: dev-tools-06
  skill: dev-tools
  tier: champion
  type: scenario
  use: quiz
  stem: |
    A notebook works on its author's computer, but when a colleague restarts the kernel and runs every cell from top to bottom, it fails with a NameError for a variable. What most likely happened?
  options:
    - "The colleague's computer cannot run Python notebooks at all."
    - "A cell that defined the variable was deleted or run out of order."
    - "Jupyter notebooks cannot be opened on a second computer."
    - "The colleague's copy lost the Markdown cells that held the variable."
  answer: B
  explain: |
    The author's kernel still remembered the variable from earlier work, so the notebook seemed to run. Run cleanly from the top, nothing defines it. Restarting the kernel and running every cell in order exposes this hidden state.
  why:
    A: "The colleague ran the other cells, so Python works fine."
    C: "Notebooks are made to be shared; the problem is how this one was run."
    D: "Markdown cells hold text and cannot define variables."

