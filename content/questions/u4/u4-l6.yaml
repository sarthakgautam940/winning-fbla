- id: pandas-cleaning-09
  skill: pandas-cleaning
  tier: champion
  type: code
  use: bank
  stem: |
    The orders table below has four rows, and the third row is an exact copy of the second. What does `df.duplicated().tolist()` return?

    | order_id | amount |
    |---|---|
    | 101 | 12.50 |
    | 102 | 8.00 |
    | 102 | 8.00 |
    | 103 | 20.00 |
  options:
    - "`[False, True, True, False]`"
    - "`[True, False, True, False]`"
    - "`[False, False, False, False]`"
    - "`[False, False, True, False]`"
  answer: D
  explain: |
    duplicated() marks each row that repeats an earlier row. The first copy of order 102 is not a duplicate yet; only its second copy is, so only the third position is True.
  why:
    A: "By default the first occurrence is kept unmarked, so the second row is False."
    B: "The first row has nothing earlier to repeat."
    C: "The third row is an exact repeat, so it is flagged."
  verify: |
    import pandas as pd
    df = pd.DataFrame({"order_id": [101, 102, 102, 103], "amount": ["12.50", "8.00", "8.00", "20.00"]})
    ans = "`" + str(df.duplicated().tolist()) + "`"

