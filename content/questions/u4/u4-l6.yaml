    ans = sales.groupby("region")["units"].agg(["count", "mean"]).loc["West", "mean"]

- id: pandas-reshape-09
  skill: pandas-reshape
  tier: champion
  type: code
  use: bank
  stem: |
    What kind of object does `t.groupby("g")["v"].sum()` return, and what is its index?
  options:
    - "A DataFrame whose index is 0, 1, 2, and so on"
    - "A Series whose index holds the group labels"
    - "A single number, the sum of the whole column"
    - "A list of sums in the order the rows appeared"
  answer: B
