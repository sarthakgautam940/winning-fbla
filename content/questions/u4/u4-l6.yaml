- id: pandas-reshape-06
  skill: pandas-reshape
  tier: champion
  type: code
  use: quiz
  stem: |
    The students DataFrame has IDs 1, 2, and 3. The scores DataFrame has the student IDs 1, 1, 3, and 4. How many rows does an outer merge on student_id return?
  options:
    - "3"
    - "4"
    - "5"
    - "7"
  ordered: true
  answer: C
  explain: |
    An outer merge keeps every match plus every unmatched row from both sides. The matches give 3 rows (Ava twice and Chloe once), Ben adds 1 unmatched row, and student 4's score adds another: 5 rows.
  why:
    A: "This is the inner merge, which keeps only the matches."
    B: "This is the left merge, which drops the unmatched score for student 4."
    D: "This adds the two table sizes, which counts the matched rows twice."
  verify: |
    import pandas as pd
    students = pd.DataFrame({"student_id": [1, 2, 3], "name": ["Ava", "Ben", "Chloe"]})
    scores = pd.DataFrame({"student_id": [1, 1, 3, 4], "score": [88, 92, 95, 70]})
    ans = len(students.merge(scores, on="student_id", how="outer"))

- id: pandas-reshape-07
  skill: pandas-reshape
  tier: core
  type: concept
  use: quiz
  stem: |
    In pandas, `merge(..., how="left")` corresponds to which SQL operation?
  options:
    - "INNER JOIN"
    - "LEFT JOIN"
    - "UNION"
    - "GROUP BY"
  answer: B
  explain: |
    merge mirrors SQL joins, and how="left" keeps every row of the left DataFrame, filling unmatched columns with NaN, just as LEFT JOIN fills them with NULL.
  why:
    A: "INNER JOIN corresponds to how='inner'."
    C: "UNION stacks query results, which is closer to pd.concat."
    D: "GROUP BY corresponds to groupby, not merge."

- id: pandas-reshape-08
  skill: pandas-reshape
  tier: competitive
  type: code
  use: bank
  stem: |
    The West rows of a sales table have 4 and 8 units. In the result of `sales.groupby("region")["units"].agg(["count", "mean"])`, what is the mean for West?
  options:
    - "4.0"
    - "6.0"
    - "8.0"
    - "12.0"
  ordered: true
  answer: B
  explain: |
    agg applies each listed function to every group. West's units are 4 and 8, so its count is 2 and its mean is (4 + 8) / 2 = 6.0.
  why:
