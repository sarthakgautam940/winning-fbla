- id: pandas-reshape-10
  skill: pandas-reshape
  tier: competitive
  type: code
  use: bank
  stem: |
    A long sales table has these rows: East Q1 10, East Q2 6, West Q1 4, and West Q2 8 units. It is turned into a wide table with `pivot_table(index="region", columns="quarter", values="units", aggfunc="sum")`. What value is in the West row and the Q2 column?
  options:
    - "4"
    - "6"
    - "8"
    - "10"
  ordered: true
  answer: C
  explain: |
    The pivot puts regions in rows and quarters in columns, and each cell holds the units for that pair. West's Q2 row in the long table has 8 units.
  why:
    A: "4 is West in Q1."
    B: "6 is East in Q2."
    D: "10 is East in Q1."
  verify: |
    import pandas as pd
    sales = pd.DataFrame({"region": ["East", "East", "West", "West"], "quarter": ["Q1", "Q2", "Q1", "Q2"], "units": [10, 6, 4, 8]})
    ans = sales.pivot_table(index="region", columns="quarter", values="units", aggfunc="sum").loc["West", "Q2"]
