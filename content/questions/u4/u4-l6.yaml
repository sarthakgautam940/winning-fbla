- id: pandas-cleaning-11
  skill: pandas-cleaning
  tier: core
  type: code
  use: check
  stem: |
    What does this code print?

    ```python
    import pandas as pd
    print(pd.Series([88, 72]).apply(lambda s: s * 2).tolist())
    ```
  options:
    - "`[88, 72, 88, 72]`"
    - "`[160]`"
    - "`[90, 74]`"
    - "`[176, 144]`"
  answer: D
  explain: |
    apply calls the function once for each value, and this lambda doubles its input, so 88 becomes 176 and 72 becomes 144. The vectorized form, multiplying the Series by 2, gives the same result faster.
  why:
    A: "Repeating the values is what * 2 does to a Python list, not what apply does."
    B: "apply returns one result per value, not one combined total."
    C: "The lambda multiplies by 2; it does not add 2."
  verify: |
    import pandas as pd
    ans = "`" + str(pd.Series([88, 72]).apply(lambda s: s * 2).tolist()) + "`"

# ---------------------------------------------------------------- pandas-reshape
- id: pandas-reshape-01
  skill: pandas-reshape
  tier: core
  type: code
  use: check
  stem: |
    A sales table has region and units columns. The East rows have 10, 6, and 2 units, and the West rows have 4 and 8. What does `sales.groupby("region")["units"].sum()` return?
  options:
    - "East 3 and West 2"
    - "East 6 and West 6"
    - "30, the total of all units"
    - "East 18 and West 12"
  answer: D
  explain: |
    groupby splits the rows by region, sums the units in each group, and returns a Series indexed by region: East 10 + 6 + 2 = 18 and West 4 + 8 = 12.
  why:
    A: "These are the row counts per region, which count() or value_counts() would give."
    B: "These are the means per region, which mean() would give."
    C: "Without groupby, sum() would give the grand total."
  verify: |
    import pandas as pd
    sales = pd.DataFrame({"region": ["East", "West", "East", "West", "East"], "units": [10, 4, 6, 8, 2]})
    r = sales.groupby("region")["units"].sum()
    ans = f"East {r['East']} and West {r['West']}"

- id: pandas-reshape-02
  skill: pandas-reshape
  tier: competitive
  type: code
  use: check
  stem: |
    The students DataFrame has 3 rows: Ava, Ben, and Chloe. In the scores DataFrame, Ava has 2 scores, Ben has none, and Chloe has 1. How many rows does `students.merge(scores, on="student_id", how="left")` return?
  options:
    - "3"
    - "4"
    - "5"
    - "6"
  ordered: true
  answer: B
  explain: |
    A left merge keeps every student. Ava matches two scores and so appears twice, Chloe appears once, and Ben appears once with NaN for score: 2 + 1 + 1 = 4 rows.
  why:
    A: "Ava appears once for each of Ava's two scores, so the count exceeds the 3 students."
    C: "This adds an unmatched score, which only an outer merge keeps."
    D: "Ben, with no scores, appears only once."
  verify: |
    import pandas as pd
    students = pd.DataFrame({"student_id": [1, 2, 3], "name": ["Ava", "Ben", "Chloe"]})
    scores = pd.DataFrame({"student_id": [1, 1, 3], "score": [88, 92, 95]})
    ans = len(students.merge(scores, on="student_id", how="left"))

- id: pandas-reshape-03
  skill: pandas-reshape
  tier: competitive
  type: code
  use: check
  stem: |
    A table has one row per region and a separate column for each quarter's units (Q1, Q2, Q3, Q4). Which method turns it into a long table with one row per region and quarter?
  options:
    - "`melt`"
    - "`pivot_table`"
    - "`concat`"
    - "`merge`"
  answer: A
  explain: |
    melt unpivots wide data: it keeps the identifier column (region) and turns the quarter columns into variable and value pairs, one row per region and quarter.
  why:
    B: "pivot_table goes the other way, from long data to wide."
    C: "concat stacks tables; it does not reshape columns into rows."
    D: "merge joins two tables on a key; it does not reshape one table."

- id: pandas-reshape-04
  skill: pandas-reshape
  tier: core
  type: code
  use: quiz
  stem: |
    A Series holds "a", "b", "a", "c", "a", and "b". What does `.value_counts()` return?
  options:
    - "c 1, b 2, a 3"
    - "a 1, b 1, c 1"
    - "a 3, b 2, c 1"
    - "6, the number of values"
  answer: C
  explain: |
    value_counts() counts each distinct value and sorts the counts from most common to least common, so a (3) comes first, then b (2), then c (1).
  why:
    A: "value_counts sorts in descending order, so the most common value comes first."
    B: "These count each distinct value only once, ignoring how often it repeats."
    D: "The total number of values is len(), not value_counts()."
  verify: |
    import pandas as pd
    vc = pd.Series(["a", "b", "a", "c", "a", "b"]).value_counts()
    ans = ", ".join(f"{k} {v}" for k, v in vc.items())

