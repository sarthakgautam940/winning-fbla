# Lesson 4.6: Cleaning and wrangling with pandas

# ---------------------------------------------------------------- pandas-cleaning
- id: pandas-cleaning-01
  skill: pandas-cleaning
  tier: core
  type: code
  use: check
  stem: |
    What does `df.isna().sum()` return?
  options:
    - "The number of missing values in each column"
    - "The total of every numeric column"
    - "The rows that contain no missing values"
    - "The number of columns that have no data type"
  answer: A
  explain: |
    isna() marks each missing cell True, and sum() adds those True values (each counts as 1) down every column, giving a count of missing values per column.
  why:
    B: "df.sum() alone would total the columns; isna() first turns the cells into True and False."
    C: "Keeping complete rows is what dropna() does."
    D: "Every column has a data type; this counts missing cells."
  verify: |
    import pandas as pd
    df = pd.DataFrame({"a": [1, None], "b": [None, None]})
    ans = "The number of missing values in each column" if df.isna().sum().tolist() == [1, 2] else "other"

- id: pandas-cleaning-02
  skill: pandas-cleaning
  tier: competitive
  type: code
  use: check
  stem: |
    A DataFrame has 4 rows. Ben is missing both gpa and club, and Dev is missing only gpa. How many rows does `df.dropna(subset=["club"])` keep?
  options:
    - "1"
    - "2"
    - "3"
    - "4"
  ordered: true
  answer: C
  explain: |
    With subset=["club"], only the club column is checked, so only Ben's row is removed. Dev stays, because Dev's club is present, leaving 3 rows.
  why:
    A: "Only one row has a missing club, so only one row is removed."
    B: "This is what dropna() with no subset gives, removing any row with any missing value."
    D: "Ben's missing club does remove that row."
  verify: |
    import pandas as pd
    df = pd.DataFrame({"name": ["Ava", "Ben", "Chloe", "Dev"], "gpa": [3.6, None, 3.9, None], "club": ["Robotics", None, "Debate", "Robotics"]})
    ans = len(df.dropna(subset=["club"]))

- id: pandas-cleaning-03
  skill: pandas-cleaning
  tier: competitive
  type: code
  use: check
  stem: |
    A city column holds " Austin", "denver", "DENVER ", and "Boston". Which code makes the two Denver entries identical?
  options:
    - "`df['city'].str.upper()`"
    - "`df['city'].str.contains('Denver')`"
    - "`df['city'].str.strip().str.title()`"
    - "`df['city'].astype(float)`"
  answer: C
  explain: |
    strip() removes the stray spaces and title() gives every value the same capitalization, so both entries become "Denver" and are counted together.
  why:
    A: "Upper case alone leaves the trailing space, so 'DENVER ' still differs from 'DENVER'."
    B: "contains() tests for a match and returns True or False; it does not clean the values."
    D: "City names are text and cannot be converted to numbers."
  verify: |
    import pandas as pd
    s = pd.Series([" Austin", "denver", "DENVER ", "Boston"])
    ans = "`df['city'].str.strip().str.title()`" if s.str.strip().str.title().nunique() == 3 else "other"

- id: pandas-cleaning-04
  skill: pandas-cleaning
  tier: competitive
  type: code
  use: quiz
  stem: |
    What does this code print?

    ```python
    import pandas as pd
    d = pd.DataFrame({"a": [1, 1, 2], "b": [5, 5, 5]})
    print(d.drop_duplicates(subset=["b"]).shape)
    ```
  options:
    - "`(3, 2)`"
    - "`(1, 2)`"
    - "`(2, 2)`"
    - "`(1, 1)`"
  answer: B
  explain: |
    With subset=["b"], rows count as duplicates whenever column b matches. All three rows have b = 5, so only the first is kept, but both columns remain: shape (1, 2).
  why:
    A: "Nothing would be removed only if every b value were different."
    C: "This compares whole rows; with subset, only column b is compared."
    D: "subset limits which columns are compared; it does not remove any columns."
  verify: |
    import pandas as pd
    d = pd.DataFrame({"a": [1, 1, 2], "b": [5, 5, 5]})
    ans = "`" + str(d.drop_duplicates(subset=["b"]).shape) + "`"

- id: pandas-cleaning-05
  skill: pandas-cleaning
  tier: competitive
  type: code
  use: quiz
  stem: |
    What does this code print?

    ```python
    import pandas as pd
    s = pd.Series(["7", "x", "9"])
    print(pd.to_numeric(s, errors="coerce").tolist())
    ```
  options:
    - "`[7.0, nan, 9.0]`"
    - "`[7, 9]`"
    - "An error, because 'x' is not a number"
    - "`['7', 'x', '9']`"
  answer: A
  explain: |
    errors="coerce" converts every value it can and turns the rest into NaN instead of raising an error. NaN is a float, so the whole column becomes floats.
  why:
    B: "Coercing keeps every position; it marks bad values as NaN rather than dropping them."
    C: "An error is the default behavior, but errors='coerce' replaces it with NaN."
    D: "The values are converted to numbers, not left as text."
  verify: |
    import pandas as pd
    ans = "`" + str(pd.to_numeric(pd.Series(["7", "x", "9"]), errors="coerce").tolist()) + "`"

- id: pandas-cleaning-06
  skill: pandas-cleaning
  tier: champion
  type: code
  use: quiz
  stem: |
    An analyst runs `df.dropna()` on its own line, without assigning the result, and then prints `df`. What do they see?
  options:
    - "df is unchanged, because dropna returned a new DataFrame."
    - "df without the rows that had missing values."
    - "An empty DataFrame, because dropna clears it."
    - "df with every missing value replaced by 0."
  answer: A
  explain: |
    pandas methods return new objects and leave the original alone. The cleaned result was never stored, so df still has its missing values. Writing df = df.dropna() keeps the change.
  why:
    B: "The rows were removed only from the returned copy, which was discarded."
    C: "dropna removes only rows with missing values, and here it did not change df at all."
    D: "Replacing missing values is what fillna does, not dropna."
  verify: |
    import pandas as pd
    df = pd.DataFrame({"x": [1, None]})
    df.dropna()
    ans = "df is unchanged, because dropna returned a new DataFrame." if len(df) == 2 else "other"

