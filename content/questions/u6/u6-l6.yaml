# Lesson 6.6: Capabilities and limitations

# ---------------------------------------------------------------- genai-limits
- id: genai-limits-01
  skill: genai-limits
  tier: core
  type: recall
  use: check
  stem: |
    In generative AI, what is a hallucination?
  options:
    - "A model refusing to answer a question it was asked"
    - "Output that sounds confident and plausible but is false or made up"
    - "An image that a model generates on purpose to look dreamlike"
    - "A model running slowly because its servers are overloaded"
  answer: B
  explain: |
    A hallucination is generated content that reads as confident and believable but is false, invented, or unsupported, such as a fake statistic or a citation to a book that does not exist. NIST's Generative AI Profile calls it confabulation: "confidently stated but erroneous or false content."
  why:
    A: "Refusing to answer is a different behavior; a hallucination is a confident wrong answer."
    C: "A deliberately dreamlike image is creative output, not an error."
    D: "Slow responses are a performance problem, not false content."

- id: genai-limits-02
  skill: genai-limits
  tier: competitive
  type: scenario
  use: check
  stem: |
    In 2024, a Canadian tribunal decided a case in which Air Canada's website chatbot gave a customer wrong information about bereavement fares. What did the tribunal decide?
  options:
    - "The chatbot was a separate legal entity responsible for itself"
    - "The customer was at fault for trusting a chatbot at all"
    - "No one was responsible, because the error came from AI"
    - "Air Canada was liable for what its chatbot told the customer"
  answer: D
  explain: |
    In Moffatt v. Air Canada (2024), British Columbia's Civil Resolution Tribunal held the airline liable for negligent misrepresentation and rejected the argument that the chatbot was a separate legal entity, noting that it was "still just a part of Air Canada's website." A company is responsible for what its AI tools tell customers.
  why:
    A: "The tribunal called that argument 'a remarkable submission' and rejected it."
    B: "The tribunal found that the airline, not the customer, failed to take reasonable care."
    C: "Using AI does not remove responsibility; the company that deploys it answers for it."

- id: genai-limits-03
  skill: genai-limits
  tier: competitive
  type: concept
  use: check
  stem: |
    A teacher runs the same prompt through an LLM three times and gets three differently worded answers, one of them with a factual error. Which property of LLMs does this show?
  options:
    - "Non-determinism: outputs are sampled, so they vary between runs"
    - "Memorization: the model repeats its training data word for word"
    - "Overfitting: the model learned its training data too closely"
    - "Multimodality: the model works with several kinds of data"
  answer: A
  explain: |
    With the temperature above 0, an LLM samples each next token, so the same prompt can produce different answers, occasionally including a wrong one. That makes results hard to reproduce and test; a lower temperature and careful checking help.
  why:
    B: "Different answers each time are the opposite of repeating fixed text."
    C: "Overfitting is a training problem; varied answers to one prompt come from sampling."
    D: "Multimodality concerns kinds of data, not answers that vary."

- id: genai-limits-04
  skill: genai-limits
  tier: competitive
  type: concept
  use: check
  stem: |
    According to the U.S. Copyright Office's 2023 registration guidance, how does copyright treat material generated by AI?
  options:
    - "AI companies automatically own the copyright in every output"
    - "Any output becomes copyrighted by whoever typed the prompt"
    - "Only human creativity is protected, not expression the AI determined"
    - "AI-generated material is protected for twice as long as usual"
  answer: C
  explain: |
    The Office's March 2023 guidance says that copyright can protect only material that is the product of human creativity, and that when an AI technology determines the expressive elements of its output, the generated material is not the product of human authorship. Applicants must disclose AI-generated content when they register a work, and only the human-authored parts can be claimed.
  why:
    A: "The guidance gives AI companies no automatic ownership; it requires human authorship."
    B: "Typing a prompt alone does not make a person the author of expression the AI determined."
    D: "No special, longer protection exists for AI-generated material."

- id: genai-limits-05
  skill: genai-limits
  tier: core
  type: concept
  use: quiz
  stem: |
    Which of these is a limitation of today's generative AI?
  options:
    - "It can draft whole pages of text in seconds"
    - "It can summarize long documents quickly"
    - "It can translate between many different languages"
    - "It can state false information with confidence"
  answer: D
  explain: |
    Generative models produce likely-sounding text, not verified facts, so they can present false or invented information in the same confident tone as true information. The other options are genuine strengths.
  why:
    A: "Fast drafting is a strength of generative AI."
    B: "Summarizing is one of the things LLMs do well."
    C: "Translation is a well-established strength of LLMs."

- id: genai-limits-06
  skill: genai-limits
  tier: competitive
  type: concept
  use: quiz
  stem: |
    Why do large generative AI models raise environmental concerns?
  options:
    - "Every conversation is saved forever, so storage alone uses most of their power"
    - "Training and running them takes heavy computation that uses a lot of electricity"
    - "Each answer permanently uses up rare metals inside the chips that compute it"
    - "Their network traffic slows the internet for everyone in the same region"
  answer: B
  explain: |
    Training a large model and then serving it to many users take enormous amounts of computation in data centers, which consume large amounts of electricity. NIST's 2024 Generative AI Profile lists environmental impacts, caused by the high compute used to train and operate models, among the 12 risks of generative AI, and cost and energy are good reasons to use smaller models when they are accurate enough.
  why:
    A: "NIST ties the environmental risk to the compute used to train and operate models, not to storing conversations."
    C: "Chips are not used up by computing an answer; the concern is the electricity the computation draws."
    D: "NIST ties the risk to high compute use, not to network traffic."

- id: genai-limits-07
  skill: genai-limits
  tier: champion
  type: scenario
  use: quiz
  stem: |
    A team's LLM answers correctly when asked "What is our refund policy?" but gives a different, wrong answer to "Can you remind me what the refund rules are?" What does this show, and what should the team do?
  options:
    - "Prompt sensitivity; test many phrasings and ground answers in the policy text"
    - "The model is overloaded; send it fewer questions per day"
    - "The context window is full; delete the policy document"
    - "The temperature is too low; raise it so answers vary more"
  answer: A
  explain: |
    Small changes in wording can change an LLM's answer, which is called prompt sensitivity. The team should test many phrasings of the same question, and grounding answers in the actual policy text, for example with retrieval-augmented generation, makes them consistent and correct.
  why:
    B: "Load affects speed, not which answer the model gives to a reworded question."
    C: "Deleting the policy would make wrong answers more likely, not less."
    D: "More randomness would make answers less consistent, not more correct."

- id: genai-limits-08
  skill: genai-limits
  tier: competitive
  type: concept
  use: quiz
  stem: |
    An LLM trained mostly on internet text often describes nurses as women and engineers as men. Which limitation does this show?
  options:
    - "A knowledge cutoff that hides recent hiring data"
    - "A context window too small to hold job descriptions"
    - "Bias absorbed from patterns in its training data"
    - "Non-determinism caused by a high temperature setting"
  answer: C
  explain: |
    LLMs learn statistical patterns from human-written text, including stereotypes, so they can reproduce and even amplify them. Reducing such bias takes careful data choices, testing, and fine-tuning (lesson 8.2).
  why:
    A: "The pattern comes from what the training data emphasizes, not from missing recent data."
    B: "The window's size does not create stereotypes."
    D: "Randomness would vary the answers, not produce a consistent stereotype."

- id: genai-limits-09
  skill: genai-limits
  tier: core
  type: concept
  use: bank
  stem: |
    Which task plays to a genuine strength of generative AI?
  options:
    - "Drafting a first version of a cover letter for a person to edit"
    - "Guaranteeing that every fact in a medical report is correct"
    - "Reporting the exact score of a game that ended an hour ago"
    - "Making final legal decisions with no human review"
  answer: A
  explain: |
    Generative AI is good at producing fluent first drafts quickly, which a person can then check and improve. It cannot guarantee correctness, it does not know events after its knowledge cutoff without tools, and high-stakes decisions need human review.
  why:
    B: "Generative AI can state false facts confidently, so it cannot guarantee correctness."
    C: "Events after the knowledge cutoff are unknown unless the model has a search tool."
    D: "High-stakes decisions need human oversight because of errors and bias."

- id: genai-limits-10
  skill: genai-limits
  tier: champion
  type: scenario
  use: bank
  stem: |
    A student types a prompt into an image generator and submits the resulting picture, unedited, for U.S. copyright registration as the student's own work. Under the U.S. Copyright Office's 2023 guidance, what is the likely outcome?
  options:
    - "The student owns full copyright because the student typed the prompt"
    - "The image company receives the copyright instead of the student"
    - "The image is copyrighted automatically, with no application needed"
    - "The AI-determined image is not human authorship, so it cannot be claimed"
  answer: D
  explain: |
    The guidance says copyright protects only material that is the product of human creativity, and that when an AI technology determines the expressive elements of its output, the result is not the product of human authorship. An unedited AI image therefore cannot be claimed; applicants must disclose AI-generated content, and only human-authored parts of a work can be registered.
  why:
    A: "Writing a prompt alone does not make the student the author of expression the AI determined."
    B: "The guidance does not hand copyright to the AI company; the material lacks a human author."
    C: "The issue is whether there is human authorship at all, not the paperwork."

- id: genai-limits-11
  skill: genai-limits
  tier: competitive
  type: recall
  use: bank
  stem: |
    NIST's 2024 Generative AI Profile uses the term "confabulation" for which problem?
  options:
    - "A model leaking private data from its training set"
    - "Confidently stated but false or erroneous content"
    - "A model refusing to answer harmless questions"
    - "Attackers hiding instructions inside documents"
  answer: B
  explain: |
    NIST describes confabulation as "confidently stated but erroneous or false content," which is popularly called hallucination. It is one of the 12 risks the profile lists for generative AI.
  why:
    A: "Leaking training data is a data-privacy risk (lesson 8.5)."
    C: "Refusing harmless questions is a usability problem, not confabulation."
    D: "Hidden instructions describe indirect prompt injection (lesson 8.4)."

- id: genai-limits-12
  skill: genai-limits
  tier: competitive
  type: scenario
  use: bank
  stem: |
    A company needs to sort millions of short support messages into five categories. A huge general-purpose LLM and a much smaller fine-tuned model reach similar accuracy. Which choice is usually wiser, and why?
  options:
    - "The huge model, because bigger models are always more accurate"
    - "The huge model, because energy use does not depend on model size"
    - "The smaller model, because it costs less to run and uses less energy"
    - "Neither, because LLMs cannot classify text at all"
  answer: C
  explain: |
    Running a model costs money and electricity for every request, and larger models cost more per request. When a smaller model is accurate enough for a narrow task, it is cheaper, faster, and uses less energy, which matters at the scale of millions of messages.
  why:
    A: "Here the two are equally accurate, and bigger is not always better for a narrow task."
    B: "Larger models need more computation, so they use more energy per request."
    D: "Classifying text is something LLMs do well."

- id: genai-limits-13
  skill: genai-limits
  tier: champion
  type: scenario
  use: bank
  stem: |
    A developer tests a new LLM feature by running one prompt once, sees a correct answer, and declares the feature ready. Why is this test not enough?
  options:
    - "The output varies between runs, so many runs and inputs must be checked"
    - "LLMs always give the wrong answer on the second attempt"
    - "One correct answer proves the model is correct for every input"
    - "Testing changes the model's weights, so it must be retrained"
  answer: A
  explain: |
    Because LLMs sample their outputs, one correct run says little about the next. Reliable testing runs many prompts, phrasings, and repetitions, measures how often the answers are right, and checks edge cases, ideally with a low temperature for tasks that need consistency.
  why:
    B: "Nothing makes a second attempt always wrong; answers vary in both directions."
    C: "This states the mistake itself: one success cannot show correctness everywhere."
    D: "Running prompts does not change the weights; using a model leaves it unchanged."

# ---------------------------------------------------------------- llm-capabilities
- id: llm-capabilities-01
  skill: llm-capabilities
  tier: core
  type: scenario
  use: check
  stem: |
    Which request is an LLM best suited to handle well on its own?
  options:
    - "Report the current price of a stock to the cent"
    - "Multiply two 12-digit numbers exactly in its head"
    - "Summarize a five-page article in one paragraph"
    - "Confirm a fact that happened after its training ended"
  answer: C
  explain: |
    Summarizing text that is in the prompt plays to an LLM's strengths in reading and writing language. Live prices and recent events lie beyond its knowledge cutoff, and long exact arithmetic is unreliable without a calculator tool.
  why:
    A: "Current prices change constantly and require a live data tool."
    B: "Exact arithmetic on long numbers needs a calculator tool."
    D: "The model knows nothing after its knowledge cutoff unless it is given the information."

- id: llm-capabilities-02
  skill: llm-capabilities
  tier: competitive
  type: scenario
  use: check
  stem: |
    A user asks an LLM about a law that was passed last month, and the model describes the law as it stood two years ago. What best explains this?
  options:
    - "The law changed after the model's knowledge cutoff"
    - "The model's temperature was set too low"
    - "The model deliberately hides recent information"
    - "The model's context window holds only two years of text"
  answer: A
  explain: |
    A model's knowledge comes from training data that ends at its knowledge cutoff, so it knows nothing about later changes unless the new information is supplied, for example by retrieval or a search tool. It may still answer confidently with the outdated version.
  why:
    B: "Temperature affects randomness, not how recent the model's knowledge is."
    C: "Nothing is hidden on purpose; the model simply never saw the new law."
    D: "The context window is measured in tokens, not years, and it is not what limits knowledge of recent events."

- id: llm-capabilities-03
  skill: llm-capabilities
  tier: competitive
  type: scenario
  use: check
  stem: |
    Yesterday a user told a chatbot their favorite programming language. Today, in a brand-new conversation with no memory feature turned on, the chatbot does not know it. Why?
  options:
    - "The model's weights were reset overnight"
    - "The chatbot chose to forget personal details"
    - "The language name was too long to tokenize"
    - "Each new conversation starts with an empty context window"
  answer: D
  explain: |
    An LLM keeps no memory between separate conversations: what it knows in a chat is its fixed training plus whatever is in the current context window. Apps with memory features save notes from past chats and insert them into new prompts; the model itself is not changed by conversations.
  why:
    A: "The conversation never changed the weights in the first place."
    B: "Nothing was chosen; the information simply is not in the new context."
    C: "Any word can be tokenized; length is not the issue."

- id: llm-capabilities-04
  skill: llm-capabilities
  tier: competitive
  type: scenario
  use: check
  stem: |
    Which task most needs a tool, such as a calculator or a code interpreter, for an LLM to do it reliably?
  options:
    - "Explaining what a standard deviation measures"
    - "Computing the standard deviation of 5,000 numbers"
    - "Writing a friendly email that asks for a meeting"
    - "Suggesting titles for a school science project"
  answer: B
  explain: |
    Explaining concepts and writing text are strengths of LLMs, but an exact calculation over thousands of numbers is not, because the model predicts tokens rather than computing. Running the numbers through a calculator or code tool gives an exact answer.
  why:
    A: "Explaining a concept is a language task LLMs handle well."
    C: "Writing a friendly email is a core LLM strength."
    D: "Brainstorming titles is a creative language task."

- id: llm-capabilities-05
  skill: llm-capabilities
  tier: core
  type: concept
  use: quiz
  stem: |
    Which list contains only tasks that LLMs generally do well?
  options:
    - "Translating text, reporting live sports scores, writing poems"
    - "Summarizing reports, counting letters exactly, citing sources"
    - "Drafting emails, summarizing articles, explaining code"
    - "Giving today's weather, translating text, doing tax math exactly"
  answer: C
  explain: |
    Drafting, summarizing, and explaining are language tasks that play to LLM strengths. Live scores and weather need current data, exact counting and precise arithmetic need tools, and citations must be verified because models can invent them.
  why:
    A: "Live sports scores require current data beyond the model's knowledge cutoff."
    B: "Exact letter counts and reliable citations are known weak spots."
    D: "Today's weather needs live data, and exact tax math needs a calculator."

- id: llm-capabilities-06
  skill: llm-capabilities
  tier: competitive
  type: scenario
  use: quiz
  stem: |
    Which request is an LLM most likely to get wrong without help from a tool?
  options:
    - "Rewrite a paragraph so it sounds more formal"
    - "Explain the difference between weather and climate"
    - "Suggest three titles for a short story about a lighthouse"
    - "Count exactly how many times the letter e appears in an essay"
  answer: D
  explain: |
    LLMs read tokens, which group letters together, so they do not see individual letters directly, and counting them across a long text is error-prone. A short program counts them exactly. Rewriting, explaining, and brainstorming are LLM strengths.
  why:
    A: "Changing a paragraph's tone is a core language skill for LLMs."
    B: "Explaining a well-documented concept is an LLM strength."
    C: "Brainstorming titles is a creative task LLMs handle well."

- id: llm-capabilities-07
  skill: llm-capabilities
  tier: champion
  type: scenario
  use: quiz
  stem: |
    A news team wants an LLM assistant to answer questions about events from this morning, with sources. Which design best meets that need?
  options:
    - "Lower the temperature so the model recalls recent news better"
    - "Connect the model to a search or retrieval tool and have it cite sources"
    - "Ask the model to promise that its information is up to date"
    - "Use a larger model, because bigger models know about recent events"
  answer: B
  explain: |
    Events from this morning are past any model's knowledge cutoff, so the model needs current information supplied to it. A search or retrieval tool finds recent articles and places them in the context; the model can then answer and cite them, which also lets readers check the claims.
  why:
    A: "Temperature changes randomness, not what the model knows."
    C: "A model's promise cannot add knowledge it never received."
    D: "A larger model has the same knowledge cutoff problem."

- id: llm-capabilities-08
  skill: llm-capabilities
  tier: competitive
  type: scenario
  use: quiz
  stem: |
    An office has hundreds of messy emails and wants a table listing each sender's name, company, and requested meeting date. How well suited is an LLM to this task?
  options:
    - "Well suited for extracting the details, with spot checks for errors"
    - "Unsuited, because LLMs cannot read emails written by people"
    - "Unsuited, because tables can only be made with hand-written rules"
    - "Well suited, and its output never needs to be checked"
  answer: A
  explain: |
    Pulling names, companies, and dates out of messy, varied text and arranging them in a table is a task LLMs do well. Because they still make occasional errors, spot-checking the output, especially the dates, is good practice.
  why:
    B: "Reading human-written email is exactly the kind of text LLMs handle well."
    C: "LLMs can produce tables directly from text without hand-written rules."
    D: "Even strong models make occasional mistakes, so important output should be checked."

- id: llm-capabilities-09
  skill: llm-capabilities
  tier: core
  type: recall
  use: quiz
  stem: |
    What is an LLM's knowledge cutoff?
  options:
    - "The maximum number of tokens it can read at one time"
    - "The point at which it refuses to answer any more questions"
    - "The date after which its training data contains no information"
    - "The setting that limits how creative its answers can be"
  answer: C
  explain: |
    A model learns from training data collected up to some date, its knowledge cutoff. It knows nothing about later events unless the information is provided, for example through retrieval or a search tool, and it may answer questions about recent events with outdated information.
  why:
    A: "The maximum number of tokens at once is the context window."
    B: "Refusals are a separate behavior shaped by training, not the cutoff."
    D: "Creativity is shaped by sampling settings such as temperature."

- id: llm-capabilities-10
  skill: llm-capabilities
  tier: competitive
  type: concept
  use: bank
  stem: |
    A chatbot app remembers a user's preferred tone across separate conversations. How does a memory feature like this usually work?
  options:
    - "The model's weights are retrained after every conversation"
    - "The model's context window grows larger each day"
    - "The model memorizes users during its original pretraining"
    - "The app saves notes and adds them to the prompt in new chats"
  answer: D
  explain: |
    Memory features are usually built around the model, not inside it: the application stores notes about the user and inserts them into the context window of each new conversation. The model's weights do not change.
  why:
    A: "Retraining after every conversation would be slow and costly, and it is not how memory features work."
    B: "The context window has a fixed size; it does not grow over time."
    C: "Pretraining happened before the user ever arrived, so it could not include them."

- id: llm-capabilities-11
  skill: llm-capabilities
  tier: champion
  type: scenario
  use: bank
  stem: |
    An LLM gives a student five sources for a history essay, each with an author, a title, and a journal name. Two of the sources cannot be found anywhere. What is the best explanation and response?
  options:
    - "The sources were removed from the internet; cite them anyway"
    - "The model generated plausible but fake citations; verify every source"
    - "The library's search is broken; trust the model's list"
    - "The model was hacked; report the chatbot to the police"
  answer: B
  explain: |
    LLMs produce text that fits learned patterns, and a citation pattern (author, title, journal) is easy to fill in with plausible inventions. Fabricated references are a well-known form of hallucination, so every source an LLM suggests must be checked before it is used.
  why:
    A: "Citing sources you cannot find risks presenting invented work as real."
    C: "The likelier explanation is fabrication by the model, not a broken library."
    D: "Fake citations are a normal failure of LLMs, not evidence of hacking."

- id: llm-capabilities-12
  skill: llm-capabilities
  tier: competitive
  type: scenario
  use: bank
  stem: |
    During a chat, a user corrects an LLM's wrong statement about a historical date, and the model agrees. Will other users who ask tomorrow get the corrected date?
  options:
    - "Not because of this chat; conversations do not change the model's weights"
    - "Yes, because every correction is instantly added to the model"
    - "Yes, because the model shares each user's context with others"
    - "No, because the model will now refuse all history questions"
  answer: A
  explain: |
    A conversation changes only the current context, not the model's weights, so the correction disappears when the chat ends. Developers may later use feedback to improve future versions, but a single conversation does not update the model that other people use.
  why:
    B: "Corrections in a chat are not written into the model's weights."
    C: "Each user's conversation has its own context, which is not shared with others."
    D: "Nothing about a correction makes the model refuse a whole topic."

- id: llm-capabilities-13
  skill: llm-capabilities
  tier: competitive
  type: scenario
  use: bank
  stem: |
    A programmer asks an LLM to write a function that sorts a list of records by date. What is the most sensible way to use the result?
  options:
    - "Paste it straight into the product, since LLM code is always correct"
    - "Throw it away, since LLMs cannot write working code"
    - "Treat it as a draft, then read, test, and fix it as needed"
    - "Ask the LLM to promise that the code has no bugs"
  answer: C
  explain: |
    Writing code is a real strength of LLMs, but generated code can contain bugs or security flaws, so it should be reviewed and tested like any other code before it is used.
  why:
    A: "Generated code can be wrong, so it needs review and testing."
    B: "LLMs often write working code; the point is to verify it."
    D: "A promise from the model guarantees nothing; only tests can show the code works."
