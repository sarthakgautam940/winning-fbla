  stem: |
    In RLHF, what does the reward model do?
  options:
    - "It writes the demonstration answers used for fine-tuning"
    - "It pays the human labelers for each ranking they give"
    - "It splits training text into tokens before pretraining"
    - "It predicts how highly people would rate a model's response"
  answer: D
  explain: |
    The reward model is trained on human rankings of model outputs so that it can score new responses the way people would. Reinforcement learning then adjusts the language model to produce responses the reward model scores highly, without a person rating every answer.
  why:
    A: "Demonstrations are written by people in the supervised fine-tuning step."
    B: "Despite the name, the reward is a score for responses, not payment."
