# ================================================================ Test 5
- id: pt5-ml-01
  test: 5
  skill: other-paradigms
  objective: ML1
  tier: champion
  type: concept
  stem: |
    Which statement correctly classifies k-nearest neighbors and a decision tree as lazy or eager learners?
  options:
    - "k-NN is lazy; a decision tree is eager"
    - "A decision tree is lazy; k-NN is eager"
    - "Both are lazy learners"
    - "Both are eager learners"
  answer: A
  explain: |
    A lazy learner does almost nothing during training and its real work at prediction time, as k-NN does when it searches for neighbors. An eager learner builds its model during training, as a decision tree does when it chooses its splits.
  why:
    B: "This reverses them: the tree builds its model up front, while k-NN waits until prediction."
    C: "A decision tree does its work during training, so it is eager."
    D: "k-NN only stores the data during training, so it is lazy."

- id: pt5-ml-02
  test: 5
  skill: data-splits
  objective: ML2
  tier: competitive
  type: calculation
  stem: |
    A fraud dataset has 4,000 transactions, and 5% of them are fraud. A stratified split puts 20% of the transactions in the test set. How many fraud cases does the test set get?
  options:
    - "20"
    - "40"
    - "200"
    - "800"
  ordered: true
  answer: B
  explain: |
    The test set holds 20% of 4,000 = 800 examples, and a stratified split keeps the same 5% share of positives in it: 0.05 × 800 = 40.
  why:
    A: "20 takes 5% of 400, as if the test set were 10% of the data."
    C: "200 is every positive example in the whole dataset."
    D: "800 is the size of the whole test set."
  verify: "4000 * 0.20 * 0.05"

- id: pt5-ml-03
  test: 5
  skill: leakage
  objective: ML2
  tier: champion
  type: scenario
  stem: |
    A model is meant to predict, when a patient is admitted, whether the patient will need intensive care. One of its features is "number of days spent in intensive care." What is wrong?
  options:
    - "The feature is fine, since it is highly predictive"
    - "The feature should be standardized first"
    - "Target leakage: the feature is unknown at admission"
    - "The model will underfit with too many features"
  answer: C
  explain: |
    Days in intensive care are only known after the outcome has happened, and they nearly give the answer away. The feature would not exist at admission, when predictions are made, so the model would look excellent in testing and fail in use.
  why:
    A: "It is predictive only because it reveals the outcome, which is the definition of leakage."
    B: "Scaling a leaked feature does not stop it from revealing the answer."
    D: "The problem is one leaked feature, not the number of features."

- id: pt5-ml-04
  test: 5
  skill: regularization
  objective: ML3
  tier: competitive
  type: concept
  stem: |
    Increasing the regularization strength, lambda, moves a model along the bias-variance tradeoff in which direction?
  options:
    - "Toward higher bias and lower variance"
    - "Toward lower bias and higher variance"
    - "Toward lower bias and lower variance"
    - "It changes neither bias nor variance"
  answer: A
  explain: |
    A larger lambda penalizes complexity more, so the model becomes simpler and more stable: variance falls while bias rises. Too much lambda leads to underfitting.
  why:
    B: "This is the effect of reducing lambda, which lets the model grow more complex."
    C: "Regularization trades one for the other; it does not lower both at once."
    D: "Lambda directly controls model complexity, so it shifts the tradeoff."

- id: pt5-ml-05
  test: 5
  skill: linear-models
  objective: ML3
  tier: competitive
  type: calculation
  stem: |
    A logistic regression model computes the score z = 0.5x - 2. What probability does it predict for x = 4?
  options:
    - "0.12"
    - "0.5"
    - "0.88"
    - "2"
  ordered: true
  answer: B
  explain: |
    For x = 4, the score is z = 0.5 × 4 minus 2 = 0. The sigmoid of 0 is 0.5, so the model is exactly undecided.
  why:
    A: "0.12 is the sigmoid of negative 2, which leaves out the 0.5x term."
    C: "0.88 is the sigmoid of 2, which leaves out the minus 2."
    D: "2 is 0.5 × 4 alone; a probability can never exceed 1."
  verify: "1 / (1 + math.exp(-(0.5 * 4 - 2)))"

- id: pt5-ml-06
  test: 5
  skill: neurons
  objective: ML3
  tier: champion
  type: calculation
  stem: |
    A network forecasts a store's sales and foot traffic (2 outputs) from 3 inputs. It is fully connected, with two hidden layers of 4 neurons each. Counting weights and biases, how many parameters does it have?
  options:
    - "13"
    - "36"
    - "44"
    - "46"
  ordered: true
  answer: D
  explain: |
    Layer by layer: 3 × 4 weights + 4 biases = 16; 4 × 4 weights + 4 biases = 20; 4 × 2 weights + 2 biases = 10. In total, 16 + 20 + 10 = 46.
  why:
    A: "13 counts the neurons in all four layers."
    B: "36 counts the weights, 12 + 16 + 8, but leaves out the 10 biases."
    C: "44 leaves out the 2 biases of the output layer."
  verify: "(3 * 4 + 4) + (4 * 4 + 4) + (4 * 2 + 2)"

- id: pt5-ml-07
  test: 5
  skill: rl-details
  objective: ML4
  tier: champion
  type: calculation
  stem: |
    In some state, an agent's Q-values are 3 for "left" and 7 for "right." It follows an epsilon-greedy policy with epsilon = 0.2, choosing between the two actions at random when it explores. What is the probability that it chooses "right"?
  options:
    - "0.2"
    - "0.8"
    - "0.9"
    - "1"
  ordered: true
  answer: C
  explain: |
    With probability 0.8 it exploits and picks the action with the higher Q-value, right. With probability 0.2 it explores and picks at random, and half of those random picks are also right: 0.8 + 0.2 × 0.5 = 0.9.
  why:
    A: "0.2 is the chance of exploring, not of choosing right."
    B: "0.8 forgets that a random exploratory pick can also land on right."
    D: "1 would be a purely greedy policy with no exploration."
  verify: "0.8 + 0.2 * 0.5"

