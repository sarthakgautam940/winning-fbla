- id: pt5-ml-10
  test: 5
  skill: deep-architectures
  objective: ML6
  tier: competitive
  type: calculation
  stem: |
    A satellite-image model slides a 7 × 7 kernel over each 50 × 50 pixel tile, one pixel at a time, with no padding. What size is the resulting feature map?
  options:
    - "43 × 43"
    - "44 × 44"
    - "50 × 50"
    - "57 × 57"
  answer: B
  explain: |
    With a stride of 1 and no padding, an n × n image and a k × k kernel give (n minus k + 1) × (n minus k + 1): 50 minus 7 + 1 = 44, so the map is 44 × 44.
  why:
    A: "43 × 43 subtracts the kernel size but forgets to add 1."
    C: "Without padding, the kernel cannot be centered on edge pixels, so the map shrinks."
    D: "57 × 57 adds the kernel size instead of subtracting it."
  verify: |
    n = 50 - 7 + 1
    ans = f"{n} × {n}"
