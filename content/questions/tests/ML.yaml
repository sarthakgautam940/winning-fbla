- id: pt3-ml-10
  test: 3
  skill: deep-architectures
  objective: ML6
  tier: competitive
  type: visual
  stem: |
    A convolutional layer in a traffic-sign classifier produces the 4 × 4 feature map below, and max pooling with 2 × 2 windows and a stride of 2 is applied to it. What value lands in the top-right cell of the pooled map?

    | | | | |
    |---|---|---|---|
    | 1 | 4 | 2 | 0 |
    | 3 | 2 | 5 | 1 |
    | 0 | 6 | 1 | 3 |
    | 2 | 1 | 4 | 2 |
  options:
    - "2"
    - "4"
    - "5"
    - "6"
  ordered: true
  answer: C
  explain: |
    The top-right output cell covers the top-right 2 × 2 window: 2, 0, 5, and 1. Max pooling keeps the largest, 5.
  why:
    A: "2 is the average of the window; max pooling keeps the largest value."
    B: "4 is the top-left output, from the window 1, 4, 3, and 2."
    D: "6 is the largest value in the whole map, which sits in the bottom-left window."
  verify: "max([2, 0, 5, 1])"

# ================================================================ Test 4
- id: pt4-ml-01
  test: 4
  skill: ml-vocab
  objective: ML1
  tier: champion
  type: concept
  stem: |
    What does a k-nearest neighbors model learn during training?
  options:
    - "Nothing much; it just stores the data"
    - "The best value of k for the data"
    - "One learned weight for each feature"
    - "A centroid summarizing each class"
  answer: A
  explain: |
    k-NN is a lazy, non-parametric learner: training just stores the examples, and the work happens at prediction time, when it finds the nearest neighbors. k is a hyperparameter chosen beforehand, not something it learns.
  why:
    B: "k is a hyperparameter set before training, often tuned on validation data."
    C: "k-NN fits no feature weights; it compares distances to stored examples."
    D: "Centroids belong to k-means clustering, not k-nearest neighbors."

- id: pt4-ml-02
  test: 4
  skill: leakage
  objective: ML2
  tier: competitive
  type: scenario
  stem: |
    A dataset holds many photos of each of 200 patients. The photos are split at random, so the same patient appears in both training and test sets. What should be done?
  options:
    - "Use more photos per patient"
    - "Split by patient, so each patient is in only one set"
    - "Shuffle the photos again before splitting"
    - "Remove the test set and use only training data"
  answer: B
  explain: |
    Photos of the same patient share features, so a model can score well on test photos of patients it has already seen without truly generalizing. Splitting by patient keeps all of each patient's photos in one set and gives an honest test.
  why:
    A: "More photos per patient adds more overlap, not less."
    C: "Another random shuffle still mixes each patient's photos across the sets."
    D: "Without a test set there is no honest measure of performance."

- id: pt4-ml-03
  test: 4
  skill: fit-tradeoff
  objective: ML2
  tier: core
  type: scenario
  stem: |
    A plant-disease classifier is 97% accurate on its training photos but only 70% accurate on validation photos. What is the most likely problem?
  options:
    - "Underfitting"
    - "Data that are too clean"
    - "Overfitting"
    - "A validation set that is too large"
  answer: C
  explain: |
    A model that does far better on the data it trained on than on new data has learned quirks of the training set rather than general patterns: overfitting.
  why:
    A: "Underfitting gives poor results on both training and validation data."
    B: "Clean data do not cause a gap between training and validation scores."
    D: "A larger validation set gives a more reliable score; it does not create the gap."

- id: pt4-ml-04
  test: 4
  skill: loss-gd
  objective: ML3
  tier: competitive
  type: concept
  stem: |
    A model is trained with full-batch gradient descent on 1 million examples. How much data does each weight update use, and what follows from that?
  options:
    - "All 1 million examples, so each step is slow but smooth"
    - "One example, so each step is fast but noisy"
    - "A random 100 examples, a middle ground"
    - "No examples; it reuses the previous gradient"
  answer: A
  explain: |
    Full-batch gradient descent computes the gradient over the entire training set before every update, so each step follows the true average gradient but takes a long time on large data. Stochastic and mini-batch versions trade some smoothness for much faster steps.
  why:
    B: "Using one example per update is stochastic gradient descent."
    C: "Using a small random batch per update is mini-batch gradient descent."
    D: "Every update computes a fresh gradient from the data."

- id: pt4-ml-05
  test: 4
  skill: decision-trees
  objective: ML3
  tier: competitive
  type: concept
  stem: |
    Which node is the purest, with the lowest Gini impurity?
  options:
    - "5 yes and 5 no"
    - "10 yes and 0 no"
    - "7 yes and 3 no"
    - "6 yes and 4 no"
  answer: B
  explain: |
    A node holding only one class is perfectly pure, with Gini impurity 0. The more evenly a node mixes the classes, the higher its impurity, and a 50/50 node is the most mixed.
  why:
    A: "A 50/50 node is the most mixed, with the highest impurity for two classes."
    C: "A 70/30 mix is purer than 50/50 but still impure."
    D: "A 60/40 mix is close to even, so it is quite impure."

- id: pt4-ml-06
  test: 4
  skill: knn-svm-nb
  objective: ML3
  tier: champion
  type: concept
  stem: |
    A support vector machine has been trained. A training point that lies far from the boundary, deep inside its own class, is moved even farther away. What happens to the boundary?
  options:
    - "It shifts toward the moved point"
    - "It shifts away from the moved point"
    - "It becomes curved instead of straight"
    - "It stays the same"
  answer: D
  explain: |
    An SVM's boundary is fixed only by the support vectors, the training points closest to it. A point far from the boundary is not a support vector, so moving it farther away changes nothing.
  why:
    A: "Only the points nearest the boundary affect it, and this point is far away."
    B: "Distant points do not push or pull the boundary."
    C: "A curved boundary comes from choosing a kernel, not from moving a distant point."

- id: pt4-ml-07
  test: 4
  skill: other-paradigms
  objective: ML4
  tier: core
  type: scenario
  stem: |
    A model pretrained on millions of general photos is adapted to identify bird species using a small set of labeled bird photos. What is this called?
  options:
    - "Reinforcement learning"
    - "Online learning"
    - "Transfer learning"
    - "Unsupervised clustering"
  answer: C
  explain: |
    Transfer learning reuses what a model learned on one large task, here recognizing everyday images, and fine-tunes it for a related task with far less labeled data.
  why:
    A: "No agent learns from rewards; a pretrained model is fine-tuned."
    B: "Online learning updates a model continuously as data arrive; here an existing model is adapted to a new task."
    D: "The bird photos are labeled, and the goal is to classify them, not to find clusters."

- id: pt4-ml-08
  test: 4
  skill: unsupervised
  objective: ML4
  tier: competitive
  type: scenario
  stem: |
    Before modeling, a team combines 120 correlated survey features into 5 new features that keep most of the information, with no labels involved. Which unsupervised technique is this?
  options:
    - "Association rule mining of answers"
    - "Dimensionality reduction, like PCA"
    - "Anomaly detection on respondents"
    - "Clustering of the respondents"
  answer: B
  explain: |
    Dimensionality reduction replaces many correlated features with a few new ones that capture most of the variation; principal component analysis is the classic method.
  why:
    A: "Association rules find items that occur together, such as products bought in one trip."
    C: "Anomaly detection flags unusual cases rather than compressing features."
    D: "Clustering groups the rows, the respondents, rather than combining the columns."

- id: pt4-ml-09
  test: 4
  skill: choose-approach
  objective: ML5
  tier: competitive
  type: scenario
  stem: |
    An office building wants its elevators to learn when to send cars to which floors by trying strategies and measuring how long people wait. Which approach fits?
  options:
    - "Supervised classification"
    - "Unsupervised clustering"
    - "Dimensionality reduction"
    - "Reinforcement learning"
