# Practice-test items: Machine Learning (10 per test)

# ================================================================ Test 1
- id: pt1-ml-01
  test: 1
  skill: ml-nature
  objective: ML1
  tier: core
  type: scenario
  stem: |
    A model learns to send support tickets to the right department, and it gets better as it trains on more tickets labeled by department. In Mitchell's definition of machine learning, what is the task, T?
  options:
    - "The labeled tickets it trains on"
    - "The share of tickets routed correctly"
    - "Sending each ticket to the right department"
    - "The computer the model runs on"
  answer: C
  explain: |
    Mitchell's definition names a task T, a performance measure P, and experience E. The task is the job the program does, routing tickets; the share routed correctly is P, and the labeled tickets are E.
  why:
    A: "The labeled tickets are the experience, E, that the program learns from."
    B: "The share routed correctly is the performance measure, P."
    D: "The hardware plays no part in the definition."

- id: pt1-ml-02
  test: 1
  skill: data-splits
  objective: ML2
  tier: competitive
  type: calculation
  stem: |
    A lender's dataset of 2,500 past loan applications is split 80% for training, 10% for validation, and 10% for testing. How many applications are in the validation set?
  options:
    - "250"
    - "500"
    - "2,000"
    - "2,250"
  ordered: true
  answer: A
  explain: |
    The validation set gets 10% of the data: 0.10 × 2,500 = 250 examples.
  why:
    B: "500 is the validation and test sets together."
    C: "2,000 is the training set, 80%."
    D: "2,250 is the training and validation sets together."
  verify: "2500 * 0.10"

- id: pt1-ml-03
  test: 1
  skill: leakage
  objective: ML2
  tier: competitive
  type: scenario
  stem: |
    Before splitting the data, an analyst fills every missing value with the mean of that column computed over the whole dataset. What is the problem?
  options:
    - "Mean imputation is never acceptable"
    - "Test-set values shaped the training data"
    - "The test set becomes too small to use"
    - "Imputing values always causes underfitting"
  answer: B
  explain: |
    The means included the test rows, so information from the test set leaked into the training data, and the test score will be slightly too optimistic. Splitting first and computing the means from the training set alone avoids it.
  why:
    A: "Mean imputation can be reasonable; the mistake is computing the means before splitting."
    C: "Imputation fills gaps; it does not shrink the test set."
    D: "Imputation does not by itself cause underfitting."

- id: pt1-ml-04
  test: 1
  skill: decision-trees
  objective: ML3
  tier: competitive
  type: calculation
  stem: |
    A node in a loan-approval tree holds 10 applications: 9 approved and 1 denied. Using Gini = 1 minus the sum of the squared class proportions, what is the node's Gini impurity?
  options:
    - "0.18"
    - "0.5"
    - "0.82"
    - "0.9"
  ordered: true
  answer: A
  explain: |
    The class proportions are 0.9 and 0.1, whose squares are 0.81 and 0.01. Their sum is 0.82, so Gini = 1 minus 0.82 = 0.18, a nearly pure node.
  why:
    B: "0.5 is the Gini impurity of an evenly mixed two-class node, the most impure case."
    C: "0.82 is the sum of the squared proportions; Gini subtracts it from 1."
    D: "0.9 is the share of approved applications, not an impurity."
  verify: "1 - (0.9 ** 2 + 0.1 ** 2)"

- id: pt1-ml-05
  test: 1
  skill: knn-svm-nb
  objective: ML3
  tier: competitive
  type: calculation
  stem: |
    A k-nearest neighbors model with k = 3 predicts house prices. The 3 nearest houses sold for 300, 340, and 320 thousand dollars. What price does the model predict, in thousands of dollars?
  options:
    - "300"
    - "320"
    - "340"
    - "960"
  ordered: true
  answer: B
  explain: |
    For regression, k-nearest neighbors averages the target values of the k nearest examples: (300 + 340 + 320) / 3 = 320.
  why:
    A: "300 uses only the cheapest neighbor."
    C: "340 uses only the most expensive neighbor."
    D: "960 is the sum of the three prices; the model averages them."
  verify: "(300 + 340 + 320) / 3"

- id: pt1-ml-06
  test: 1
  skill: neurons
  objective: ML3
  tier: champion
  type: calculation
  stem: |
    A small network predicts a house's price from 4 measurements. It is fully connected, with one hidden layer of 5 neurons and 1 output neuron. Counting weights and biases, how many parameters does it have?
  options:
    - "10"
    - "25"
    - "30"
    - "31"
  ordered: true
  answer: D
  explain: |
    Each hidden neuron has 4 weights and a bias: 5 × (4 + 1) = 25. The output neuron has 5 weights and a bias: 6. In total, 25 + 6 = 31.
  why:
    A: "10 counts the neurons, not the weights and biases."
    B: "25 counts the weights, 20 + 5, but leaves out the 6 biases."
    C: "30 leaves out the output neuron's bias."
  verify: "4 * 5 + 5 + 5 * 1 + 1"

- id: pt1-ml-07
  test: 1
  skill: rl-basics
  objective: ML4
  tier: core
  type: scenario
  stem: |
    A delivery agent usually takes the route that has worked best so far, but sometimes tries a different route to see whether it is faster. What is the agent doing when it tries the different route?
  options:
    - "Exploitation"
    - "Exploration"
    - "Overfitting"
    - "Backpropagation"
  answer: B
  explain: |
    Trying an action whose value is uncertain, to learn whether it is better, is exploration. Taking the best-known action is exploitation, and a good agent balances the two.
  why:
    A: "Exploitation is taking the best-known route, which the agent sets aside here."
    C: "Overfitting is when a model learns its training data too closely."
    D: "Backpropagation computes gradients in a neural network."

- id: pt1-ml-08
  test: 1
  skill: other-paradigms
  objective: ML4
  tier: competitive
  type: scenario
  stem: |
    A fraud model updates itself every hour with the newest confirmed fraud cases, instead of being retrained from scratch on all the data. What is this approach called?
  options:
    - "Batch learning"
    - "Transfer learning"
    - "Online learning"
    - "Semi-supervised learning"
  answer: C
  explain: |
    Online learning updates a model a little at a time as new data arrive, so it keeps up with changing patterns. Batch learning retrains on the full dataset at intervals.
  why:
    A: "Batch learning retrains from scratch on all the data collected so far."
    B: "Transfer learning reuses a model trained for one task on another task."
    D: "Semi-supervised learning mixes a few labeled examples with many unlabeled ones."

- id: pt1-ml-09
  test: 1
  skill: choose-approach
  objective: ML5
  tier: core
  type: scenario
  stem: |
    A utility wants to predict tomorrow's electricity use, in megawatt-hours, from weather forecasts and years of past usage records. Which approach fits?
  options:
    - "Unsupervised clustering"
    - "Supervised classification"
    - "Reinforcement learning"
    - "Supervised regression"
  answer: D
  explain: |
    The past records pair conditions with known usage, so the problem is supervised, and the output is a number, so it is regression.
  why:
    A: "Clustering groups unlabeled data; here there is a known numeric target."
    B: "Classification predicts a category, but usage in megawatt-hours is a number."
    C: "No agent learns from rewards; the model learns from labeled past records."

- id: pt1-ml-10
  test: 1
  skill: deep-learning
  objective: ML6
  tier: champion
  type: concept
  stem: |
    Neural networks existed for decades. Why did deep learning take off in the 2010s rather than earlier?
  options:
    - "Large datasets and powerful parallel hardware became available"
    - "Neural networks were first invented in the 2010s"
    - "Activation functions had not existed before then"
    - "Deep networks stopped needing any data"
  answer: A
  explain: |
    Deep networks need very large amounts of data and computing power. Both arrived in the 2010s, with huge labeled datasets such as ImageNet and GPUs that run many calculations in parallel, and AlexNet's 2012 result showed what they made possible.
  why:
    B: "Neural networks date back decades; Rosenblatt's perceptron is from 1958."
    C: "Activation functions were used long before the 2010s."
    D: "Deep networks need more data than classical methods, not less."

# ================================================================ Test 2
- id: pt2-ml-01
  test: 2
  skill: ml-vocab
  objective: ML1
  tier: core
  type: scenario
  stem: |
    A model predicts a car's fuel efficiency from its weight, engine size, and age. Which of these is a feature?
  options:
    - "The car's weight"
    - "The car's fuel efficiency"
    - "The trained model"
    - "The learning rate"
  answer: A
  explain: |
    Features are the input variables a model uses to make a prediction: weight, engine size, and age. Fuel efficiency is the label the model predicts.
  why:
    B: "Fuel efficiency is the label, the value being predicted."
    C: "The trained model is what results from learning, not an input variable."
    D: "The learning rate is a hyperparameter of training, not an input variable."

- id: pt2-ml-02
  test: 2
  skill: data-splits
  objective: ML2
  tier: competitive
  type: concept
  stem: |
    A team tries 50 combinations of hyperparameters, keeps the one with the best validation accuracy, and reports that validation accuracy as the model's expected performance. Why is the reported number likely too optimistic?
  options:
    - "Validation sets are always larger than test sets"
    - "The validation set picked the model, so its score is no longer unbiased"
    - "Accuracy cannot be measured on validation data"
    - "The model never saw the validation data, so the score is too low"
  answer: B
  explain: |
    Choosing the best of 50 settings by validation score favors settings that happened to suit that particular set. A separate test set, untouched until the end, gives the honest estimate of performance on new data.
  why:
    A: "Size is not the issue, and validation sets are usually no bigger than test sets."
    C: "Accuracy can be measured on any labeled set; the problem is that this set guided the choice."
    D: "The score tends to be too high, not too low, because the model was chosen to do well on it."

- id: pt2-ml-03
  test: 2
  skill: fit-tradeoff
  objective: ML2
  tier: competitive
  type: scenario
  stem: |
    A model's validation error is far above its training error. Which change is least likely to help?
  options:
    - "Collecting more training data"
    - "Adding regularization"
    - "Adding many more features and layers"
    - "Simplifying or pruning the model"
  answer: C
  explain: |
    A large gap between training and validation error signals overfitting, or high variance. More data, regularization, and simpler models all reduce variance; adding features and layers makes the model more flexible and usually widens the gap.
  why:
    A: "More data makes it harder for the model to memorize quirks, which narrows the gap."
    B: "Regularization penalizes complexity, which reduces overfitting."
    D: "A simpler model has less room to fit noise."

- id: pt2-ml-04
  test: 2
  skill: loss-gd
  objective: ML3
  tier: core
  type: calculation
  stem: |
    A speech model trains on 2,400 audio clips using mini-batches of 32 clips. How many weight updates happen in one epoch?
  options:
    - "32"
    - "75"
    - "76"
    - "2,400"
  ordered: true
  answer: B
  explain: |
    The weights are updated once per batch, and one epoch passes through all 2,400 examples in batches of 32: 2,400 / 32 = 75 updates.
  why:
    A: "32 is the batch size, not the number of batches."
    C: "2,400 divides evenly by 32, so there is no extra, smaller batch to add."
    D: "2,400 updates would mean one update per example, which is stochastic gradient descent."
  verify: "2400 / 32"

- id: pt2-ml-05
  test: 2
  skill: regularization
  objective: ML3
  tier: competitive
  type: concept
  stem: |
    How does L2 regularization (ridge) usually affect a model's weights, compared with L1?
  options:
    - "It sets many weights exactly to zero"
    - "It makes the largest weights even larger"
    - "It leaves every weight unchanged"
    - "It shrinks weights toward zero but rarely to exactly zero"
  answer: D
  explain: |
    L2 penalizes the squared weights, which shrinks all of them toward zero but seldom makes any exactly zero. L1, which penalizes absolute values, is the one that can zero out weights and so selects features.
  why:
    A: "Setting many weights exactly to zero is the behavior of L1 (lasso)."
    B: "Regularization penalizes large weights; it does not enlarge them."
    C: "The penalty changes the weights; only a strength of 0 would leave them alone."

- id: pt2-ml-06
  test: 2
  skill: activations
  objective: ML3
  tier: competitive
  type: calculation
  stem: |
    An image classifier's softmax layer gives the scores 2 for cat, 0 for dog, and 0 for rabbit. Using $$e^2 \approx 7.39$$, what probability does it assign to cat, to the nearest hundredth?
  options:
    - "0.33"
    - "0.79"
    - "0.88"
    - "1"
  ordered: true
  answer: B
  explain: |
    Softmax divides each score's exponential by the sum of all of them: e to the 2 is about 7.39, and e to the 0 is 1 for each other class. The first class gets 7.39 / (7.39 + 1 + 1) = 7.39 / 9.39, about 0.79.
  why:
    A: "0.33 splits the probability equally, ignoring the scores."
    C: "0.88 is the sigmoid of 2, which treats the first class on its own instead of against both others."
    D: "Softmax gives every class some probability, so none reaches exactly 1."
  verify: "math.exp(2) / (math.exp(2) + 2 * math.exp(0))"

- id: pt2-ml-07
  test: 2
  skill: supervised
  objective: ML4
  tier: core
  type: scenario
  stem: |
    A model reads each customer email and labels it as billing, shipping, returns, or technical, learning from thousands of emails already sorted by staff. What kind of task is this?
  options:
    - "Binary classification"
    - "Numeric regression"
    - "Multiclass classification"
    - "Unsupervised clustering"
  answer: C
  explain: |
    The model learns from labeled examples and assigns each email one of four categories, so it is supervised multiclass classification.
  why:
    A: "Binary classification has exactly two possible classes; here there are four."
    B: "Regression predicts a number, not a category."
    D: "Clustering finds groups without labels, but these emails come labeled."

- id: pt2-ml-08
  test: 2
  skill: rl-details
  objective: ML4
  tier: champion
  type: calculation
  stem: |
    A delivery robot's Q-value for turning left at a certain corner is 5. It turns left, receives a reward of 3, and reaches a spot whose best Q-value is 10. With a learning rate of 0.2 and a discount factor of 0.8, what is its new Q-value for turning left at that corner?
  options:
    - "6.2"
    - "6.6"
    - "7.2"
    - "11"
  ordered: true
  answer: A
  explain: |
    The new estimate is the reward plus the discounted best next value: 3 + 0.8 × 10 = 11. The update moves Q a fifth of the way toward it: 5 + 0.2 × (11 minus 5) = 5 + 1.2 = 6.2.
  why:
    B: "6.6 leaves out the discount factor, using 3 + 10 = 13 as the estimate."
    C: "7.2 adds 0.2 × 11 to the old value instead of 0.2 × (11 minus 5)."
    D: "11 is the new estimate itself; the learning rate moves Q only part of the way toward it."
  verify: "5 + 0.2 * (3 + 0.8 * 10 - 5)"

- id: pt2-ml-09
  test: 2
  skill: choose-approach
  objective: ML5
  tier: competitive
  type: scenario
  stem: |
    A hospital wants to predict which patients will be readmitted, using 30,000 labeled past stays. Doctors must be able to follow each prediction as a short chain of yes-or-no questions. Which choice fits best?
  options:
    - "A deep neural network with many layers"
    - "k-means clustering of the patients"
    - "A reinforcement learning agent"
    - "A shallow decision tree"
  answer: D
  explain: |
    Labeled outcomes make this supervised classification, and the need to trace each prediction points to an interpretable model. A shallow decision tree turns every prediction into a short series of readable questions.
  why:
    A: "A deep network may be accurate, but its predictions cannot be read as simple rules."
    B: "Clustering ignores the labeled outcomes and predicts nothing."
    C: "No agent acts and learns from rewards; this is prediction from labeled history."

- id: pt2-ml-10
  test: 2
  skill: deep-architectures
  objective: ML6
  tier: champion
  type: calculation
  stem: |
    A 3 × 3 convolution kernel scans a 100 × 100 grayscale image. A fully connected layer would instead link each of the 10,000 input pixels to each of 10,000 output values. Ignoring biases, how many weights does each approach learn?
  options:
    - "9 for the kernel and 100,000,000 for the fully connected layer"
    - "9 for the kernel and 10,000 for the fully connected layer"
    - "90,000 for the kernel and 10,000 for the fully connected layer"
    - "10,000 for the kernel and 10,000 for the fully connected layer"
  answer: A
  explain: |
    The kernel's 9 weights are reused at every position in the image, so the layer learns only 9. A fully connected layer needs one weight per input-output pair: 10,000 × 10,000 = 100 million. Weight sharing is why convolutional networks suit images.
  why:
    B: "Linking every input to every output takes 10,000 × 10,000 weights, not 10,000."
    C: "The kernel's 9 weights are shared across all positions, not copied for each one."
    D: "A 3 × 3 kernel has just 9 weights, however large the image is."
  verify: |
    ans = f"{3 * 3} for the kernel and {10000 * 10000:,} for the fully connected layer"

# ================================================================ Test 3
- id: pt3-ml-01
  test: 3
  skill: ml-nature
  objective: ML1
  tier: competitive
  type: scenario
  stem: |
    One team writes rules by hand to compute shipping cost from package weight and distance. Another team trains a model on past shipments to predict which packages will arrive late. Which is machine learning, and why?
  options:
    - "Both, since both use data about packages"
    - "The shipping-cost rules, since they use numbers"
    - "Neither, since neither uses a neural network"
    - "The lateness model, since it learns its rules from data"
  answer: D
  explain: |
    Machine learning lets the computer learn rules from examples. The lateness model learns patterns from past shipments, while the cost calculator follows rules that people wrote, which is traditional programming.
  why:
    A: "Using data is not enough; the hand-written cost rules are not learned from examples."
    B: "Using numbers does not make a program learn; its rules were written by people."
    C: "Machine learning includes many methods besides neural networks, such as decision trees."

- id: pt3-ml-02
  test: 3
  skill: data-splits
  objective: ML2
  tier: champion
  type: scenario
  stem: |
    A model will forecast next month's sales from five years of monthly sales. How should the data be split for training and testing?
  options:
    - "Train on earlier months and test on the most recent ones"
    - "Shuffle the months, then split them at random"
    - "Train and test on the same months"
    - "Test on the earliest months and train on the rest"
  answer: A
  explain: |
    A forecast must predict the future from the past, so the test months should come after the training months. A random split would let the model learn from months later than the ones it is tested on, a form of leakage that makes the test score too optimistic.
  why:
    B: "Shuffling puts later months in training, so the model peeks at the future."
    C: "Testing on the training months hides overfitting and says nothing about the future."
    D: "This trains on the future to predict the past, the reverse of real forecasting."

- id: pt3-ml-03
  test: 3
  skill: cross-validation
  objective: ML2
  tier: competitive
  type: calculation
  stem: |
    A churn model is evaluated with 10-fold cross-validation on 2,000 customer records. How many records does each of the 10 models train on?
  options:
    - "200"
    - "1,800"
    - "2,000"
    - "20,000"
  ordered: true
  answer: B
  explain: |
    Each fold holds 2,000 / 10 = 200 examples. Every model trains on the other 9 folds: 9 × 200 = 1,800 examples.
  why:
    A: "200 is the size of the validation fold, not the training data."
    C: "2,000 includes the fold held out for validation."
    D: "20,000 multiplies the data by the number of folds."
  verify: "2000 - 2000 / 10"

- id: pt3-ml-04
  test: 3
  skill: linear-models
  objective: ML3
  tier: core
  type: calculation
  stem: |
    A model predicts a seedling's weekly growth, in millimeters, as $$\hat{y} = 3x_1 + 2x_2 - 4$$, where $$x_1$$ is hours of extra light per day and $$x_2$$ is liters of water per week. What does it predict for 2 hours of light and 5 liters of water?
  options:
    - "8"
    - "12"
    - "16"
    - "20"
  ordered: true
  answer: B
  explain: |
    Substitute the inputs: 3 × 2 + 2 × 5 minus 4 = 6 + 10 minus 4 = 12.
  why:
    A: "8 forgets to multiply x1 by its weight of 3: 2 + 10 minus 4."
    C: "16 leaves out the bias of negative 4."
    D: "20 adds 4 instead of subtracting it."
  verify: "3 * 2 + 2 * 5 - 4"

- id: pt3-ml-05
  test: 3
  skill: decision-trees
  objective: ML3
  tier: champion
  type: calculation
  stem: |
    A parent node holds 8 "yes" and 8 "no" examples, so its Gini impurity is 0.5. A split sends 8 yes and 2 no to the left child (Gini 0.32) and 0 yes and 6 no to the right child (Gini 0). By how much does the split reduce Gini impurity?
  options:
    - "0.18"
    - "0.2"
    - "0.3"
    - "0.5"
  ordered: true
  answer: C
  explain: |
    Weight each child's Gini by its share of the 16 examples: (10/16) × 0.32 + (6/16) × 0 = 0.2. The reduction is the parent's impurity minus that: 0.5 minus 0.2 = 0.3.
  why:
    A: "0.18 subtracts the left child's Gini without weighting it by its share of the examples."
    B: "0.2 is the weighted impurity of the children, not the reduction."
    D: "0.5 is the parent's impurity before the split."
  verify: "0.5 - (10 / 16 * (1 - (0.8 ** 2 + 0.2 ** 2)) + 6 / 16 * 0)"

- id: pt3-ml-06
  test: 3
  skill: ensembles
  objective: ML3
  tier: competitive
  type: concept
  stem: |
    Which ensemble method trains its models independently of one another, so they can be trained at the same time?
  options:
    - "Bagging"
    - "Boosting"
    - "Gradient boosting"
    - "Both bagging and boosting"
  answer: A
  explain: |
    Bagging trains each model on its own bootstrap sample, with no model depending on another, so all of them can train in parallel. Boosting trains models one after another, each focusing on the errors of those before it.
  why:
    B: "Boosting is sequential: each model depends on the errors of the previous ones."
    C: "Gradient boosting is a kind of boosting, so it is sequential too."
    D: "Only bagging trains its models independently; boosting must go in order."

- id: pt3-ml-07
  test: 3
  skill: unsupervised
  objective: ML4
  tier: core
  type: recall
  stem: |
    Which of these algorithms is used for unsupervised learning?
  options:
    - "Logistic regression"
    - "Linear regression"
    - "k-means clustering"
    - "Naive Bayes"
  answer: C
  explain: |
    k-means finds groups in data that have no labels, which makes it unsupervised. The other three all learn from labeled examples.
  why:
    A: "Logistic regression learns from labeled examples to predict a class."
    B: "Linear regression learns from labeled examples to predict a number."
    D: "Naive Bayes learns from labeled examples to classify, as in spam filtering."

- id: pt3-ml-08
  test: 3
  skill: rl-basics
  objective: ML4
  tier: competitive
  type: concept
  stem: |
    In reinforcement learning, what does an agent try to maximize?
  options:
    - "The reward on the very next step only"
    - "The number of actions it takes"
    - "The accuracy of its labels"
    - "Its total reward over time"
  answer: D
  explain: |
    An RL agent aims to maximize its cumulative reward, the total over time, often discounted. That is why it may accept a small loss now for a bigger reward later.
  why:
    A: "Chasing only the next reward can miss larger rewards later; the goal is the total over time."
    B: "Taking more actions is not a goal in itself."
    C: "RL learns from rewards, not from labels."

