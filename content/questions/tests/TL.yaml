- id: pt1-tl-08
  test: 1
  skill: pandas-reshape
  objective: TL3
  tier: competitive
  type: code
  stem: |
    The orders DataFrame has a cid column holding 1, 2, 2, and 5. The customers DataFrame has a cid column holding 1, 2, and 3. How many rows does this line produce?

    ```python
    orders.merge(customers, on="cid", how="inner")
    ```
  options:
    - "2"
    - "3"
    - "4"
    - "5"
  ordered: true
  answer: B
  explain: |
    An inner merge keeps only rows whose key appears in both DataFrames. The order with cid 1 matches once and the two orders with cid 2 each match once, giving 3 rows; the order with cid 5 has no customer and is dropped.
  why:
    A: "2 counts the distinct matching IDs, but each of the two cid 2 orders produces its own row."
    C: "4 keeps the unmatched order with cid 5, which is what a left merge would do."
    D: "5 is the outer merge, which also keeps the order for cid 5 and the customer with cid 3."
  verify: |
    orders = pd.DataFrame({"cid": [1, 2, 2, 5]})
    customers = pd.DataFrame({"cid": [1, 2, 3]})
    ans = len(orders.merge(customers, on="cid", how="inner"))

