- id: pt3-tl-01
  test: 3
  skill: sql-null
  objective: TL1
  tier: competitive
  type: sql
  stem: |
    The bills table holds three rows: (1, amount 40, tip 6), (2, amount 25, tip NULL), and (3, amount 60, tip 9). What does this query return?

    ```sql
    SELECT SUM(amount + COALESCE(tip, 0)) FROM bills;
    ```
  options:
    - "15"
    - "115"
    - "125"
    - "140"
  ordered: true
  answer: D
  explain: |
    COALESCE(tip, 0) turns the missing tip into 0, so the second row contributes 25 + 0. The sum is (40 + 6) + (25 + 0) + (60 + 9) = 140.
  why:
    A: "15 adds up only the tips."
    B: "115 drops the second row: without COALESCE, 25 + NULL is NULL, and SUM skips it."
    C: "125 adds the amounts but leaves out the tips."
  verify: |
    db = make_db("CREATE TABLE bills(id INT, amount INT, tip INT); INSERT INTO bills VALUES (1,40,6),(2,25,NULL),(3,60,9);")
    ans = scalar(db, "SELECT SUM(amount + COALESCE(tip, 0)) FROM bills")

- id: pt3-tl-02
  test: 3
  skill: sql-joins
  objective: TL1
  tier: core
  type: sql
  stem: |
    A report must list every product, including products that have never been ordered, along with any orders for each. Which join fits?
  options:
    - "`products INNER JOIN orders`"
    - "`products LEFT JOIN orders`"
    - "`products CROSS JOIN orders`"
    - "`orders LEFT JOIN products`"
  answer: B
  explain: |
    A left join keeps every row of the left table, here products, and fills in NULLs where a product has no orders. Products that were never ordered still appear.
  why:
