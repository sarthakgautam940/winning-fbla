- id: pt2-tl-01
  test: 2
  skill: sql-select
  objective: TL1
  tier: competitive
  type: sql
  stem: |
    The visits table holds these rows. How many rows does the query return?

    | city | day |
    |---|---|
    | Reno | Mon |
    | Reno | Mon |
    | Reno | Tue |
    | Tulsa | Mon |
    | Tulsa | Mon |
    | Omaha | Tue |

    ```sql
    SELECT DISTINCT city, day FROM visits;
    ```
  options:
    - "2"
    - "3"
    - "4"
    - "6"
  ordered: true
  answer: C
  explain: |
    DISTINCT removes rows that repeat the whole combination of selected columns. The distinct pairs are Reno-Mon, Reno-Tue, Tulsa-Mon, and Omaha-Tue, so 4 rows remain.
  why:
    A: "2 counts the distinct days alone."
    B: "3 counts the distinct cities alone; DISTINCT applies to the city and day together."
    D: "6 keeps every row, as if DISTINCT were missing."
  verify: |
    db = make_db("CREATE TABLE visits(city TEXT, day TEXT); INSERT INTO visits VALUES ('Reno','Mon'),('Reno','Mon'),('Reno','Tue'),('Tulsa','Mon'),('Tulsa','Mon'),('Omaha','Tue');")
    ans = rows(db, "SELECT DISTINCT city, day FROM visits")

