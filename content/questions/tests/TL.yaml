- id: pt1-tl-10
  test: 1
  skill: keys
  objective: TL5
  tier: champion
  type: scenario
  stem: |
    In the school database, students.club_id is a foreign key to clubs.club_id, and three students belong to club 1, Robotics. The foreign key is enforced with no cascading rule. What happens when someone runs `DELETE FROM clubs WHERE club_id = 1;`?
  options:
    - "The delete is rejected, since students still reference club 1"
    - "Club 1 is deleted, and its three students are deleted too"
    - "Club 1 is deleted, and its students' club_id becomes NULL"
    - "Club 1 is deleted, and its students keep club_id 1"
  answer: A
  explain: |
    Referential integrity forbids a foreign key value that points to a missing row. Deleting club 1 would leave three students pointing at nothing, so the database rejects the delete. Deleting or clearing the students instead happens only if the foreign key was declared with a rule for that.
  why:
    B: "Deleting the students as well needs a cascading delete rule, which this key does not have."
    C: "Setting club_id to NULL needs a set-null rule, which this key does not have."
    D: "Leaving students pointing at a deleted club is exactly what referential integrity prevents."

