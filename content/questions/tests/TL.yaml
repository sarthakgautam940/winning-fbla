  stem: |
    An order_lines table has the composite primary key (order_id, product_id) and the columns quantity and product_name. Which change best fixes its normalization problem?
  options:
    - "Move product_name into a products table keyed by product_id"
    - "Add an index on the product_name column"
    - "Make quantity part of the primary key"
    - "Store every product_name in uppercase"
  answer: A
  explain: |
    product_name depends only on product_id, which is just part of the composite key: a partial dependency that breaks second normal form. Moving it into a products table, where product_id is the whole key, stores each name once.
  why:
    B: "An index speeds up searches but still repeats each name on every order line."
    C: "Adding quantity to the key does not stop product_name from depending on product_id alone."
    D: "Changing the format does not remove the repetition."
