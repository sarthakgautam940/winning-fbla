- id: pt2-tl-04
  test: 2
  skill: sql-window
  objective: TL1
  tier: champion
  type: sql
  stem: |
    The scores table holds Ana (class A, 90), Ben (class A, 85), Cara (class A, 95), Dan (class B, 70), and Eve (class B, 88). What value of rn does Eve get?

    ```sql
    SELECT student,
           ROW_NUMBER() OVER (PARTITION BY class ORDER BY score DESC) AS rn
    FROM scores;
    ```
  options:
    - "0"
    - "1"
    - "2"
    - "3"
  ordered: true
  answer: B
  explain: |
    PARTITION BY restarts the numbering in each class. In class B, sorted from highest score to lowest, Eve (88) comes before Dan (70), so Eve's rn is 1.
  why:
    A: "ROW_NUMBER starts counting at 1, not 0."
    C: "2 sorts from lowest to highest, but ORDER BY score DESC puts the highest first."
    D: "3 ignores the partition and numbers all five students together: Cara, Ana, then Eve."
  verify: |
    db = make_db("CREATE TABLE scores(student TEXT, class TEXT, score INT); INSERT INTO scores VALUES ('Ana','A',90),('Ben','A',85),('Cara','A',95),('Dan','B',70),('Eve','B',88);")
    ans = dict(sql(db, "SELECT student, ROW_NUMBER() OVER (PARTITION BY class ORDER BY score DESC) FROM scores"))["Eve"]

