- id: pt1-tl-01
  test: 1
  skill: sql-where
  objective: TL1
  tier: competitive
  type: sql
  stem: |
    The staff table holds these rows. Which names does the query return?

    | name | dept | salary |
    |---|---|---|
    | Ana | Sales | 52000 |
    | Ben | IT | 61000 |
    | Cara | Sales | 48000 |
    | Dan | HR | 55000 |
    | Eve | IT | 47000 |

    ```sql
    SELECT name FROM staff
    WHERE dept = 'Sales' OR dept = 'IT' AND salary > 50000;
    ```
  options:
    - "Ana, Ben, and Cara"
    - "Ana and Ben"
    - "Ben only"
    - "Ana, Ben, Cara, and Eve"
  answer: A
  explain: |
    AND is evaluated before OR, so the condition reads dept = 'Sales' OR (dept = 'IT' AND salary > 50000). Every Sales employee qualifies (Ana and Cara), plus the IT employees earning over 50,000 (Ben). Parentheses around the two dept tests would change the result.
  why:
    B: "This reads the condition as (Sales OR IT) AND salary > 50000, but without parentheses AND binds first."
    C: "This keeps only the IT test; the OR also admits every Sales employee."
    D: "Eve is in IT but earns 47,000, so Eve fails the AND."
  verify: |
    db = make_db("CREATE TABLE staff(name TEXT, dept TEXT, salary INT); INSERT INTO staff VALUES ('Ana','Sales',52000),('Ben','IT',61000),('Cara','Sales',48000),('Dan','HR',55000),('Eve','IT',47000);")
    n = [r[0] for r in sql(db, "SELECT name FROM staff WHERE dept = 'Sales' OR dept = 'IT' AND salary > 50000 ORDER BY name")]
    ans = ", ".join(n[:-1]) + ", and " + n[-1]

- id: pt1-tl-02
  test: 1
  skill: sql-null
  objective: TL1
  tier: core
  type: sql
  stem: |
    The survey table holds these rows. What does the query return?

    | id | age | phone |
    |---|---|---|
    | 1 | 34 | 555-0101 |
    | 2 | NULL | 555-0102 |
    | 3 | 27 | NULL |
    | 4 | 45 | 555-0104 |
    | 5 | 31 | NULL |

    ```sql
    SELECT COUNT(*), COUNT(phone) FROM survey;
    ```
  options:
    - "5 and 5"
    - "5 and 3"
    - "3 and 3"
    - "4 and 3"
  answer: B
  explain: |
    COUNT(*) counts rows, whatever they hold, so it returns 5. COUNT(phone) counts only the non-NULL phone values, and two are NULL, so it returns 3.
  why:
    A: "COUNT(phone) skips the two NULL phone values."
    C: "COUNT(*) counts every row, including rows that contain NULLs."
    D: "4 is the number of known ages; COUNT(*) does not skip rows that contain NULLs."
  verify: |
    db = make_db("CREATE TABLE survey(id INT, age INT, phone TEXT); INSERT INTO survey VALUES (1,34,'555-0101'),(2,NULL,'555-0102'),(3,27,NULL),(4,45,'555-0104'),(5,31,NULL);")
    a, b = sql(db, "SELECT COUNT(*), COUNT(phone) FROM survey")[0]
    ans = f"{a} and {b}"

- id: pt1-tl-03
  test: 1
  skill: sql-aggregate
  objective: TL1
  tier: core
  type: sql
  stem: |
    The sales table holds these rows. What total does the query show for North?

    | region | month | amount |
    |---|---|---|
    | East | Jan | 100 |
    | West | Jan | 80 |
    | East | Feb | 120 |
    | North | Feb | 60 |
    | West | Feb | 90 |
    | North | Mar | 70 |

    ```sql
    SELECT region, SUM(amount) AS total
    FROM sales
    GROUP BY region;
    ```
  options:
    - "60"
    - "70"
    - "130"
    - "520"
  ordered: true
  answer: C
  explain: |
    GROUP BY gives each region its own row, and SUM adds the amounts within each group. North has two rows, 60 and 70, so its total is 130.
  why:
    A: "60 is North's February amount alone."
    B: "70 is North's March amount alone."
    D: "520 is the total for every region together; GROUP BY sums each region separately."
  verify: |
    db = make_db("CREATE TABLE sales(region TEXT, month TEXT, amount INT); INSERT INTO sales VALUES ('East','Jan',100),('West','Jan',80),('East','Feb',120),('North','Feb',60),('West','Feb',90),('North','Mar',70);")
    ans = dict(sql(db, "SELECT region, SUM(amount) FROM sales GROUP BY region"))["North"]

- id: pt1-tl-04
  test: 1
  skill: sql-joins
  objective: TL1
  tier: champion
  type: sql
  stem: |
    The authors table has three rows: 1 Ito, 2 Ruiz, and 3 Shah. The books table has four rows, whose author_id values are 1, 1, 1, and 2. How many rows does this query return?

    ```sql
    SELECT a.name, b.book_id
    FROM authors a
    LEFT JOIN books b ON a.author_id = b.author_id;
    ```
  options:
    - "3"
    - "4"
    - "5"
    - "12"
  ordered: true
  answer: C
  explain: |
    A left join keeps every author. Ito matches three books (3 rows), Ruiz matches one (1 row), and Shah matches none but still appears once with a NULL book_id (1 row): 3 + 1 + 1 = 5.
  why:
    A: "3 gives each author one row, but Ito's three books each produce their own row."
    B: "4 counts only the matched pairs, which is the inner join; the left join also keeps Shah."
    D: "12 pairs every author with every book, which is a cross join."
  verify: |
    db = make_db("CREATE TABLE authors(author_id INT, name TEXT); INSERT INTO authors VALUES (1,'Ito'),(2,'Ruiz'),(3,'Shah'); CREATE TABLE books(book_id INT, author_id INT); INSERT INTO books VALUES (10,1),(11,1),(12,1),(13,2);")
    ans = rows(db, "SELECT a.name, b.book_id FROM authors a LEFT JOIN books b ON a.author_id = b.author_id")

