    B: "Explaining a concept is a language task; no exact computation is needed."
    D: "Summarizing is a language task the model handles well."

# ================================================================ Test 5
- id: pt5-ai-01
  test: 5
  skill: genai-nature
  objective: AI1
  tier: champion
  type: concept
  stem: |
    Generative models are trained on huge datasets with almost no human labeling. How is that possible?
  options:
    - "The data supply their own targets, such as the next token"
    - "People label every example during pretraining"
    - "The models copy examples instead of learning patterns"
    - "They train only on synthetic data that comes labeled"
  answer: A
  explain: |
    The training signal comes from the data itself: a language model predicts the next token, a diffusion model predicts the noise that was added, and an autoencoder rebuilds its own input. No person has to label anything.
  why:
    B: "Labeling billions of examples by hand would be impossible; the targets come from the data."
    C: "Generative models learn patterns and create new combinations rather than storing copies."
    D: "They train mostly on real data, such as text and images, not on labeled synthetic data."

- id: pt5-ai-02
  test: 5
  skill: genai-models
  objective: AI1
  tier: competitive
  type: concept
  stem: |
    A model writes one token at a time, choosing each from probabilities based on all the tokens before it. Which generative model family is this?
  options:
    - "Generative adversarial network"
    - "Variational autoencoder"
    - "Diffusion model"
    - "Autoregressive transformer"
  answer: D
  explain: |
    Autoregressive transformers, such as GPT models, predict the next token, append it, and repeat, so each choice depends on everything generated so far.
  why:
    A: "A GAN's generator produces a whole sample in one pass from random noise."
    B: "A VAE decodes a point from its latent space into a whole sample."
    C: "A diffusion model refines a whole sample by removing noise over many steps."

- id: pt5-ai-03
  test: 5
  skill: genai-limits
  objective: AI2
  tier: champion
  type: concept
  stem: |
    Why does a popular chatbot keep using large amounts of electricity even after its training is finished?
  options:
    - "Each conversation retrains its weights"
    - "Its knowledge cutoff must be refreshed every hour"
    - "Serving millions of queries runs the large model each time"
    - "Storing its finished weights takes most of the energy"
  answer: C
  explain: |
    Training is one large cost, but serving the model is another: every answer runs a huge neural network on data-center hardware, and a popular service answers millions of requests. Both training and serving consume large amounts of electricity.
  why:
    A: "Conversations do not change the model's weights; each one only runs the finished model."
    B: "The knowledge cutoff changes only when the model is retrained, not hourly."
    D: "Storing the weights takes little energy compared with running the model for every query."

- id: pt5-ai-04
  test: 5
  skill: llm-capabilities
  objective: AI2
  tier: competitive
  type: scenario
  stem: |
    An LLM summarizes a 30-page report well but leaves out a key warning from page 27. What is the best lesson?
  options:
    - "LLMs cannot summarize long documents at all"
    - "Summaries can drop key details, so check them against the source"
    - "The model was refusing to share the warning"
    - "A polite prompt guarantees a complete summary"
  answer: B
  explain: |
    Summarizing is a strength of LLMs, but a summary compresses, and important details can be dropped or blurred. For anything that matters, check the summary against the source.
  why:
    A: "The summary was mostly good; the issue is a missing detail, not an inability to summarize."
    C: "Nothing suggests a refusal; summaries simply leave things out."
    D: "Politeness does not make a summary complete; checking the source does."

- id: pt5-ai-05
  test: 5
  skill: genai-uses
  objective: AI3
  tier: champion
  type: scenario
  stem: |
    A hospital trains a model on synthetic X-rays made by a generator that learned only from adult X-rays. What risk does this create?
  options:
    - "The synthetic set inherits the gap, so the model may fail on children"
    - "Synthetic images always contain patients' real names"
    - "Synthetic data cannot be used to train any model"
    - "The model will do better on children than on adults"
  answer: A
  explain: |
    Synthetic data reflect what the generator learned. A generator trained only on adults cannot produce realistic child X-rays, so a model trained on its output may perform poorly on children.
  why:
    B: "Synthetic images are made from learned patterns; they do not carry patients' names."
    C: "Synthetic data are widely used for training; the risk is the gaps they inherit."
    D: "With no child X-rays in the source, children are where the model is weakest."

- id: pt5-ai-06
  test: 5
  skill: ai-history
  objective: AI4
  tier: champion
  type: concept
  stem: |
    What most separated AlphaGo's 2016 Go victory from Deep Blue's 1997 chess victory?
  options:
    - "AlphaGo followed only fixed, hand-written rules"
    - "Deep Blue learned by playing millions of games against itself"
    - "AlphaGo's networks learned from expert games and self-play"
    - "Deep Blue used a neural network trained on human games"
  answer: C
  explain: |
    AlphaGo's neural networks were trained by learning from human expert games and then by reinforcement learning from games it played against itself. Deep Blue followed fixed programming with no learning, the standard example of a reactive machine.
  why:
    A: "Fixed, hand-written programming describes Deep Blue, not AlphaGo."
    B: "Learning through self-play describes AlphaGo; Deep Blue did not learn from experience."
    D: "Deep Blue had no trained neural network; learned networks were AlphaGo's advance."

