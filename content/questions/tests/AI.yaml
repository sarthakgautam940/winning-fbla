  objective: AI2
  tier: competitive
  type: scenario
  stem: |
    Which task is an LLM likely to do well without any tools?
  options:
    - "Report the current price of a stock"
    - "Multiply two nine-digit numbers exactly"
    - "Translate a short email from English into Spanish"
    - "List each word used exactly twice in a 10,000-word file"
  answer: C
  explain: |
