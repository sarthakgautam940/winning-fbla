  type: scenario
  stem: |
    Dozens of apps are built by adapting the same foundation model, and a bias in that model shows up in all of them. What best explains this?
  options:
    - "Each app inherits the patterns, flaws included, of the shared model"
    - "Each app was trained from scratch on the same biased data"
    - "Bias spreads from app to app over the internet"
    - "Adapting a model always creates new bias"
  answer: A
