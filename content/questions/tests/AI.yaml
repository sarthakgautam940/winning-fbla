- id: pt2-ai-06
  test: 2
  skill: nlp-speech
  objective: AI4
  tier: competitive
  type: calculation
  stem: |
    An n-gram is a sequence of n neighboring words. How many trigrams (3-grams) does the sentence "data science helps teams make better decisions" contain?
  options:
    - "4"
    - "5"
    - "6"
    - "7"
  ordered: true
  answer: B
  explain: |
    The sentence has 7 words, and a window of 3 words can start at any of the first 5 positions. In general, n words give n minus 2 trigrams: 7 minus 2 = 5.
  why:
    A: "4 subtracts 3 from the word count; a window of 3 fits n minus 2 times."
    C: "6 is the number of bigrams, n minus 1."
    D: "7 counts the words, not the trigrams."
  verify: |
    w = "data science helps teams make better decisions".split()
    ans = len(w) - 2

