- id: pt1-ai-07
  test: 1
  skill: computer-vision
  objective: AI4
  tier: core
  type: scenario
  stem: |
    A recycling plant photographs one item at a time and sorts each photo into plastic, glass, or metal. Which computer vision task is this?
  options:
    - "Image classification"
    - "Object detection"
