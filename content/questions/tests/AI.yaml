  type: scenario
  stem: |
    An app converts a restaurant menu written in Japanese into English. Which NLP task is this?
  options:
    - "Speech synthesis"
    - "Sentiment analysis"
    - "Machine translation"
    - "Part-of-speech tagging"
  answer: C
