- id: pt3-ai-02
  test: 3
  skill: genai-models
  objective: AI1
  tier: competitive
  type: concept
  stem: |
    A VAE trained on faces can produce a smooth blend between two faces. What makes this possible?
  options:
    - "It averages the two photos pixel by pixel"
    - "Its discriminator rejects unrealistic blends"
    - "Its smooth latent space puts in-between faces between them"
    - "It removes noise from both faces at once"
  answer: C
  explain: |
    A VAE encodes inputs into a smooth latent space, where nearby points decode into similar examples. Moving along the path between two encoded faces and decoding each point gives faces that gradually turn from one into the other.
  why:
    A: "Averaging pixels overlays two images into a ghostly double, not a smooth blend."
    B: "A discriminator belongs to a GAN, not a VAE."
    D: "Removing noise step by step is how diffusion models generate images."

