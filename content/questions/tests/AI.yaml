# ================================================================ Test 1
- id: pt1-ai-01
  test: 1
  skill: genai-nature
  objective: AI1
  tier: core
  type: recall
  stem: |
    Which list names kinds of content that generative AI can produce?
  options:
    - "Only labels and scores for existing data"
    - "Text, images, audio, video, and code"
    - "Only text, such as essays and chat replies"
    - "Only images and video"
  answer: B
  explain: |
    Generative AI creates new content of many kinds, including text, images, audio, video, and code, from patterns learned in its training data. Labels and scores for existing data are the output of discriminative models.
  why:
    A: "Labels and scores come from discriminative models, which judge existing data."
    C: "Text is one kind of output, but generative models also produce images, audio, video, and code."
    D: "Images and video are only part of what generative models produce."

- id: pt1-ai-02
  test: 1
  skill: genai-models
  objective: AI1
  tier: competitive
  type: concept
  stem: |
    During GAN training, what does the generator learn from?
  options:
    - "Labels written by human annotators"
    - "The noise removed at each denoising step"
    - "The next token in a text"
    - "The discriminator's judgments of real versus fake"
  answer: D
  explain: |
    In a GAN, the discriminator judges whether each sample is real or generated, and the generator improves by learning to produce samples the discriminator accepts as real. The two networks train against each other.
  why:
    A: "GANs need no human labels; the discriminator supplies the training signal."
    B: "Removing noise step by step is how diffusion models learn."
    C: "Predicting the next token is how autoregressive language models learn."

- id: pt1-ai-03
  test: 1
  skill: genai-limits
  objective: AI2
  tier: core
  type: scenario
  stem: |
    A chatbot attributes a famous-sounding quotation to a historical figure, but no record of the quotation exists anywhere. What is this called?
  options:
    - "A hallucination"
    - "A knowledge cutoff"
    - "Non-determinism"
    - "Mode collapse"
  answer: A
  explain: |
    A hallucination is confident, plausible output that is false or made up, such as an invented quotation. The model produces likely-sounding text, and nothing in that process checks it against a record.
  why:
    B: "A knowledge cutoff hides events after the training data end; this quote never existed at all."
    C: "Non-determinism means answers vary between runs; it does not explain an invented quote."
    D: "Mode collapse is a GAN failure in which the generator repeats nearly the same output."

- id: pt1-ai-04
  test: 1
