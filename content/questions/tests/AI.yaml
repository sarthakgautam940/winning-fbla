- id: pt3-ai-10
  test: 3
  skill: sampling
  objective: AI6
  tier: champion
  type: calculation
  stem: |
    The five most likely next tokens have probabilities 0.40, 0.25, 0.20, 0.10, and 0.05. With top-p sampling at p = 0.6, how many tokens can be chosen from?
  options:
    - "1"
    - "2"
    - "3"
    - "5"
  ordered: true
  answer: B
  explain: |
    Top-p keeps the smallest set of most likely tokens whose probabilities add up to at least p. The first token gives 0.40, short of 0.6; adding the second gives 0.65, which reaches it, so 2 tokens remain.
  why:
    A: "The top token alone covers only 0.40, less than 0.6."
    C: "3 adds one token too many; the first two already reach 0.65."
    D: "Top-p cuts off the unlikely tokens instead of keeping all five."
  verify: |
    total, n = 0, 0
    for p in [0.40, 0.25, 0.20, 0.10, 0.05]:
        if total >= 0.6:
            break
        total += p
        n += 1
    ans = n

# ================================================================ Test 4
- id: pt4-ai-01
  test: 4
  skill: genai-nature
  objective: AI1
  tier: competitive
  type: scenario
  stem: |
    A model reads a loan application and outputs "probability of default: 0.18." What kind of model is this?
  options:
    - "Discriminative, since it scores an existing example"
    - "Generative, since it outputs a number"
    - "Generative, since it learned from data"
    - "Neither, since it uses probabilities"
  answer: A
  explain: |
    The model scores an existing application rather than creating new content, so it is discriminative (predictive). Producing a number does not make a model generative; creating new examples does.
  why:
    B: "Outputting a number is what predictive models do; generative models create new content."
    C: "Both kinds of model learn from data, so learning alone does not decide the type."
    D: "Discriminative models often output probabilities; that is exactly what this one does."

- id: pt4-ai-02
  test: 4
  skill: genai-models
  objective: AI1
  tier: champion
  type: scenario
  stem: |
    A designer needs high-quality, varied images and can wait a little for each one. A phone app needs images almost instantly. Which model families fit these two needs?
  options:
    - "A GAN for the designer, diffusion for the app"
    - "A VAE for both, since its images are sharpest"
    - "Diffusion for the designer, a GAN for the app"
    - "Diffusion for both, since it is the fastest"
  answer: C
  explain: |
    Diffusion models give high-quality images but generate slowly, over many denoising steps, which suits a designer who can wait. A trained GAN makes each image in one fast pass, which suits an app that needs speed.
  why:
    A: "This swaps them: diffusion is the slower, high-quality option, and a GAN is the fast one."
    B: "VAE images tend to be blurrier, not sharper."
    D: "Diffusion is the slow option, since it removes noise over many steps."

- id: pt4-ai-03
  test: 4
  skill: genai-limits
  objective: AI2
  tier: core
  type: scenario
  stem: |
    A school club wants help with its bake sale. Which request is generative AI best suited to?
  options:
    - "Confirming the exact date of next month's school holiday"
    - "Drafting several catchy slogans for posters"
    - "Calculating the exact profit from 1,284 sales"
    - "Checking which members have paid their dues"
  answer: B
  explain: |
    Drafting creative text, such as slogans, plays to generative AI's strengths, and a weak draft costs nothing. Exact dates, exact sums, and private records need a calendar, a calculator, or the club's own data.
  why:
    A: "A school's holiday date is a specific fact the model may not know and could make up."
    C: "Exact arithmetic over many sales needs a calculator or spreadsheet."
    D: "Payment records are private data the model has never seen."

- id: pt4-ai-04
  test: 4
  skill: llm-capabilities
  objective: AI2
  tier: champion
  type: scenario
  stem: |
    A chatbot with no tools is asked, "What day of the week is it today?" Why can't it answer reliably on its own?
  options:
    - "It has no clock; the date must come from the prompt or a tool"
    - "Dates are too hard for language models to format"
    - "It knows the date but is trained to refuse"
    - "Its context window is too small to hold a date"
  answer: A
  explain: |
    A model's knowledge comes from training data that end at a cutoff, and it has no clock of its own. Unless the app puts the current date in the prompt or the model can call a tool, it can only guess today's date.
  why:
    B: "Formatting dates is easy for an LLM; the problem is not knowing which date it is."
    C: "There is nothing to refuse; the model simply has no access to the current date."
    D: "A date takes only a few tokens and fits easily in any context window."

- id: pt4-ai-05
  test: 4
  skill: genai-uses
  objective: AI3
  tier: competitive
  type: scenario
  stem: |
    A transit agency uses a generative model to create realistic but fake rider trip records so that outside developers can test a new app without seeing any real rider's data. What is this use?
  options:
    - "Digital art and media"
    - "Sentiment analysis of rider reviews"
    - "Drug discovery for public health"
    - "Privacy-protecting synthetic data"
  answer: D
  explain: |
    Synthetic data are generated records that mimic the patterns of real data without describing real people. They let developers build and test with realistic data while riders' privacy is protected.
  why:
    A: "The records are test data, not creative media."
    B: "Sentiment analysis labels opinions in text; nothing here is labeled."
    C: "Drug discovery designs molecules, not trip records."

- id: pt4-ai-06
  test: 4
  skill: ai-subfields
  objective: AI4
  tier: competitive
  type: scenario
  stem: |
    A movie app recommends films whose genre, director, and actors resemble films a user rated highly, without using other users' ratings. Which recommender approach is this?
  options:
    - "Collaborative filtering"
    - "Content-based filtering"
    - "Sentiment analysis"
    - "Automated planning"
  answer: B
  explain: |
    Content-based filtering recommends items whose features resemble those of items the user already liked. Collaborative filtering would instead use the ratings of other, similar users.
  why:
    A: "Collaborative filtering relies on other users' ratings, which this app does not use."
    C: "Sentiment analysis labels opinions in text; it does not recommend films."
    D: "Automated planning finds sequences of actions that reach a goal."

- id: pt4-ai-07
  test: 4
