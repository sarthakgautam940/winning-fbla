- id: pt5-ai-08
  test: 5
  skill: llm-training
  objective: AI5
  tier: competitive
  type: concept
  stem: |
    During pretraining, a model reads the four-token text "The sky is blue." Which next-token prediction tasks does this text give it?
  options:
    - "One task: the whole sentence paired with a human label"
    - "From 'The', predict 'sky'; from 'The sky', 'is'; from 'The sky is', 'blue'"
    - "From 'blue', predict 'is'; from 'is', 'sky'; from 'sky', 'The'"
    - "From 'The', predict 'sky'; from 'sky', 'is'; from 'is', 'blue', ignoring earlier words"
  answer: B
  explain: |
    Each prefix of the text predicts the token that follows it, so 4 tokens give 4 minus 1 = 3 predictions, and the text supplies its own targets. That is why pretraining needs no human labels.
  why:
    A: "Pretraining needs no human labels; the next token in the text is the target."
    C: "The model predicts forward, from earlier tokens to the next one, not backward."
    D: "Each prediction uses all of the earlier tokens as context, not just the one before."

- id: pt5-ai-09
  test: 5
  skill: rag-agents
  objective: AI6
  tier: core
  type: concept
  stem: |
    In an AI agent's loop of perceive, plan, act, and observe, what happens in the observe step?
  options:
    - "It writes a plan before starting"
    - "It reads the user's first request"
    - "It stops after a single action"
    - "It checks what its last action did"
  answer: D
  explain: |
    After acting, an agent observes the result, such as whether a booking went through, and uses it to plan the next step. Then the loop repeats until the goal is reached.
  why:
    A: "Writing a plan is the plan step."
    B: "Taking in the request and the situation is the perceive step."
    C: "An agent repeats its loop over several steps rather than stopping after one action."

- id: pt5-ai-10
  test: 5
  skill: rag-agents
  objective: AI6
  tier: competitive
  type: concept
  stem: |
    Why do companies often use retrieval-augmented generation (RAG), rather than fine-tuning, to keep a chatbot's answers about their products current?
  options:
    - "RAG permanently updates the model's weights"
    - "New documents can be retrieved at once, with no retraining"
    - "RAG makes the model's context window unlimited"
    - "Fine-tuning cannot change a model at all"
  answer: B
  explain: |
    With RAG, updated documents go into the store the system searches, and the next question can draw on them immediately. Fine-tuning would mean retraining the model every time the information changes.
  why:
    A: "RAG changes no weights; it adds retrieved passages to the prompt."
    C: "The retrieved passages still have to fit in the context window."
    D: "Fine-tuning does change a model's weights; it is just slow and costly to repeat for every update."
