- id: pt4-ai-08
  test: 4
  skill: llm-definition
  objective: AI5
  tier: competitive
  type: concept
  stem: |
    In the name GPT, generative pre-trained transformer, what does "pre-trained" mean?
  options:
    - "It learned from people answering questions in advance"
    - "Its answers were written and stored before you ask"
    - "It learned only from a small task-specific dataset"
    - "It first learned from huge general text, before any tuning"
  answer: D
  explain: |
    Pretraining is the first, largest stage: next-token prediction on a huge general text collection. Fine-tuning and instruction tuning come afterward and adapt the pretrained model to particular uses.
  why:
    A: "Pretraining uses ordinary text with no human answers; human feedback comes later, in RLHF."
    B: "The model generates each answer when asked; nothing is stored in advance."
    C: "Learning from a small, focused dataset describes fine-tuning, which comes after pretraining."

- id: pt4-ai-09
  test: 4
  skill: embeddings
  objective: AI6
  tier: core
  type: concept
  stem: |
    In a good word-embedding space, which word's vector is most likely closest to the vector for "kitten"?
  options:
    - "cat"
    - "kitchen"
    - "mitten"
    - "kite"
  answer: A
  explain: |
    Embeddings place words with similar meanings near each other, so "kitten" sits closest to related words such as "cat." Spelling plays no part.
  why:
    B: "Kitchen shares letters with kitten, but embeddings follow meaning, not spelling."
    C: "Mitten rhymes with kitten, but sound and spelling do not decide closeness."
    D: "Kite shares its first letters with kitten but means something unrelated."

- id: pt4-ai-10
  test: 4
  skill: rag-agents
  objective: AI6
  tier: core
  type: scenario
  stem: |
    A homework-help chatbot can call a calculator tool. When should it use the tool?
  options:
    - "When writing an encouraging message"
    - "When explaining what a fraction is"
    - "When multiplying two large numbers exactly"
    - "When summarizing a short story"
  answer: C
  explain: |
