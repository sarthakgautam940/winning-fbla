- id: pt1-ai-08
  test: 1
  skill: llm-training
  objective: AI5
  tier: competitive
  type: scenario
  stem: |
    A company wants its model to write in the company's house style for every user, without adding long instructions to each prompt. Which approach changes the model itself?
  options:
    - "Fine-tuning on examples of the house style"
    - "Few-shot prompting with style examples"
    - "Raising the sampling temperature"
    - "Using a longer context window"
  answer: A
  explain: |
    Fine-tuning continues training a pretrained model on focused examples, changing its weights so the style carries into every conversation. Prompting techniques shape one conversation without changing the model.
  why:
    B: "Few-shot examples change no weights; they must be included in every prompt."
    C: "Temperature changes how varied the sampling is, not the model's style."
    D: "A longer window holds more text but teaches the model nothing new."

- id: pt1-ai-09
  test: 1
  skill: sampling
  objective: AI6
  tier: competitive
  type: scenario
  stem: |
    A team wants an LLM to answer employees' policy questions with focused, consistent answers. Which temperature setting fits best?
  options:
    - "A high value, such as 1.5"
    - "A value chosen at random for each answer"
    - "Any value, since temperature only affects speed"
    - "A low value, such as 0.2"
  answer: D
  explain: |
    A low temperature sharpens the probabilities toward the most likely tokens, giving focused, repeatable answers, which suits factual questions. High temperatures suit brainstorming.
  why:
    A: "A high temperature spreads probability across more tokens, giving varied and more error-prone answers."
    B: "Random settings would make answers less consistent, not more."
    C: "Temperature changes how tokens are sampled, which changes the answers themselves."

- id: pt1-ai-10
  test: 1
  skill: embeddings
  objective: AI6
  tier: champion
  type: calculation
  stem: |
    Two text embeddings are A = (2, 0, 1) and B = (0, 3, 0). What is their cosine similarity, and what does it suggest?
  options:
    - "1, so the texts mean the same thing"
    - "0.5, so the texts are partly related"
    - "0, so the texts are unrelated"
    - "It cannot be computed, since the lengths differ"
  answer: C
  explain: |
    The dot product is 2 × 0 + 0 × 3 + 1 × 0 = 0, so the cosine similarity is 0 divided by the product of the lengths, which is 0. The vectors point in unrelated directions, suggesting unrelated meanings.
  why:
    A: "A similarity of 1 needs the vectors to point the same way, and these share no direction."
    B: "There is no overlap at all: every product of matching components is 0."
    D: "Cosine similarity divides by the lengths, so vectors of different lengths compare fine."
  verify: |
    a, b = np.array([2, 0, 1]), np.array([0, 3, 0])
    cos = a @ b / (np.linalg.norm(a) * np.linalg.norm(b))
    ans = "0, so the texts are unrelated" if abs(cos) < 1e-9 else "no match"

