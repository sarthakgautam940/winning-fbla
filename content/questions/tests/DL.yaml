    - "A data engineer sets the rule; a data steward enforces it"
    - "A data analyst sets the rule; a data engineer enforces it"
    - "A data steward sets the rule; a database administrator enforces it"
  answer: D
  explain: |
    A data steward decides what data means and who may use it, as part of data governance. A database administrator keeps the database secure, which includes applying those access permissions.
  why:
    A: "Analysts use data to answer questions; they do not enforce database security."
    B: "Engineers build pipelines; deciding who may use data is the steward's job."
    C: "Neither analysts nor engineers own access rules."

