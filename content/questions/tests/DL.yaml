- id: pt5-dl-01
  test: 5
  skill: ds-analytics
  objective: DL1
  tier: champion
  type: scenario
  stem: |
    A store manager sends the data team four requests. Which one calls for prescriptive analytics?
  options:
    - "What will sales be if we raise prices by 5 percent?"
    - "Why did sales drop after last spring's price rise?"
    - "Which price should we set to earn the most profit?"
    - "What were weekly sales at each price last year?"
  answer: C
  explain: |
    Prescriptive analytics recommends an action, often by optimizing. Asking which price to set is a request for a decision. A what-if forecast, even about a price change, only predicts what would happen.
  why:
    A: "This is predictive: it forecasts the result of one scenario without choosing an action."
    B: "This is diagnostic: it asks why something happened."
    D: "This is descriptive: it reports past sales."

