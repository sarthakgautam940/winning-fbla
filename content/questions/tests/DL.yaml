  options:
    - "47"
    - "61"
    - "75"
    - "117"
  ordered: true
  answer: B
  explain: |
    In octal the places are worth 8s and 1s, so 75 in octal is 7 × 8 + 5 = 61.
  why:
    A: "47 reverses the digits: 5 × 8 + 7."
    C: "75 leaves the number in octal."
    D: "117 uses a place value of 16: 7 × 16 + 5."
  verify: 'int("75", 8)'

- id: pt4-dl-11
  test: 4
  skill: bits-bytes
  objective: DL4
  tier: core
  type: recall
  stem: |
    How many bits are in a nibble?
  options:
    - "2"
    - "4"
    - "8"
    - "16"
  ordered: true
  answer: B
  explain: |
    A nibble is half a byte: 4 bits. One hex digit stands for exactly one nibble, which is why a byte is written as two hex digits.
  why:
    A: "2 bits hold only four patterns, too few for one hex digit."
    C: "8 bits make a full byte."
    D: "16 bits make two bytes."
  verify: "8 // 2"

- id: pt4-dl-12
  test: 4
  skill: bin-arith
  objective: DL4
  tier: champion
  type: calculation
  stem: |
    8-bit two's complement holds values from -128 to 127. A program adds 100 and 50 and keeps the 8-bit result, then reads it as a two's complement number. What value does it read?
  options:
    - "-106"
    - "-22"
    - "127"
    - "150"
  ordered: true
  answer: A
  explain: |
    The true sum, 150, is too big for the range. Its 8-bit pattern, 10010110, starts with a 1, so it reads as negative: 150 minus 256 = -106. This wraparound is signed overflow.
  why:
    B: "-22 reads the leading 1 as a minus sign on the other seven bits, which is sign-magnitude."
    C: "127 assumes the value stops at the maximum, but the bits wrap around instead."
    D: "150 does not fit in the range -128 to 127."
  verify: "((100 + 50 + 128) % 256) - 128"

