- id: pt2-dl-18
  test: 2
  skill: scaling
  objective: DL6
  tier: champion
  type: calculation
  stem: |
    A min-max scaler was fit on training data where a feature ran from 10 to 50. A new value of 60 arrives in production and is scaled with the same fitted minimum and maximum. What is its scaled value?
  options:
    - "0.83"
    - "1.00"
    - "1.20"
    - "1.25"
  ordered: true
  answer: D
  explain: |
    Min-max scaling computes (x minus min) / (max minus min) with the minimum and maximum fit on the training data: (60 minus 10) / (50 minus 10) = 50 / 40 = 1.25. Values outside the training range land outside 0 to 1.
  why:
    A: "0.83 divides by the new value: 50 / 60."
    B: "1.00 assumes scaled values are capped at 1, but the formula has no cap."
    C: "1.20 divides 60 by 50 without subtracting the minimum."
  verify: "(60 - 10) / (50 - 10)"

