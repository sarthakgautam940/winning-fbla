- id: pt5-dl-13
  test: 5
  skill: study-types
  objective: DL5
  tier: core
  type: scenario
  stem: |
    A grocery chain analyzes the purchase histories recorded by its own loyalty-card program. For the chain, what kind of data is this?
  options:
    - "Second-party data"
    - "Third-party data"
    - "Open data"
    - "First-party data"
  answer: D
  explain: |
    First-party data is collected directly from an organization's own customers. The chain gathered these purchase histories itself, with no partner or broker involved.
  why:
    A: "Second-party data is another organization's first-party data, shared through a partnership."
    B: "Third-party data is bought from companies that gather it from many sources."
    C: "Open data is published for anyone to use."

- id: pt5-dl-14
  test: 5
  skill: study-types
  objective: DL5
  tier: champion
  type: scenario
  stem: |
    A school compares this year's ninth graders, who used a new reading curriculum, with last year's ninth graders, who did not. This year's group scored higher, and the school concludes that the curriculum works. What is the main flaw?
  options:
    - "Nothing; both groups were ninth graders, so they are comparable"
    - "The groups were not randomly assigned, so other differences could explain the gap"
    - "Reading scores are discrete, so they cannot be compared"
    - "A comparison like this needs a census of every student in the state"
  answer: B
  explain: |
    Without random assignment, last year's and this year's groups can differ in many ways, such as their teachers or the mix of students. Any of those could explain the higher scores, so the result shows an association, not proof that the curriculum works.
  why:
    A: "Being in the same grade does not make two different groups of students alike in everything else."
    C: "Discrete scores can be compared; the problem is how the groups were formed."
    D: "A census is not needed; a randomized comparison would answer the question."

- id: pt5-dl-15
  test: 5
  skill: data-gov
  objective: DL5
  tier: competitive
  type: scenario
  stem: |
    A new analyst needs to find which datasets the company has about shipping, who owns each one, and where each is stored. Which tool is built for this?
  options:
    - "A data pipeline"
    - "A data mart"
    - "A data catalog"
    - "Data lineage"
  answer: C
  explain: |
    A data catalog is a searchable list of an organization's datasets, with descriptions, owners, and locations, so people can find the data that exists.
  why:
    A: "A pipeline moves data between systems; it does not help people find datasets."
    B: "A data mart stores one department's data; it is not a directory of all datasets."
    D: "Lineage traces where one dataset's values came from and how they changed."

- id: pt5-dl-16
  test: 5
  skill: scaling
  objective: DL6
  tier: core
  type: concept
  stem: |
    What do min-max normalization and z-score standardization have in common?
  options:
    - "Both rescale a feature without changing the order of its values"
    - "Both force the values into the range 0 to 1"
    - "Both make the feature normally distributed"
    - "Both remove outliers from the feature"
  answer: A
  explain: |
    Both methods shift and stretch a feature, so every value keeps its rank. They differ in the result: min-max scaling puts training values between 0 and 1, while standardization centers them at 0 with standard deviation 1.
  why:
    B: "Only min-max scaling targets the range 0 to 1; standardized values can be any size."
    C: "Neither method changes the shape of the distribution."
    D: "Both keep outliers, and min-max scaling is especially sensitive to them."

- id: pt5-dl-17
  test: 5
  skill: feature-eng
  objective: DL6
  tier: competitive
  type: concept
  stem: |
    Incomes in a dataset are strongly right-skewed. They are split into 5 equal-width bins. What is the most likely result?
  options:
    - "Each bin holds about 20 percent of the incomes"
    - "Most incomes crowd into the highest bin"
    - "The bins end up with different widths"
    - "Most incomes crowd into the lowest bin or two"
  answer: D
  explain: |
    Equal-width bins split the range into equal slices. A long right tail stretches the range, so the top bins cover a few huge incomes and most values land in the lowest bins. Equal-frequency bins would put about 20 percent in each.
  why:
    A: "Equal shares per bin describe equal-frequency binning, not equal-width."
    B: "Right skew means a few very high values; most incomes are low."
    C: "Equal-width bins have equal widths by definition; their counts are what differ."

- id: pt5-dl-18
  test: 5
  skill: wrangling
  objective: DL6
  tier: competitive
  type: visual
  stem: |
    Each value in this table records two separate readings, systolic and diastolic blood pressure. Which change makes the table tidy?

    | patient | blood_pressure |
    |---|---|
    | P1 | 120/80 |
    | P2 | 135/85 |
  options:
    - "Divide each value to get a single number"
    - "Sort the rows by blood_pressure"
    - "Rename blood_pressure to bp"
    - "Split it into a systolic and a diastolic column"
  answer: D
  explain: |
    Each value such as 120/80 holds two variables. Tidy data gives each variable its own column, so the column should be split into systolic and diastolic.
  why:
    A: "Dividing 120 by 80 makes a ratio and loses both original readings."
    B: "Sorting does not separate the two variables."
    C: "A new name does not change the structure."

- id: pt5-dl-19
  test: 5
  skill: ds-process
  objective: DL7
  tier: competitive
  type: scenario
  stem: |
    A finished demand-forecast model is built into a store chain's ordering app, so every manager sees a forecast each morning. Which stage of the data science process is this?
  options:
    - "Evaluating the model"
    - "Deploying the model"
    - "Monitoring the model"
    - "Building the model"
  answer: B
  explain: |
    Deployment puts a finished model to work where people use it, such as inside an ordering app. Watching its accuracy over time afterward is monitoring, a later stage.
  why:
    A: "Evaluation checks the model against the goal before it is put to use."
    C: "Monitoring watches the model's accuracy over time after deployment; here it is just being put into use."
    D: "The model is already finished; building it came earlier."

- id: pt5-dl-20
  test: 5
  skill: reproducibility
  objective: DL7
  tier: champion
  type: scenario
  stem: |
    An analysis splits data at random, trains a random forest, and uses pandas and scikit-learn. A colleague wants to rerun it next year and get exactly the same numbers. Which two things must be recorded?
  options:
    - "The random seed and the package versions"
    - "The random seed and the colors of each chart"
    - "The package versions and the analyst's name"
    - "The output file names and the date of the run"
  answer: A
  explain: |
    Random splits and random forests use random numbers, so a fixed seed makes them repeat. Library updates can change defaults and results, so the exact package versions must be recorded too.
  why:
    B: "Chart colors do not affect any computed number."
    C: "Who ran the analysis does not change its results."
    D: "File names and dates do not change any computed result."
