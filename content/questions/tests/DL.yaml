  skill: var-disc-cont
  objective: DL3
  tier: champion
  type: concept
  stem: |
    A variable can take infinitely many different values. Must it be continuous?
  options:
    - "Yes, because a discrete variable has a fixed, finite list of values"
    - "No; a count such as emails received has no upper limit but is discrete"
    - "Yes, because only measured quantities can grow without limit"
    - "No; any variable with more than 100 values is treated as categorical"
  answer: B
  explain: |
    Discrete means the values are separate points with gaps between them, as counts are. The number of emails received can be 0, 1, 2, and so on without end, yet it never takes a value such as 2.5, so it stays discrete. Continuous means any value in a range is possible.
  why:
    A: "A discrete variable can have infinitely many values; what matters is that they are separate, countable points."
    C: "Counts can grow without limit too, and they are discrete."
    D: "The number of possible values does not turn numbers into categories."

- id: pt3-dl-09
