  stem: |
    One team scored 4 goals and another scored 2. A reporter says the first team scored twice as many goals. At which level of measurement is a goal count, and is the claim meaningful?
  options:
    - "Ratio; counts have a true zero, so the claim is meaningful"
    - "Interval; the claim is not meaningful without a true zero"
    - "Ordinal; goals only show which team ranked higher"
    - "Nominal; goal counts are labels for each team"
  answer: A
  explain: |
    A count has equal steps and a true zero (zero goals means no goals), so it is ratio data. Ratios make sense: 4 goals is twice 2 goals.
  why:
    B: "Counts do have a true zero, which is exactly what makes them ratio, not interval."
    C: "Counts carry exact amounts, not just an order."
    D: "Goal counts are numbers you can add and compare, not labels."

- id: pt3-dl-08
