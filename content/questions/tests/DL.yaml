    C: "A dashboard of daily visits describes; it does not explain."
    D: "Flagging likely quitters predicts and picking who gets an offer prescribes, not the reverse."

- id: pt5-dl-04
  test: 5
  skill: data-formats
  objective: DL2
  tier: competitive
  type: concept
  stem: |
    What is the main advantage of schema-on-read over schema-on-write?
  options:
    - "Queries run faster and more reliably"
    - "Data is cleaned before anyone can use it"
    - "It keeps raw data you have not yet found a use for"
    - "It needs no storage space for raw files"
  answer: C
  explain: |
    Schema-on-read stores data as it arrives and applies structure only when someone reads it, so nothing is thrown away for lack of a planned use. The cost is that queries are slower and less reliable than on data fitted to a schema in advance.
  why:
    A: "Faster, more reliable queries are the advantage of schema-on-write."
    B: "Cleaning before storage describes schema-on-write."
    D: "Storing everything raw takes more space, not less."

- id: pt5-dl-05
  test: 5
  skill: metadata
  objective: DL2
  tier: competitive
  type: concept
  stem: |
    A dataset shared online comes with a README listing when the data was collected, the units of each column, and the code used for missing values, such as -999. Why does this metadata matter?
  options:
    - "It compresses the dataset so it downloads faster"
    - "It replaces the need to clean the data"
    - "It encrypts the values so only the owner can read them"
    - "It lets others interpret the values correctly before analyzing them"
  answer: D
  explain: |
    Metadata is data about data. Knowing the units, the collection dates, and that -999 means missing keeps an analyst from averaging -999 as a real value or mixing up units.
  why:
    A: "Documentation does not change the size of the file."
    B: "Metadata tells you what to clean, such as the -999 codes; it does not clean anything."
    C: "A README is plain documentation, not encryption."

