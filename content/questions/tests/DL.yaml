- id: pt4-dl-09
  test: 4
  skill: base-binary
  objective: DL4
  tier: competitive
  type: calculation
  stem: |
    The binary number 1011 equals 11 in decimal. What does 10110 equal?
  options:
    - "12"
    - "22"
    - "44"
    - "110"
  ordered: true
  answer: B
  explain: |
    Writing a 0 on the right shifts every bit one place left, and each place is worth twice the one to its right. So 10110 is 2 × 11 = 22, which checks out as 16 + 4 + 2.
  why:
    A: "12 treats the new digit as adding 1."
    C: "44 shifts two places, which would need two zeros."
    D: "110 appends a 0 as if the number were decimal."
  verify: 'int("10110", 2)'

- id: pt4-dl-10
  test: 4
