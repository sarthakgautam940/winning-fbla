- id: pt4-dl-17
  test: 4
  skill: scaling
  objective: DL6
  tier: competitive
  type: concept
  stem: |
    A training feature has exactly four values. After z-score standardization, which set could they be?
  options:
    - "-1.4, -0.2, 0.2, 1.4"
    - "0.00, 0.25, 0.50, 1.00"
    - "10, 20, 30, 40"
    - "1, 2, 3, 4"
  answer: A
  explain: |
    Standardized training values always have mean 0 and standard deviation 1, so values below the mean become negative. The set -1.4, -0.2, 0.2, 1.4 averages to 0, and its standard deviation is exactly 1.
  why:
    B: "These look like min-max values from 0 to 1, but standardized values must average 0."
    C: "These are raw values; standardizing would center them on 0."
    D: "These are ranks, and they average 2.5, not 0."
  verify: |
    v = [-1.4, -0.2, 0.2, 1.4]
    ok = abs(statistics.fmean(v)) < 1e-9 and abs(statistics.pstdev(v) - 1) < 1e-9
    ans = "-1.4, -0.2, 0.2, 1.4" if ok else "no set fits"

