- id: pt4-dl-20
  test: 4
  skill: eda
  objective: DL7
  tier: competitive
  type: code
  stem: |
    During exploratory analysis, `df["minutes"].describe()` prints this summary. What is the interquartile range of minutes?

    ```text
    count    200.0
    mean      42.6
    std       11.3
    min       12.0
    25%       35.0
    50%       41.0
    75%       49.0
    max       95.0
    ```
  options:
    - "11.3"
    - "14"
    - "41"
    - "83"
  ordered: true
  answer: B
