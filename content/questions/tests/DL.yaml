- id: pt5-dl-09
  test: 5
  skill: base-hex
  objective: DL4
  tier: competitive
  type: calculation
  stem: |
    A game stores a player's score of 300 in hexadecimal. How is 300 written in hex?
  options:
    - "12B"
    - "12C"
    - "18C"
    - "C21"
  answer: B
  explain: |
    300 / 16 = 18 remainder 12, and 18 / 16 = 1 remainder 2. Reading the remainders from last to first gives 1, 2, C (12): 12C. Check: 1 × 256 + 2 × 16 + 12 = 300.
  why:
    A: "12B ends in B, which is 11; the remainder is 12, which is C."
    C: "18C writes the quotient 18 as decimal digits instead of converting it to hex."
    D: "C21 reads the remainders in the order they were found."
  verify: 'format(300, "X")'

