    - "Selecting the most useful existing columns"
    - "One-hot encoding each customer's orders"
    - "Normalizing order values to the 0 to 1 range"
  answer: A
  explain: |
    Aggregates summarize many rows into one value per customer, such as a count of recent orders or an average order value. Creating them is a common kind of feature engineering.
  why:
    B: "Feature selection keeps some existing columns; here new columns are created."
