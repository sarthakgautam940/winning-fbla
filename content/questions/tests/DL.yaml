- id: pt2-dl-14
  test: 2
  skill: study-types
  objective: DL5
  tier: competitive
  type: scenario
  stem: |
    To test whether a new study app raises quiz scores, researchers randomly split 80 volunteers: 40 use the app and 40 study as usual. What is the role of the 40 who study as usual?
  options:
    - "They are the control group, showing results without the treatment"
    - "They are the treatment group, because they also study"
    - "They are a confounding variable that the study must remove"
    - "They are the population the sample was drawn from"
  answer: A
  explain: |
    The 40 who study as usual do not get the treatment (the app), so they are the control group. Comparing the two randomly assigned groups shows the app's effect, because random assignment makes the groups alike in everything else.
  why:
    B: "The treatment is the app; the group that does not use it is not the treatment group."
    C: "A confounding variable is a hidden factor, not a group of subjects."
    D: "The population is everyone the study wants to learn about; both groups were drawn from it."

- id: pt2-dl-15
  test: 2
  skill: study-types
  objective: DL5
  tier: champion
  type: scenario
  stem: |
    Dataset 1 holds one country's monthly unemployment rate for 20 years. Dataset 2 holds the income of the same 800 households, recorded every year for 10 years. Which pair of labels is correct?
  options:
    - "1: cross-sectional; 2: time series"
    - "1: time series; 2: longitudinal (panel)"
    - "1: longitudinal (panel); 2: cross-sectional"
    - "1: time series; 2: cross-sectional"
  answer: B
  explain: |
    A time series records one quantity at regular intervals, like a monthly rate. Longitudinal (panel) data measures the same subjects repeatedly, like the same households every year.
  why:
    A: "Dataset 1 follows one quantity over time, not many subjects at one moment."
    C: "Dataset 1 is a single quantity, not many subjects, and dataset 2 is measured more than once."
    D: "Dataset 2 measures the same households repeatedly, so it is not a single snapshot."

- id: pt2-dl-16
