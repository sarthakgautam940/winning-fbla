  options:
    - "1 descriptive, 2 predictive, 3 diagnostic, 4 prescriptive"
    - "1 descriptive, 2 diagnostic, 3 predictive, 4 prescriptive"
    - "1 diagnostic, 2 predictive, 3 descriptive, 4 prescriptive"
    - "1 descriptive, 2 prescriptive, 3 diagnostic, 4 predictive"
  answer: A
