  options:
    - "1"
    - "2"
    - "4"
    - "8"
  ordered: true
  answer: C
  explain: |
    Uncompressed size is width × height × bytes per pixel. Doubling both the width and the height multiplies the pixel count by 2 × 2 = 4, and the bytes per pixel stay the same.
