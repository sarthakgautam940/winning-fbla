  stem: |
    A customer table stores full addresses such as "12 Oak St, Austin, TX 78701" in one text column. To count customers by ZIP code, what must happen first?
  options:
    - "Group the customers by the full address"
    - "Convert the address column to a number"
    - "One-hot encode the address column"
    - "Parse the ZIP code into its own column"
  answer: D
  explain: |
    Parsing pulls the piece you need out of a combined text field. Once the ZIP code sits in its own column, counting customers by ZIP is a simple group-and-count.
  why:
    A: "Nearly every full address is unique, so grouping by it puts each customer in a group of one."
    B: "An address is text, so converting the whole column to a number fails."
