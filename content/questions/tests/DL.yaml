    A notebook runs cleanly on its author's laptop but gives different results on a teammate's, because the teammate has a newer version of pandas installed. Which practice prevents this?
  options:
    - "Recording the exact package versions the code used"
    - "Setting a random seed at the top of the notebook"
    - "Keeping the notebook's code under version control"
    - "Saving every chart the notebook makes as an image"
  answer: A
  explain: |
    Recording the environment means writing down which packages, and which versions, the code ran with, so anyone can install the same ones. A newer library version can change defaults and results even when the code is identical.
  why:
