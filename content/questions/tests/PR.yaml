- id: pt1-pr-10
  test: 1
  skill: search-basics
  objective: PR5
  tier: champion
  type: visual
  stem: |
    A checkers program searches the game tree below with alpha-beta pruning, examining leaves from left to right. MAX moves at the root, and each MIN node takes the smallest of its leaves. Which leaf is never examined?
  figure:
    type: tree
    caption: A game tree in which MAX chooses among three MIN nodes; the numbers are leaf scores.
    root:
      label: MAX
      children:
        - label: MIN
          children:
            - { label: "3" }
            - { label: "9" }
        - label: MIN
          children:
            - { label: "5" }
            - { label: "6" }
        - label: MIN
          children:
            - { label: "2" }
            - { label: "8" }
  options:
    - "2"
    - "6"
    - "8"
    - "9"
  ordered: true
  answer: C
  explain: |
    The first MIN node is worth 3, so MAX can count on at least 3. Both leaves of the second MIN node must be checked, and it is worth 5, raising MAX's guarantee to 5. At the third MIN node, the first leaf is 2, so that node is worth 2 or less, worse for MAX than 5. Nothing the leaf 8 holds can change MAX's choice, so the search skips it.
  why:
    A: "The leaf 2 must be examined; it is what shows the third branch cannot beat 5."
    B: "The 6 must be checked, because until it is seen the second MIN node could still be worth less than 5."
    D: "The first MIN node has no bound to compare against yet, so both of its leaves, including 9, are examined."
  verify: |
    leaves = [[3, 9], [5, 6], [2, 8]]
    alpha = float("-inf")
    seen = []
    for node in leaves:
        v = float("inf")
        for x in node:
            seen.append(x)
            v = min(v, x)
            if v <= alpha:
                break
        alpha = max(alpha, v)
    ans = [x for node in leaves for x in node if x not in seen][0]

