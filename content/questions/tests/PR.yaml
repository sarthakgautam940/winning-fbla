  options:
    - "$$\\forall x\\, (\\text{Customer}(x) \\land \\text{OrderedOnline}(x) \\land \\text{GotReceipt}(x))$$"
    - "$$\\forall x\\, (\\text{Customer}(x) \\rightarrow (\\text{OrderedOnline}(x) \\land \\text{GotReceipt}(x)))$$"
    - "$$\\forall x\\, ((\\text{Customer}(x) \\land \\text{OrderedOnline}(x)) \\rightarrow \\text{GotReceipt}(x))$$"
    - "$$\\exists x\\, (\\text{Customer}(x) \\land \\text{OrderedOnline}(x) \\land \\text{GotReceipt}(x))$$"
  answer: C
  explain: |
    The sentence is about customers who ordered online, so both conditions go on the left of the implication: for every x, if x is a customer and ordered online, then x received a receipt.
  why:
    A: "Pairing the universal with AND claims that everything is a customer who ordered online and got a receipt."
    B: "This says every customer ordered online and got a receipt, even customers who shopped in person."
