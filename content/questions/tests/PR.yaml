- id: pt2-pr-01
  test: 2
  skill: prop-logic
  objective: PR1
  tier: competitive
  type: concept
  stem: |
    What is the converse of "If a phone is charging, its light is on"?
  options:
    - "If the phone is not charging, its light is not on"
    - "If the light is not on, the phone is not charging"
    - "If the light is on, the phone is charging"
    - "The phone is charging, and its light is not on"
  answer: C
  explain: |
    The converse swaps the condition and the result: from "if P, then Q" it forms "if Q, then P." It is not equivalent to the original, since the light might be on for another reason.
  why:
    A: "Negating both parts gives the inverse, not the converse."
    B: "Swapping and negating both parts gives the contrapositive, which is equivalent to the original."
    D: "This is the negation of the original, the one case that makes it false."

- id: pt2-pr-02
  test: 2
  skill: fol-syntax
  objective: PR1
  tier: core
  type: concept
  stem: |
    In predicate logic, what does a predicate applied to a constant, such as Hungry(Milo), express?
  options:
    - "A new object, such as whoever feeds Milo"
    - "A number between 0 and 1 for how hungry Milo is"
    - "A list of every object that is hungry"
    - "A statement about Milo that is either true or false"
  answer: D
  explain: |
    A predicate states a property of its arguments or a relationship among them, so Hungry(Milo) is a statement that is true or false. A function, by contrast, returns an object, such as OwnerOf(Milo).
  why:
    A: "Returning an object is what a function does, as in OwnerOf(Milo)."
    B: "Degrees between 0 and 1 belong to fuzzy logic; a predicate is simply true or false."
    C: "Hungry(Milo) is about one object, Milo, not a list of all hungry things."

- id: pt2-pr-03
  test: 2
  skill: fol-translate
  objective: PR2
  tier: champion
  type: concept
  stem: |
    Let Failed(x, y) mean "x failed y." Which sentence says "No student failed every test"?
  options:
    - "$$\\neg \\exists x\\, (\\text{Student}(x) \\rightarrow \\forall y\\, (\\text{Test}(y) \\rightarrow \\text{Failed}(x, y)))$$"
    - "$$\\neg \\exists x\\, (\\text{Student}(x) \\land \\forall y\\, (\\text{Test}(y) \\rightarrow \\text{Failed}(x, y)))$$"
    - "$$\\exists x\\, (\\text{Student}(x) \\land \\neg \\forall y\\, (\\text{Test}(y) \\rightarrow \\text{Failed}(x, y)))$$"
    - "$$\\neg \\exists x\\, (\\text{Student}(x) \\land \\exists y\\, (\\text{Test}(y) \\land \\text{Failed}(x, y)))$$"
  answer: B
  explain: |
    Read it as "there is no x that is a student and failed every test." Inside, "failed every test" is a universal with an implication: for every y, if y is a test, x failed y. The outer "no" negates an existential paired with AND.
  why:
    A: "Pairing the existential with an implication breaks the sentence: anything that is not a student would make it false."
    C: "This says some student did not fail every test, which is much weaker and allows other students to fail them all."
    D: "This says no student failed any test, a far stronger claim."

- id: pt2-pr-04
  test: 2
  skill: fol-negation
  objective: PR2
  tier: competitive
  type: concept
  stem: |
    What is the negation of "Every flight that left on time arrived on time"?
  options:
    - "No flight that left on time arrived on time"
    - "Every flight that left late arrived late"
    - "Some flight left on time but did not arrive on time"
    - "Some flight left late but arrived on time"
  answer: C
  explain: |
    The claim says that for every flight, if it left on time, it arrived on time. Its negation needs one flight that breaks that promise: it left on time but did not arrive on time.
  why:
    A: "This goes too far; one late arrival among the on-time departures is enough to make the claim false."
    B: "This changes the subject to flights that left late, which the claim says nothing about."
    D: "A flight that left late cannot break a promise about flights that left on time."

- id: pt2-pr-05
  test: 2
  skill: reasoning-types
  objective: PR3
  tier: competitive
  type: scenario
  stem: |
    A chess app must check whether each move a player tries is legal under the rules of chess. Which kind of reasoning problem is this check?
  options:
    - "Logical deduction from the game's fixed rules"
    - "Adversarial search, with minimax"
    - "Statistical inference from past games"
    - "Classification with a trained neural network"
  answer: A
  explain: |
    Whether a move is legal follows with certainty from the fixed rules of chess, so checking it is logical deduction. Adversarial search is for choosing a good move against an opponent, a different job.
  why:
    B: "Minimax chooses strong moves against an opponent; it does not decide whether a move is allowed."
    C: "Legality is certain, not a likelihood estimated from past games."
    D: "The rules are known exactly, so there is nothing to learn from examples."

- id: pt2-pr-06
  test: 2
  skill: bayes-reasoning
  objective: PR3
  tier: competitive
  type: calculation
  stem: |
    A wildlife camera's motion sensor triggers on 90 percent of nights when a fox visits and on 20 percent of nights without one, because of wind and branches. A fox visits on 10 percent of nights. The sensor triggers tonight. What is the probability that a fox visited, to the nearest hundredth?
  options:
    - "0.1"
    - "0.33"
    - "0.67"
    - "0.9"
  ordered: true
  answer: B
  explain: |
    Weight each case by its prior: a fox and a trigger, 0.1 × 0.9 = 0.09; no fox and a trigger, 0.9 × 0.2 = 0.18. The sensor triggers with probability 0.27 in all, so P(fox given trigger) = 0.09 / 0.27, about 0.33.
  why:
    A: "0.1 is the prior, before the trigger is taken into account."
    C: "0.67 is 0.18 / 0.27, the probability that no fox visited."
    D: "0.9 is the probability of a trigger given a fox, the reverse of what was asked."
  verify: "0.1 * 0.9 / (0.1 * 0.9 + 0.9 * 0.2)"

- id: pt2-pr-07
  test: 2
  skill: bn-inference
  objective: PR4
  tier: core
  type: concept
  stem: |
    A gardener's Bayesian network has the edge Watered → Blooms. Which question asks for predictive reasoning?
  options:
    - "Given that the plant was watered, how likely is it to bloom?"
    - "Given that the plant bloomed, how likely is it that it was watered?"
    - "Should the edge point from Blooms to Watered instead?"
    - "How many plants in the garden bloomed last year?"
  answer: A
  explain: |
    Predictive reasoning runs from a cause to its effect, here from watering to blooming. Reasoning from the effect back to the cause, as in the second question, is diagnostic.
  why:
    B: "Reasoning from the bloom back to the watering goes from effect to cause, which is diagnostic reasoning."
    C: "This asks about the network's structure, not an inference; edges point from cause to effect."
    D: "A count of past blooms describes data; it is not an inference in the network."

- id: pt2-pr-08
  test: 2
  skill: bn-independence
  objective: PR4
  tier: competitive
  type: concept
  stem: |
    In the chain Rain → Traffic → Late, rain causes heavy traffic, and heavy traffic makes a commuter late. Which statement is true?
  options:
    - "Rain and Late are independent no matter what is known"
    - "Rain and Late become dependent only once Traffic is known"
    - "Late is a parent of Traffic in this network"
    - "Rain and Late become independent once Traffic is known"
  answer: D
  explain: |
    In a chain, the middle node carries all of the influence. Before you know the traffic, rain makes lateness more likely. Once you know whether traffic is heavy, learning about rain tells you nothing more about lateness.
  why:
    A: "Without knowing the traffic, rain does change the chance of being late, through the traffic."
    B: "Becoming dependent once the middle node is known describes a collider, A → C ← B, not a chain."
    C: "The edge runs from Traffic to Late, so Traffic is Late's parent."

- id: pt2-pr-09
  test: 2
  skill: kr-forms
  objective: PR5
  tier: core
  type: concept
  stem: |
    A semantic network stores "has gills" at the Fish node, and Salmon, Trout, and Shark are each linked to Fish by an is-a link. Why is the fact stored at Fish rather than at each kind of fish?
  options:
    - "Inheritance passes it down the is-a links, so it is stored only once"
    - "Specific nodes such as Salmon cannot hold any properties of their own"
    - "Storing it at Fish means no kind of fish can ever override it"
    - "A semantic network may store each fact at its top node only"
  answer: A
  explain: |
    Through inheritance, every concept below Fish receives its properties, so storing "has gills" once at Fish covers salmon, trout, and sharks. Storing each fact at the most general level where it holds saves effort, and specific nodes can still hold their own facts.
  why:
    B: "Specific nodes can hold their own facts, including ones that override an inherited default."
    C: "Inherited facts are defaults that a more specific fact can override, as with penguins and flying."
    D: "A fact belongs at the most general level where it holds, which is often below the top node, such as Animal."

- id: pt2-pr-10
  test: 2
  skill: kr-ml
  objective: PR5
  tier: champion
  type: scenario
  stem: |
    A hospital's assistant must read chest X-rays, and it must never suggest a drug that the patient is allergic to. Which design best fits both requirements?
  options:
    - "One neural network trained to handle both jobs from past records"
    - "A neural network for the X-rays plus an allergy rule that always applies"
    - "Hand-written IF-THEN rules for reading the X-rays and for allergies"
    - "A knowledge graph of drugs alone, with no model for the images"
  answer: B
  explain: |
    Reading images is a job for a learned model, since no one could write rules for every pattern in an X-ray. The allergy requirement is a hard constraint, which an explicit rule can guarantee and show to an auditor. Combining the two is neuro-symbolic AI.
  why:
    A: "A learned model might pick up the allergy pattern, but nothing guarantees that it will always follow it."
    C: "Rules cannot practically describe every pattern in raw image pixels."
    D: "A drug graph could support the allergy check, but it cannot read the X-rays."

# ================================================================ Test 3
- id: pt3-pr-01
  test: 3
  skill: chaining
  objective: PR1
  tier: competitive
  type: scenario
  stem: |
    A plant-care assistant uses forward chaining with three rules:

    ```text
    R1: IF the leaves are yellow AND the soil is wet THEN the plant is overwatered
    R2: IF the plant is overwatered THEN reduce watering
    R3: IF the leaves have spots THEN check for fungus
    ```

    The known facts are "the leaves are yellow" and "the soil is wet." What does the assistant conclude?
  options:
    - "The plant is overwatered, and nothing more"
    - "The plant is overwatered, so reduce watering"
    - "Overwatered, reduce watering, and check for fungus"
    - "Nothing, until a goal is given to work toward"
  answer: B
  explain: |
    Forward chaining fires every rule whose conditions hold. R1 fires on the two facts and adds "overwatered," which lets R2 fire and add "reduce watering." R3 never fires, because no fact says the leaves have spots.
  why:
    A: "Forward chaining keeps going: the new fact that the plant is overwatered triggers R2."
    C: "R3 needs spots on the leaves, which is not a known fact."
    D: "Waiting for a goal describes backward chaining; forward chaining starts from the facts."

- id: pt3-pr-02
  test: 3
  skill: inference-rules
  objective: PR1
  tier: core
  type: concept
  stem: |
    A robot's knowledge base holds the rule $$\forall x\, (\text{Robot}(x) \rightarrow \text{NeedsPower}(x))$$ and the fact Robot(R2). Which new fact can it infer?
  options:
    - "Robot(x) for every object x"
    - "NeedsPower(x), with x left as a variable"
    - "Nothing, because the rule never names R2"
    - "NeedsPower(R2)"
  answer: D
  explain: |
    The rule holds for every x, so it holds for R2 in particular: if R2 is a robot, R2 needs power. Since Robot(R2) is a fact, modus ponens gives NeedsPower(R2). Applying general rules to specific facts this way is how predicate logic lets an AI system derive new knowledge.
  why:
    A: "Nothing in the rule makes everything a robot."
    B: "Inference replaces the variable with the specific constant, R2; a conclusion with a free variable says nothing definite."
    C: "A rule that holds for all x applies to every object, including R2, without naming it."

- id: pt3-pr-03
  test: 3
  skill: fol-syntax
  objective: PR2
  tier: competitive
  type: concept
  stem: |
    Using the function MotherOf(x) and the predicate Loves(x, y), meaning "x loves y," which sentence says "Iris's mother loves Iris"?
  options:
    - "Loves(MotherOf(Iris), Iris)"
    - "Loves(Iris, MotherOf(Iris))"
    - "MotherOf(Loves(Iris, Iris))"
    - "Loves(MotherOf, Iris)"
  answer: A
  explain: |
    MotherOf(Iris) is a term that names an object, Iris's mother, so it can fill the first argument of Loves. The sentence then says that Iris's mother loves Iris.
  why:
    B: "The arguments are reversed: this says that Iris loves Iris's mother."
    C: "A function takes objects, not true-or-false statements, so it cannot wrap a predicate."
    D: "MotherOf needs its argument; on its own it names no one."

- id: pt3-pr-04
  test: 3
  skill: fol-translate
  objective: PR2
  tier: core
  type: concept
  stem: |
    Which sentence says "Some drones are waterproof"?
  options:
    - "$$\\exists x\\, (\\text{Drone}(x) \\land \\text{Waterproof}(x))$$"
    - "$$\\forall x\\, (\\text{Drone}(x) \\rightarrow \\text{Waterproof}(x))$$"
    - "$$\\exists x\\, (\\text{Drone}(x) \\rightarrow \\text{Waterproof}(x))$$"
    - "$$\\forall x\\, (\\text{Drone}(x) \\land \\text{Waterproof}(x))$$"
  answer: A
  explain: |
    There exists an x that is a drone and is waterproof. An existential pairs with AND, because it needs one thing that has both properties.
  why:
    B: "This says every drone is waterproof, much stronger than some."
    C: "Pairing the existential with an implication makes the sentence true as soon as anything is not a drone."
    D: "Pairing the universal with AND says everything is a waterproof drone."

- id: pt3-pr-05
  test: 3
  skill: logic-vs-prob
  objective: PR3
  tier: competitive
  type: scenario
  stem: |
    A help-desk system has an IF-THEN rule for every error code its designers knew about. A customer reports a new error code, and the system has no answer at all. Which weakness of logic-based reasoning does this show?
  options:
    - "It needs far too much labeled training data"
    - "It gives answers that are too uncertain to use"
    - "It always runs too slowly to answer customers"
    - "It is brittle with cases its rules do not cover"
  answer: D
  explain: |
    A logic-based system works only as far as its rules reach. A case that no rule anticipated leaves it stuck, a weakness called brittleness. Probability-based reasoning handles incomplete information more gracefully.
  why:
    A: "Rule-based systems are written by people rather than trained on labeled data."
    B: "Logic gives certain answers when its rules apply; the problem here is that no rule applies."
    C: "Speed is not the issue; the system lacks a rule for the new case."

- id: pt3-pr-06
  test: 3
  skill: bayes-reasoning
  objective: PR3
  tier: champion
  type: calculation
  stem: |
    After a first survey, a geologist puts the chance that a site holds oil at 30 percent. A second, independent survey then comes back positive. Such surveys are positive at 90 percent of oil sites and at 10 percent of dry sites. What is the updated chance that the site holds oil, to the nearest percent?
  options:
    - "27%"
    - "30%"
    - "79%"
    - "90%"
  ordered: true
  answer: C
  explain: |
    The result of the first survey, 30 percent, is now the prior. Oil and a positive survey: 0.3 × 0.9 = 0.27. Dry and a positive survey: 0.7 × 0.1 = 0.07. So P(oil given positive) = 0.27 / (0.27 + 0.07) = 0.27 / 0.34, about 79%.
  why:
    A: "27% is the chance of oil and a positive survey together; it still needs dividing by the chance of a positive survey."
    B: "30% is the prior, before the second survey is taken into account."
    D: "90% is the chance of a positive survey given oil, the reverse of what was asked."
  verify: "0.3 * 0.9 / (0.3 * 0.9 + 0.7 * 0.1) * 100"

- id: pt3-pr-07
  test: 3
  skill: bn-structure
  objective: PR4
  tier: competitive
  type: concept
  stem: |
    A tourism network has the edges Summer → HeavyRain, Summer → Tourists, HeavyRain → Flooding, HeavyRain → Traffic, and Tourists → Traffic. All variables are true or false. Which node needs the largest conditional probability table?
  options:
    - "Summer"
    - "Traffic"
    - "HeavyRain"
    - "Flooding"
  answer: B
  explain: |
    A node's table needs one row for each combination of its parents' values. Traffic has two parents, HeavyRain and Tourists, so it needs 4 rows. HeavyRain, Tourists, and Flooding each have one parent and need 2 rows, and Summer, a root, needs only its prior.
  why:
    A: "Summer is a root node, so its table holds only its prior."
    C: "HeavyRain has two children but only one parent, and a table's size depends on parents, not children."
    D: "Flooding has one parent, so its table has just 2 rows."

- id: pt3-pr-08
  test: 3
  skill: bn-inference
  objective: PR4
  tier: champion
  type: calculation
  stem: |
    In a network Flood → RoadClosed, $$P(\text{Flood}) = 0.25$$. The road is closed with probability 0.9 during a flood and 0.3 otherwise. The road is closed. What is the probability of a flood?
  options:
    - "22.5%"
    - "25%"
    - "50%"
    - "90%"
  ordered: true
  answer: C
  explain: |
    Flood and closed: 0.25 × 0.9 = 0.225. No flood and closed: 0.75 × 0.3 = 0.225. The road is closed with probability 0.45 in all, so P(flood given closed) = 0.225 / 0.45 = 50%. This is diagnostic reasoning, from an effect back to its cause.
  why:
    A: "22.5% is the chance of a flood and a closed road together, before dividing by the chance of a closed road."
    B: "25% is the prior, before the closed road is taken into account."
    D: "90% is the chance the road is closed given a flood, the reverse of what was asked."
  verify: "0.25 * 0.9 / (0.25 * 0.9 + 0.75 * 0.3) * 100"

- id: pt3-pr-09
  test: 3
  skill: kg-ontology
  objective: PR5
  tier: core
  type: concept
  stem: |
    A sports ontology defines the class Team and the property coachedBy. A specific team, the Riverside Hawks, appears in the data. In ontology terms, what is the Riverside Hawks?
  options:
    - "An individual"
    - "A class"
    - "A property"
    - "A rule"
  answer: A
  explain: |
    Ontologies describe classes (kinds of things, such as Team), properties (relationships and attributes, such as coachedBy), and individuals (specific things). The Riverside Hawks is one specific team, so it is an individual of the class Team.
  why:
    B: "Team is the class; the Riverside Hawks is one member of it."
    C: "coachedBy is the property that links a team to its coach."
    D: "Rules constrain or infer facts, such as one saying every team has a coach; a team is not a rule."

- id: pt3-pr-10
  test: 3
  skill: search-basics
  objective: PR5
  tier: competitive
  type: visual
  stem: |
    A backup program visits the folders in the tree below depth-first, taking subfolders from left to right. In what order does it visit them?
  figure:
    type: tree
    caption: A folder tree, with subfolders listed from left to right.
    root:
      label: Root
      children:
        - label: Docs
          children:
            - { label: School }
        - { label: Music }
        - label: Photos
          children:
            - { label: Trips }
            - { label: Pets }
  options:
    - "Root, Docs, Music, Photos, School, Trips, Pets"
    - "Root, Docs, School, Music, Photos, Trips, Pets"
    - "Root, Photos, Pets, Trips, Music, Docs, School"
    - "School, Docs, Music, Trips, Pets, Photos, Root"
  answer: B
  explain: |
    Depth-first search follows each branch to its end before backing up: Root, then Docs and its subfolder School, then Music, then Photos with Trips and Pets.
  why:
    A: "Visiting the folders level by level is breadth-first search."
    C: "This is depth-first, but it takes subfolders from right to left."
    D: "This lists each folder after the folders inside it, but the search visits Root first."
  verify: |
    tree = {"Root": ["Docs", "Music", "Photos"], "Docs": ["School"], "Music": [], "Photos": ["Trips", "Pets"], "School": [], "Trips": [], "Pets": []}
    order, stack = [], ["Root"]
    while stack:
        n = stack.pop()
        order.append(n)
        stack.extend(reversed(tree[n]))
    ans = ", ".join(order)

# ================================================================ Test 4
- id: pt4-pr-01
  test: 4
  skill: prop-logic
  objective: PR1
  tier: core
  type: concept
  stem: |
    Let F mean "the forecast says frost" and C mean "the farmer covers the crops." Which expression says "If the forecast says frost, the farmer covers the crops"?
  options:
    - "$$F \\land C$$"
    - "$$F \\lor C$$"
    - "$$C \\rightarrow F$$"
    - "$$F \\rightarrow C$$"
  answer: D
  explain: |
    An if-then sentence becomes an implication, with the condition on the left: F implies C. It promises that a frost forecast leads to covered crops, and it says nothing about what happens when no frost is forecast.
  why:
    A: "AND claims both are true right now, not that one leads to the other."
    B: "OR is true whenever either part is, which loses the if-then link."
    C: "This reverses the direction, giving the converse: if the crops are covered, frost was forecast."

- id: pt4-pr-02
  test: 4
  skill: inference-rules
  objective: PR1
  tier: champion
  type: concept
  stem: |
    Unification looks for a substitution for variables that makes two expressions identical. Which pair has no unifying substitution?
  options:
    - "Visits(x, Museum) and Visits(Ana, Museum)"
    - "Visits(Ana, x) and Visits(Ben, Museum)"
    - "Visits(x, y) and Visits(Ana, Museum)"
    - "Visits(Ana, x) and Visits(y, Museum)"
  answer: B
  explain: |
    Only variables can be replaced. In this pair, the first arguments are two different constants, Ana and Ben, and no substitution can make them match. The others unify: the first with x = Ana, the third with x = Ana and y = Museum, and the fourth with y = Ana and x = Museum.
  why:
    A: "Setting x to Ana makes the two expressions identical."
    C: "Setting x to Ana and y to Museum makes them identical."
    D: "Setting y to Ana and x to Museum makes them identical."

- id: pt4-pr-03
  test: 4
  skill: fol-negation
  objective: PR2
  tier: competitive
  type: concept
  stem: |
    What is the negation of "Every student has some class they enjoy"?
  options:
    - "No student enjoys any of their classes"
    - "Some student enjoys none of their classes"
    - "Every student dislikes at least one class"
    - "Some student enjoys every one of their classes"
  answer: B
  explain: |
    Negating "every student" gives "some student," and negating "has some class they enjoy" gives "enjoys none of their classes." In symbols, the negation of "for all x, there exists y" begins "there exists x such that for all y, not."
  why:
    A: "This is far stronger: it says every student enjoys nothing, when one such student is enough."
    C: "This keeps every student and changes only the inner part, so it is not a negation."
    D: "This is not a negation at all; it fits comfortably with the original claim."

- id: pt4-pr-04
  test: 4
  skill: fol-translate
  objective: PR2
  tier: competitive
  type: concept
  stem: |
    Let Likes(x, y) mean "x likes y." Which sentence says "Keisha likes every dog"?
  options:
    - "$$\\forall x\\, (\\text{Dog}(x) \\rightarrow \\text{Likes}(\\text{Keisha}, x))$$"
    - "$$\\forall x\\, (\\text{Dog}(x) \\land \\text{Likes}(\\text{Keisha}, x))$$"
    - "$$\\exists x\\, (\\text{Dog}(x) \\land \\text{Likes}(\\text{Keisha}, x))$$"
    - "$$\\forall x\\, (\\text{Likes}(\\text{Keisha}, x) \\rightarrow \\text{Dog}(x))$$"
  answer: A
  explain: |
    For every x, if x is a dog, then Keisha likes x. Keisha is a constant inside the predicate, and the universal pairs with an implication.
  why:
    B: "Pairing the universal with AND says everything is a dog."
    C: "This says only that Keisha likes at least one dog."
    D: "This reverses the implication: it says everything Keisha likes is a dog."

- id: pt4-pr-05
  test: 4
  skill: logic-vs-prob
  objective: PR3
  tier: core
  type: concept
  stem: |
    In classical logic-based reasoning, what values can a statement take?
  options:
    - "Any number from 0 to 1"
    - "Only true or false"
    - "A degree of membership in a vague category"
    - "True, false, or probably true"
  answer: B
  explain: |
    Classical logic is two-valued: every statement is either true or false, with nothing in between. Degrees of belief between 0 and 1 belong to probability, and degrees of membership belong to fuzzy logic.
  why:
    A: "Values from 0 to 1 are degrees of belief, used in probability-based reasoning."
    C: "Degrees of membership in vague categories belong to fuzzy logic."
    D: "Classical logic has no probably; that is the gap probability fills."

- id: pt4-pr-06
  test: 4
  skill: reasoning-types
  objective: PR3
  tier: competitive
  type: scenario
  stem: |
    A game character must find a short path through a large maze, using the straight-line distance to the exit to decide which way looks most promising. Which kind of reasoning problem, and which approach, is this?
  options:
    - "Classification, with a decision tree"
    - "Logical deduction, with IF-THEN rules"
    - "Heuristic search, such as A*"
    - "Statistical inference, with a Bayesian network"
  answer: C
  explain: |
    Finding a good path through a large space, guided by an estimate of the distance left, is heuristic search. A* combines that estimate with the cost already paid to find a short path.
  why:
    A: "Classification assigns a category; the task here is to find a path."
    B: "No rules deduce the path directly; the maze has to be searched."
    D: "Statistical inference weighs uncertain evidence, but the maze itself is fully known."

- id: pt4-pr-07
  test: 4
  skill: bn-joint
  objective: PR4
  tier: competitive
  type: calculation
  stem: |
    A weather model tracks six true-or-false variables. If it stored their full joint distribution directly, with no Bayesian network, how many independent probabilities would it need?
  options:
    - "6"
    - "12"
    - "63"
    - "64"
  ordered: true
  answer: C
  explain: |
    Six true-or-false variables have $$2^6 = 64$$ combinations. The probabilities must add up to 1, so the last one is fixed by the others, leaving 64 minus 1 = 63 independent numbers.
  why:
    A: "6 gives one number per variable, which ignores the combinations."
    B: "12 gives two numbers per variable, which still ignores the combinations."
    D: "64 forgets that the probabilities must add up to 1, which fixes the last one."
  verify: "2 ** 6 - 1"

- id: pt4-pr-08
  test: 4
  skill: bn-independence
  objective: PR4
  tier: champion
  type: scenario
  stem: |
    A car will not start if its battery is dead or its fuel tank is empty, and the two faults happen independently. The car will not start, and then you find that the tank is empty. What happens to the probability that the battery is also dead?
  options:
    - "It goes down, because the empty tank already explains the problem"
    - "It goes up, because two faults often happen together"
    - "It stays the same, because the two faults are independent"
    - "It becomes zero, because only one fault can be true at once"
  answer: A
  explain: |
    Battery and Tank are both parents of WontStart, a collider, and they are independent until the effect is observed. Once the car fails to start, finding one cause, the empty tank, accounts for the failure and makes the other cause less likely. This is called explaining away.
  why:
    B: "The faults happen independently, and finding one makes the other less needed as an explanation, not more likely."
    C: "They are independent before the effect is known, but observing that the car will not start links them."
    D: "Both faults can happen at once; the probability falls but does not reach zero."

- id: pt4-pr-09
  test: 4
  skill: chaining
  objective: PR5
  tier: core
  type: concept
  stem: |
    In building an expert system, who interviews human experts and turns their know-how into IF-THEN rules?
  options:
    - "Data engineers"
    - "Machine learning engineers"
    - "The inference engine"
    - "Knowledge engineers"
  answer: D
  explain: |
    Knowledge engineers interview specialists and encode what they know as rules in the knowledge base. The slowness of this work is called the knowledge acquisition bottleneck.
  why:
    A: "Data engineers build data pipelines and infrastructure, not rule bases from interviews."
    B: "Machine learning engineers deploy and monitor trained models."
    C: "The inference engine is the part of the program that applies the rules, not a person who writes them."

- id: pt4-pr-10
  test: 4
  skill: big-ideas
  objective: PR5
  tier: competitive
  type: concept
  stem: |
    How does a car's radar sensor measure the distance to the vehicle ahead?
  options:
    - "It sends radio waves and measures their reflections"
    - "It sends laser pulses and measures their reflections"
    - "It compares the images from two side-by-side cameras"
    - "It times signals from several satellites overhead"
  answer: A
  explain: |
    Radar sends out radio waves and measures the reflections that bounce back, which give distance and speed. Lidar works the same way with laser light, and radar keeps working in fog and rain, one reason self-driving cars combine both.
  why:
    B: "Laser pulses are what lidar uses."
    C: "Comparing two camera views judges depth from images, which is not how radar works."
    D: "Timing satellite signals is how GPS finds a position on Earth."

