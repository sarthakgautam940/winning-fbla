- id: pt5-pr-04
  test: 5
  skill: fol-negation
  objective: PR2
  tier: core
  type: concept
  stem: |
    Which statement means the same as "Not every student was late"?
  options:
    - "Not a single student was late"
    - "At least one student was not late"
    - "Some students were late and some were not"
    - "At least one of the students was late"
  answer: B
  explain: |
    "Not every student was late" says the claim "all students were late" fails, so at least one student was not late. In symbols, the negation of "for all x, P(x)" is "there exists x such that not P(x)."
  why:
    A: "This is far stronger; not every allows some students to be late."
    C: "Logically, not every does not promise that anyone was late; it says only that at least one student was not."
    D: "This drops the negation; it could be true even if every student was late."

- id: pt5-pr-05
  test: 5
  skill: bayes-reasoning
  objective: PR3
  tier: competitive
  type: calculation
  stem: |
    A mechanic thinks there is a 40 percent chance that a car's noise comes from worn brakes. A squeal when braking occurs in 60 percent of worn-brake cases and in 20 percent of other cases. The car squeals when braking. What is the updated probability that the brakes are worn, to the nearest hundredth?
  options:
    - "0.24"
    - "0.4"
    - "0.67"
    - "0.8"
  ordered: true
  answer: C
  explain: |
    Worn brakes and a squeal: 0.4 × 0.6 = 0.24. Another cause and a squeal: 0.6 × 0.2 = 0.12. A squeal happens with probability 0.36 in all, so P(worn given squeal) = 0.24 / 0.36, about 0.67.
  why:
    A: "0.24 is the chance of worn brakes and a squeal together, before dividing by the chance of a squeal."
    B: "0.4 is the prior, before the squeal is taken into account."
    D: "0.8 is the chance that a car without worn brakes does not squeal, which is not what was asked."
  verify: "0.4 * 0.6 / (0.4 * 0.6 + 0.6 * 0.2)"

- id: pt5-pr-06
  test: 5
  skill: logic-vs-prob
  objective: PR3
  tier: champion
  type: scenario
  stem: |
    A warehouse robot must never enter an aisle marked for people, and it must judge from noisy sensor readings whether the object ahead is a box or a person. Which combination of reasoning fits best?
  options:
    - "Logic for both, so every decision is certain"
    - "Probability for both, including the aisle ban"
    - "Fuzzy logic for both, so each rule holds by degree"
    - "Logic for the aisle ban, probability for the object ahead"
  answer: D
  explain: |
    The aisle ban is an exact rule that must always hold, so logic can guarantee and explain it. Telling a box from a person in noisy readings is uncertain, so it calls for probability-based reasoning. Many real systems combine the two in this way.
  why:
    A: "Noisy sensor readings cannot give certain answers, so logic alone is brittle for judging the object."
    B: "A ban that must always hold should be guaranteed by a rule, not left to a probability."
    C: "Fuzzy logic describes vague categories, not uncertainty about what an object is."

- id: pt5-pr-07
  test: 5
  skill: bn-structure
  objective: PR4
  tier: competitive
  type: concept
  stem: |
    A Bayesian network has the edges Storm → PowerOutage and PowerOutage → SpoiledFood. A designer adds the edge SpoiledFood → Storm. What is wrong with the new graph?
  options:
    - "It contains a directed cycle, so it is no longer a DAG"
    - "Edges must always point from effects back to causes"
    - "A Bayesian network may have at most two edges"
    - "SpoiledFood can no longer have a prior probability"
  answer: A
  explain: |
    Following the arrows from Storm to PowerOutage to SpoiledFood and back to Storm returns to the start, a directed cycle. A Bayesian network must be a directed acyclic graph, because with a cycle its tables no longer define one consistent joint distribution.
  why:
    B: "Edges point from causes to effects; the problem is that this edge closes a cycle."
    C: "A Bayesian network can have any number of edges, as long as there are no directed cycles."
    D: "SpoiledFood already has a parent, so its table was never just a prior; the problem is the cycle."

- id: pt5-pr-08
  test: 5
  skill: bn-joint
  objective: PR4
  tier: champion
  type: calculation
  stem: |
    A coach's network has the edge Trained → Won, with $$P(\text{Trained}) = 0.6$$. The team wins with probability 0.7 when it trained and 0.2 when it did not. What is the overall probability that the team wins?
  options:
    - "0.08"
    - "0.42"
    - "0.45"
    - "0.5"
  ordered: true
  answer: D
  explain: |
    Add the two ways to win, each weighted by its probability: trained and won, 0.6 × 0.7 = 0.42; did not train and won, 0.4 × 0.2 = 0.08. So P(Won) = 0.42 + 0.08 = 0.50. Adding over both values of the parent gives the overall probability.
  why:
    A: "0.08 counts only the wins without training."
    B: "0.42 counts only the wins with training."
    C: "0.45 averages 0.7 and 0.2 without weighting them by how often the team trains."
  verify: "0.6 * 0.7 + 0.4 * 0.2"

- id: pt5-pr-09
  test: 5
  skill: kr-forms
  objective: PR5
