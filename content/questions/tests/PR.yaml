    C: "Truck also has no children, so it is a leaf too, even though it sits higher in the tree."
    D: "Car has children, so it is not a leaf; Truck is."

- id: pt5-pr-10
  test: 5
  skill: kg-ontology
  objective: PR5
  tier: competitive
  type: concept
  stem: |
    To find the city where a film's director was born, a knowledge graph follows two links: from the film to its director, then from the director to a city. How would a relational database usually answer the same question?
  options:
    - "By joining tables on matching key columns"
    - "By following labeled edges from node to node"
    - "By training a model to predict the city"
    - "By sorting the film table alphabetically"
  answer: A
  explain: |
    A knowledge graph answers a multi-hop question by walking along its links. A relational database stores the same facts in tables, so it connects them with a join on matching keys, such as a director ID that appears in both the films table and the people table.
  why:
    B: "Following edges is how the knowledge graph does it; a relational database stores tables, not edges."
    C: "The facts are already stored, so nothing needs to be predicted."
    D: "Sorting reorders rows but cannot connect a film to where its director was born."
