# ================================================================ Test 1
- id: pt1-pr-01
  test: 1
  skill: prop-logic
  objective: PR1
  tier: core
  type: concept
  stem: |
    A lab door unlocks exactly when two things are true: the person's badge is valid, and the person's fingerprint matches. Let B mean "the badge is valid" and F mean "the fingerprint matches." Which expression is true exactly when the door unlocks?
  options:
    - "$$B \\land F$$"
    - "$$B \\lor F$$"
    - "$$B \\rightarrow F$$"
    - "$$B \\leftrightarrow F$$"
  answer: A
  explain: |
    The door needs both conditions, so the expression must be true only when B and F are both true, which is B AND F. An OR would also open the door for a valid badge with the wrong fingerprint.
  why:
    B: "OR is true when either condition holds, so a valid badge alone would open the door."
    C: "B implies F is also true whenever the badge is invalid, so it would open the door for anyone without a valid badge."
    D: "The biconditional is also true when both are false, which would open the door for someone with neither."
  verify: |
    rows = [(b, f) for b in (True, False) for f in (True, False)]
    target = [b and f for b, f in rows]
    cands = {r"B \land F": [b and f for b, f in rows], r"B \lor F": [b or f for b, f in rows], r"B \rightarrow F": [(not b) or f for b, f in rows], r"B \leftrightarrow F": [b == f for b, f in rows]}
    ans = [k for k, v in cands.items() if v == target][0]

- id: pt1-pr-02
  test: 1
  skill: inference-rules
  objective: PR1
  tier: competitive
  type: concept
  stem: |
    If the server is overloaded, pages load slowly. Pages are loading quickly. Therefore, the server is not overloaded. Which rule of inference does this argument use?
  options:
    - "Modus ponens"
    - "Modus tollens"
    - "Affirming the consequent"
    - "Denying the antecedent"
  answer: B
  explain: |
    Modus tollens has the form: if P then Q; not Q; therefore not P. Here P is "the server is overloaded" and Q is "pages load slowly." The argument is valid, because an overloaded server would have made the pages slow.
  why:
    A: "Modus ponens affirms the condition to reach the result: if P then Q, P, therefore Q."
    C: "Affirming the consequent reasons from Q to P, a fallacy; this argument reasons from not Q to not P."
    D: "Denying the antecedent reasons from not P to not Q, a fallacy; this argument denies the result, not the condition."

- id: pt1-pr-03
  test: 1
  skill: fol-translate
  objective: PR2
  tier: competitive
  type: concept
  stem: |
    Which sentence says "Every ticket is either paid or refunded"?
  options:
    - "$$\\forall x\\, (\\text{Ticket}(x) \\land (\\text{Paid}(x) \\lor \\text{Refunded}(x)))$$"
    - "$$\\exists x\\, (\\text{Ticket}(x) \\land (\\text{Paid}(x) \\lor \\text{Refunded}(x)))$$"
    - "$$\\forall x\\, (\\text{Ticket}(x) \\rightarrow \\text{Paid}(x)) \\lor \\forall x\\, (\\text{Ticket}(x) \\rightarrow \\text{Refunded}(x))$$"
    - "$$\\forall x\\, (\\text{Ticket}(x) \\rightarrow (\\text{Paid}(x) \\lor \\text{Refunded}(x)))$$"
  answer: D
  explain: |
    For every x, if x is a ticket, then x is paid or refunded. The universal pairs with an implication, and the OR sits inside it, so each ticket may be paid or refunded on its own.
  why:
    A: "Pairing the universal with AND claims that everything is a ticket."
    B: "The existential says only that at least one ticket is paid or refunded."
    C: "This says either every ticket is paid or every ticket is refunded, which is false when some are paid and others refunded."

- id: pt1-pr-04
  test: 1
  skill: fol-negation
  objective: PR2
  tier: core
  type: concept
  stem: |
    To prove the claim "Every package arrived on time" false, what is the least you need to find out?
  options:
    - "Every package arrived late"
    - "Some package arrived on time"
    - "One package did not arrive on time"
    - "Most packages arrived late"
  answer: C
  explain: |
    A claim about every package fails as soon as one package breaks it, so a single package that did not arrive on time is enough. This is why the negation of "every package arrived on time" is "at least one package did not arrive on time."
  why:
    A: "This would also prove the claim false, but it is far more than you need; one late package is enough."
    B: "A package that arrived on time fits the claim, so it proves nothing against it."
    D: "This would also disprove the claim, but it asks for much more than the single late package that is enough."

- id: pt1-pr-05
  test: 1
  skill: logic-vs-prob
  objective: PR3
  tier: competitive
  type: concept
  stem: |
    A team builds two tools to diagnose faults in a factory's machines: one logic-based and one probability-based. What does each tool mainly need from the team?
  options:
    - "Both need nothing but a large set of labeled training examples"
    - "Logic needs rules written by people; probability needs estimates from data or experts"
    - "Logic needs estimates from data or experts; probability needs rules written by people"
    - "Both need nothing but a list of the questions users will ask"
  answer: B
  explain: |
    A logic-based system runs on exact rules that people write. A probability-based system needs probabilities, estimated from data or supplied by experts, which it then updates as evidence arrives.
  why:
    A: "Neither approach is defined by labeled training examples; that describes supervised machine learning."
    C: "This swaps the two: rules drive logic, and estimated probabilities drive probabilistic reasoning."
    D: "Both need real knowledge of the machines, not just a list of questions."

- id: pt1-pr-06
  test: 1
  skill: bayes-reasoning
  objective: PR3
  tier: core
  type: calculation
  stem: |
    Over 200 school mornings, it snowed on 50. The bus was late on 30 of the snowy mornings and on 10 of the other 150. The bus is late this morning. Based on these counts, what is the probability that it snowed?
  options:
    - "15%"
    - "25%"
    - "60%"
    - "75%"
  ordered: true
  answer: D
  explain: |
    Count only the late mornings: 30 snowy plus 10 others, 40 in all. Of those 40, 30 had snow, so the probability is 30 / 40 = 75%. Narrowing to the mornings that match the evidence and then counting is Bayes' rule in natural frequencies.
  why:
    A: "15% is 30 of all 200 mornings, the chance of snow and a late bus together."
    B: "25% is the prior, 50 snowy mornings out of 200, before the late bus is taken into account."
    C: "60% is 30 of the 50 snowy mornings, the chance of a late bus given snow, the reverse of what was asked."
  verify: "30 / (30 + 10) * 100"

- id: pt1-pr-07
  test: 1
  skill: bn-structure
  objective: PR4
  tier: competitive
  type: concept
  stem: |
    Ice on a road makes crashes more likely, and crashes cause traffic jams. Which edges should a Bayesian network with the variables Ice, Crash, and Jam use?
  options:
    - "Ice → Crash and Crash → Jam"
    - "Jam → Crash and Crash → Ice"
    - "Ice → Jam and Jam → Crash"
    - "Ice → Crash, Crash → Jam, and Jam → Ice"
  answer: A
  explain: |
    Edges point from cause to effect: ice influences crashes, and crashes influence jams, giving the chain Ice → Crash → Jam.
  why:
    B: "These edges run from effects back to causes."
    C: "Ice affects jams through crashes, and jams do not cause crashes."
    D: "Adding Jam → Ice closes a directed cycle, which a Bayesian network cannot contain."

- id: pt1-pr-08
  test: 1
  skill: bn-joint
  objective: PR4
  tier: champion
  type: calculation
  stem: |
    In a greenhouse network, LowWater, HighHeat, and Pests each point to Wilting, and Wilting points to LowYield. All five variables are true or false. How many independent probabilities do the network's tables need in total?
  options:
    - "5"
    - "8"
    - "13"
    - "31"
  ordered: true
  answer: C
  explain: |
    Each of the three roots needs 1 number, its prior, for 3 in all. Wilting has three true-or-false parents, so its table needs one probability for each of the $$2^3 = 8$$ parent combinations. LowYield has one parent, so it needs 2. The total is 3 + 8 + 2 = 13, far fewer than the 31 a full joint table would need.
  why:
    A: "5 gives each variable a single number, ignoring that a node needs one probability for each combination of its parents."
    B: "8 is Wilting's table alone, or the total if Wilting got one number per parent instead of one per combination of parents."
    D: "31 is $$2^5 - 1$$, the size of a full joint table, which the network avoids."
  verify: "3 * 1 + 2 ** 3 + 2"

