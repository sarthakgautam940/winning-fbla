- id: pt5-pr-01
  test: 5
  skill: fol-syntax
  objective: PR1
  tier: champion
  type: concept
  stem: |
    Using the function FatherOf(x) and the predicate Doctor(x), which is a well-formed sentence saying that Maya's paternal grandfather is a doctor?
  options:
    - "Doctor(FatherOf(FatherOf(Maya)))"
    - "Doctor(FatherOf(Maya))"
    - "FatherOf(FatherOf(Doctor(Maya)))"
    - "Doctor(Maya) ∧ FatherOf(FatherOf(Maya))"
  answer: A
  explain: |
    FatherOf(Maya) names Maya's father, and applying the function again, FatherOf(FatherOf(Maya)), names that person's father, Maya's paternal grandfather. A function term names an object, so it can sit inside the predicate Doctor to make a statement.
  why:
    B: "This applies FatherOf once, so it says Maya's father is a doctor."
    C: "A function takes objects, not statements, so it cannot wrap the predicate Doctor."
    D: "A function term names an object and is not a statement, so it cannot be joined with AND."

- id: pt5-pr-02
  test: 5
  skill: prop-logic
  objective: PR1
  tier: competitive
  type: concept
  stem: |
    A tautology is true in every row of its truth table. Which of these is a tautology?
  options:
    - "$$P \\land \\neg P$$"
    - "$$(P \\land Q) \\rightarrow P$$"
    - "$$P \\rightarrow (P \\land Q)$$"
    - "$$P \\lor Q$$"
  answer: B
  explain: |
    Whenever P and Q is true, P is true, so the implication can never have a true condition with a false result. It is true in all four rows. P and not P is the opposite, a contradiction, false in every row.
  why:
    A: "P and not P is false in every row, a contradiction."
    C: "With P true and Q false, the condition is true and the result is false, so it fails in that row."
    D: "P or Q is false in the row where both P and Q are false."
  verify: |
    rows = [(p, q) for p in (True, False) for q in (True, False)]
    cands = {r"P \land \neg P": [p and not p for p, q in rows], r"(P \land Q) \rightarrow P": [(not (p and q)) or p for p, q in rows], r"P \rightarrow (P \land Q)": [(not p) or (p and q) for p, q in rows], r"P \lor Q": [p or q for p, q in rows]}
    ans = [k for k, v in cands.items() if all(v)][0]

- id: pt5-pr-03
  test: 5
