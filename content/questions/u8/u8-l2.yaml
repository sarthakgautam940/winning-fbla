- id: bias-cases-13
  skill: bias-cases
  tier: champion
  type: concept
  use: bank
  stem: |
    Suresh and Guttag cite criminal-justice risk tools as an example of measurement bias. Why?
  options:
    - "They were trained on too few defendants to estimate risk reliably"
    - "They were tested only on defendants from a single county"
    - "They use arrests as a proxy for crime, which is measured differently across communities"
    - "They were later used to help decide sentence lengths, not just reoffending"
  answer: C
  explain: |
    Risk tools cannot observe crime directly, so they learn from arrests. Arrests depend on where and how policing happens, so the same behavior is recorded more often in some communities than in others, which is measurement bias.
  why:
    A: "Sample size is not the issue the framework names; the problem is what the label measures."
    B: "A narrow test set would be evaluation bias, not measurement bias."
    D: "Off-label use for sentencing is Suresh and Guttag's example of deployment bias, a different source."
