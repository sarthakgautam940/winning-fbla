    B: "Google Photos shows a harmful labeling error and a fix that only blocked labels."
    C: "Tay shows a chatbot manipulated by its users within a day of launch."

- id: bias-cases-12
  skill: bias-cases
  tier: competitive
  type: recall
  use: quiz
  stem: |
    Microsoft launched the Twitter chatbot Tay in March 2016 and took it offline within a day. What happened?
  options:
