- id: bias-cases-10
  skill: bias-cases
  tier: champion
  type: concept
  use: bank
  stem: |
    Gender Shades found that two common face benchmarks, IJB-A and Adience, were 79.6 and 86.2 percent lighter-skinned, so systems that scored well on them had rarely been tested on darker-skinned women. In Suresh and Guttag's framework, which source of bias do these benchmarks show?
  options:
    - "Historical bias"
    - "Representation bias"
    - "Deployment bias"
    - "Evaluation bias"
  answer: D
  explain: |
    Evaluation bias occurs when the benchmark used to test a model does not represent the people who will use it, so subgroup failures go unseen. Suresh and Guttag use exactly this example: darker-skinned women made up only 4.4 percent of IJB-A and 7.4 percent of Adience.
  why:
    A: "Historical bias is an unfair world captured in data; the issue here is an unrepresentative test set."
    B: "Representation bias concerns the sample used to build a model; an unrepresentative test benchmark is evaluation bias."
    C: "Deployment bias concerns how a model is used after it is built."

- id: bias-cases-11
  skill: bias-cases
  tier: core
  type: scenario
  use: quiz
  stem: |
    Which case is best known for showing how a convenient proxy target can create racial bias?
  options:
    - "Amazon's recruiting tool"
    - "Google Photos' image labels"
    - "Microsoft's Tay chatbot"
    - "A health-care risk algorithm"
  answer: D
