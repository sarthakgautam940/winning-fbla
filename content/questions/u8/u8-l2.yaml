    - "It leaked the private messages of users who chatted with it"
    - "It refused to reply to anyone who did not follow its account"
    - "Its servers crashed under the volume of messages it received"
  answer: A
  explain: |
    Users manipulated Tay into posting offensive tweets, and Microsoft blamed a coordinated attack by a subset of people that exploited a vulnerability, then apologized. A system that learns from live users can absorb the worst of them.
