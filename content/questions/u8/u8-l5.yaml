- id: privacy-tech-12
  skill: privacy-tech
  tier: champion
  type: concept
  use: bank
  stem: |
    Researchers introduced l-diversity in 2006 to fix a weakness of k-anonymity. What weakness?
  options:
    - "k-anonymity requires all data to be encrypted before it can be released"
    - "k-anonymity works only on tables that have fewer than k columns"
    - "k-anonymity cannot be computed by hand for tables with many records"
    - "Groups whose records share one sensitive value can still reveal it"
  answer: D
  explain: |
    k-anonymity hides which record belongs to whom, but if every record in a group has the same sensitive value, or an attacker has background knowledge, the value leaks anyway. l-diversity requires each group to contain several well-represented sensitive values.
  why:
    A: "k-anonymity uses generalization and suppression, not encryption."
    B: "k counts matching records, not columns."
    C: "Computing k is simple counting; the weakness is what the groups reveal."

