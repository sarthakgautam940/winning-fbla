- id: privacy-tech-14
  skill: privacy-tech
  tier: competitive
  type: concept
  use: bank
  stem: |
    Google's 2017 test of federated learning on its Gboard keyboard also used a Secure Aggregation protocol. What does secure aggregation add?
  options:
    - "Each phone's raw typing is encrypted and then uploaded for training"
    - "The model is trained only on phones that have opted in to share data"
    - "The server can see only the average of many phones' updates, not any single one"
    - "Noise is added to every word suggestion that appears on the keyboard"
