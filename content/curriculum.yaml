# ---------------------------------------------------------------------- SKILLS
# Each skill is one recognizable question type. `patterns` lists the variants
# the question bank must cover (like 1, 1b, 1c in a skill grid).
skills:
  # Unit 1 ---------------------------------------------------------------
  - id: ds-nature
    name: What data science is
    objectives: [DL1]
    patterns: ["Pick the best definition of data science", "Name the three disciplines it combines", "Recognize data science work in a scenario", "Order data, information, knowledge (DIKW)", "Define data literacy"]
  - id: ds-roles
    name: Data roles and teams
    objectives: [DL1]
    patterns: ["Match a task to a data analyst, data scientist, data engineer, or ML engineer", "Identify who builds pipelines or deploys models", "Recognize database administrator and data steward duties"]
  - id: ds-analytics
    name: The four kinds of analytics
    objectives: [DL1]
    patterns: ["Classify a question as descriptive, diagnostic, predictive, or prescriptive", "Order the four by complexity and value", "Distinguish data science from statistics, computer science, and BI"]
  - id: data-structure
