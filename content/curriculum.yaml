# Curriculum: the single source of truth for structure.
# Areas and objectives are quoted exactly from the 2026-2027 guidelines.
# Units follow learning order. Every skill belongs to exactly one lesson.
# Skill display numbers (1, 2, 3 ...) come from the order of `skills` across units.

areas:
  - id: DL
    name: Data Literacy and Foundations
    items: 20
    objectives:
      - { id: DL1, text: "Discuss the nature of data science" }
      - { id: DL2, text: "Describe differences between structured and unstructured data" }
      - { id: DL3, text: "Identify numeric and categorical data points" }
      - { id: DL4, text: "Convert among common data representations (e.g., binary, hexadecimal, decimal)" }
      - { id: DL5, text: "Describe the types of data that could be gathered from various sources" }
      - { id: DL6, text: "Describe the importance of data wrangling and transformation" }
      - { id: DL7, text: "Describe the stages of the data science process" }
  - id: PS
    name: Probability and Statistics Foundations
    items: 15
    objectives:
      - { id: PS1, text: "Calculate the mean, median, mode, and range of a dataset" }
      - { id: PS2, text: "Discuss the use of measures of statistical variance (e.g., standard deviation, variance, covariance)" }
      - { id: PS3, text: "Discuss the characteristics and importance of Gaussian (normal) distribution" }
      - { id: PS4, text: "Calculate the expected value of a random variable" }
      - { id: PS5, text: "Differentiate between types of variables (e.g., continuous, discrete)" }
  - id: DA
    name: Data Analysis and Statistics for AI
    items: 15
    objectives:
      - { id: DA1, text: "Select the most appropriate visual medium to display a dataset" }
      - { id: DA2, text: "Describe different types of diagrams (e.g., boxplots, histograms, scatterplots)" }
      - { id: DA3, text: "Discuss techniques for working with multivariate data (e.g., dependence and interdependence methods, multiple linear and logistic regression)" }
      - { id: DA4, text: "Discuss the importance of cleaning data" }
      - { id: DA5, text: "Identify factors that may affect data quality (e.g., duplicates, low quality sources, incomplete datasets)" }
      - { id: DA6, text: "Describe how data science algorithms are applied to real-world problems (e.g., linear regression, decision trees, k-means)" }
  - id: TL
    name: Tools for Data and AI
    items: 10
    objectives:
      - { id: TL1, text: "Write queries in SQL" }
      - { id: TL2, text: "Describe common packages and libraries for working with data and AI (e.g., Pandas, NumPy, PyTorch)" }
      - { id: TL3, text: "Discuss the use of Python for cleaning and wrangling datasets" }
      - { id: TL4, text: "Discuss the use of R for data science" }
      - { id: TL5, text: "Describe characteristics of relational databases" }
  - id: AI
    name: AI Basics
    items: 10
    objectives:
      - { id: AI1, text: "Discuss the nature of generative AI" }
      - { id: AI2, text: "Discuss capabilities and limitations of generative AI" }
      - { id: AI3, text: "List uses of generative AI (e.g., healthcare, research, digital art)" }
      - { id: AI4, text: "Describe AI subfields (e.g., computer vision, NLP, human interaction, robotics)" }
      - { id: AI5, text: "Define large language models (LLMs)" }
      - { id: AI6, text: "Discuss the capabilities of large language models (LLMs)" }
  - id: ML
    name: Machine Learning
    items: 10
    objectives:
      - { id: ML1, text: "Discuss the nature of machine learning" }
      - { id: ML2, text: "Describe the use of training, test, and validation datasets" }
      - { id: ML3, text: "Describe how machine learning algorithms behave (e.g., neural networks, decision trees, learning functions)" }
      - { id: ML4, text: "Characterize unsupervised, supervised, and reinforcement learning algorithms" }
      - { id: ML5, text: "Select an appropriate machine learning algorithm to solve a reasoning problem (e.g., supervised, unsupervised, reinforcement)" }
      - { id: ML6, text: "Explain the concept of deep learning" }
  - id: PR
    name: Perception, Representation, and Reasoning
    items: 10
    objectives:
      - { id: PR1, text: "Explain how predicate logic is used in AI models" }
      - { id: PR2, text: "Give examples of predicate logic" }
      - { id: PR3, text: "Discuss differences between logic-based and probability-based reasoning" }
      - { id: PR4, text: "Describe Bayesian networks and their components (e.g., nodes, edges, Directed Acyclic Graphs)" }
      - { id: PR5, text: "Discuss the nature of knowledge representation and reasoning for AI" }
  - id: PE
    name: Privacy and Ethics
    items: 10
    objectives:
      - { id: PE1, text: "Discuss dilemmas that arise from AI systems (e.g., self-driving vehicles, generative AI, surveillance)" }
      - { id: PE2, text: "Describe how AI inherits bias (e.g., algorithmic bias)" }
      - { id: PE3, text: "Discuss security and privacy risks associated with LLMs" }
      - { id: PE4, text: "Discuss credibility concerns of LLMs (e.g., hallucinations, misinformation)" }

units:
  # ------------------------------------------------------------------ UNIT 0
  - id: u0
    n: 0
    area: null
    title: How to Win the Test
    summary: The event, the scoring rules that decide ties, pacing at 30 seconds a question, elimination, and fast math without a personal calculator.
    lessons:
      - id: u0-l1
        n: 1
        title: The event and how it is scored
        summary: Format, scoring, tiebreakers, rules and the test-day checklist, and what they mean for how you prepare.
        minutes: 12
        skills: []
        objectives: []
        outline:
          - "What the test is: 100 questions, 50 minutes, eight areas"
          - "How you are scored, and how ties are broken"
          - "Rules and test-day checklist"
          - "What this means for your preparation"
          - "How this course is built (lessons, checks, quizzes, unit tests, practice tests)"
      - id: u0-l2
        n: 2
        title: Pacing, elimination, and smart guessing
        summary: A two-pass plan for 100 questions in 50 minutes, how to flag, when to submit, and how to eliminate and guess well.
        minutes: 15
        skills: []
        objectives: []
        outline:
          - "The 30-second average and why most questions take less"
          - "The two-pass method and flagging"
          - "When to submit (the time tiebreaker)"
          - "Elimination: how distractors are built"
          - "Reading stems: NOT, EXCEPT, BEST, MOST LIKELY"
          - "Never leave a blank"
      - id: u0-l3
        n: 3
        title: Fast math without your own calculator
        summary: Mental shortcuts and scratch-paper habits for means, medians, spread, z-scores, expected value, probability, base conversion and model metrics.
        minutes: 18
        skills: []
        objectives: []
        outline:
          - "Using the built-in online calculator efficiently"
          - "Laying out one sheet of scratch paper"
          - "Shortcuts for the mean and the median"
          - "Shortcuts for spread, z-scores and the empirical rule"
          - "Expected value and probability shortcuts"
          - "Powers of two and base conversion speed"
          - "Metrics from a confusion matrix in seconds"

  # ------------------------------------------------------------------ UNIT 1
  - id: u1
    n: 1
    area: DL
    title: Data Literacy and Foundations
    summary: What data science is, the kinds of data and how computers store them, where data comes from, wrangling, and the data science process.
    lessons:
      - id: u1-l1
        n: 1
        title: What data science is
        summary: The field, the people who do it, and the four kinds of analytics.
        minutes: 18
        skills: [ds-nature, ds-roles, ds-analytics]
        objectives: [DL1]
        vocab: [Data Science]
        outline:
          - "Data science in one sentence, and the three disciplines it combines"
          - "Data, information, knowledge, and data literacy"
          - "Who does the work: analysts, scientists, engineers, ML engineers [Competitive]"
          - "Descriptive, diagnostic, predictive, prescriptive analytics"
          - "Data science versus statistics, computer science, and business intelligence [Competitive]"
        notes: "Use the Drew Conway Venn diagram idea (math/statistics, hacking/computing, substantive domain expertise) as a figure. DIKW pyramid. Data literacy as the ability to read, work with, analyze and argue with data."
        figures: ["Three overlapping circles: statistics and math, computing, domain knowledge", "DIKW pyramid as a stepped diagram"]
      - id: u1-l2
        n: 2
        title: Structured, semi-structured, and unstructured data
        summary: How data is organized, the file formats you will meet, and metadata.
        minutes: 18
        skills: [data-structure, data-formats, metadata]
        objectives: [DL2]
        vocab: [Structured Data, Unstructured Data, CSV]
        outline:
          - "Structured data: rows, columns, and a schema"
          - "Unstructured data: text, images, audio, video"
          - "Semi-structured data: JSON, XML, logs [Competitive]"
          - "File formats side by side: CSV, TSV, JSON, XML, Parquet, spreadsheets, media files"
          - "Where each kind lives: databases, warehouses, lakes [Competitive]"
          - "Metadata and data dictionaries"
        notes: "Show the same record as CSV, JSON and XML. Parquet is columnar and compressed. Schema-on-write vs schema-on-read (Champion). Avoid quoting a precise percentage of unstructured data unless research/facts.md verifies it."
      - id: u1-l3
        n: 3
        title: Numeric and categorical data
        summary: Classify any data point instantly, including the trick cases test writers love.
        minutes: 20
        skills: [var-num-cat, var-disc-cont, var-levels]
        objectives: [DL3, PS5]
        vocab: [Numeric Data, Categorical Data]
        outline:
          - "Numeric versus categorical: the do-math test"
          - "Trick cases: ZIP codes, phone numbers, IDs, jersey numbers, ratings"
          - "Discrete versus continuous numbers"
          - "Nominal and ordinal categories"
          - "Levels of measurement: nominal, ordinal, interval, ratio [Competitive]"
          - "Which summaries fit which level [Champion]"
        notes: "Temperature in Celsius is interval; Kelvin is ratio. Binary yes/no is categorical. Likert scale is ordinal. Counts are discrete. Mode for nominal, median for ordinal, mean for interval/ratio."
      - id: u1-l4
        n: 4
        title: Number systems
        summary: Binary, hexadecimal, octal and decimal, converted in every direction quickly and correctly.
        minutes: 25
        skills: [base-binary, base-hex, base-other]
        objectives: [DL4]
        outline:
          - "Place value in any base"
          - "Binary to decimal"
          - "Decimal to binary: two methods"
          - "Hexadecimal: digits A to F, and the nibble trick"
          - "Octal and the three-bit trick [Competitive]"
          - "Spotting invalid digits and comparing across bases [Champion]"
        widgets: [base-converter]
        notes: "Memorize powers of 2 through 2^10 and 2^16. Prefixes 0b, 0x, 0o and subscripts. FF = 255. Worked examples in numbered steps for each direction."
      - id: u1-l5
        n: 5
        title: How computers store data
        summary: Bits and bytes, storage units, signed numbers, text encoding, colors, images and sound.
        minutes: 25
        skills: [bits-bytes, bin-arith, text-encoding, media-encoding]
        objectives: [DL4]
        outline:
          - "Bits, nibbles, bytes, and how many values n bits can hold"
          - "KB versus KiB: decimal and binary prefixes [Competitive]"
          - "Binary addition and overflow [Competitive]"
          - "Two's complement for negative numbers [Champion]"
          - "Text: ASCII, Unicode, and UTF-8"
          - "Colors: hex codes and RGB"
          - "Images and sound as numbers, and file-size math [Competitive]"
        notes: "2^n values, max 2^n - 1. Bits needed for N values is the ceiling of log2 N. ASCII A=65=0x41, a=97, 0=48. UTF-8 is 1 to 4 bytes and ASCII-compatible. #FF8000 to (255,128,0). 24-bit color: 16,777,216 colors. Image bytes = width x height x bytes per pixel."
      - id: u1-l6
        n: 6
        title: Where data comes from
        summary: Sources, collection methods, study designs, big data, and how organizations govern data.
        minutes: 22
        skills: [data-sources, study-types, big-data, data-gov]
        objectives: [DL5]
        vocab: [Data Source, Big Data, Data Governance, Data Pipeline, API]
        outline:
          - "Common sources and the data each produces"
          - "APIs, web scraping, and open data [Competitive]"
          - "Primary and secondary data"
          - "Experiments versus observational studies"
          - "Cross-sectional, longitudinal, and time series data [Competitive]"
          - "Big data and the Vs"
          - "Pipelines, ETL, governance, and lineage [Competitive]"
        notes: "Only experiments with random assignment support cause-and-effect claims. Velocity relates to streaming sources like sensors and logs. Scraping ethics and terms of service. Data lineage = where data came from and how it changed."
      - id: u1-l7
        n: 7
        title: Data wrangling and transformation
        summary: Turning raw data into analysis-ready data, with the transformations that tests ask you to compute.
        minutes: 25
        skills: [wrangling, scaling, encoding-cats, feature-eng]
        objectives: [DL6]
        vocab: [Data Wrangling, Data Transformation, Feature Engineering, Normalization]
        outline:
          - "What wrangling is and why it takes so much of a project"
          - "Tidy data: one variable per column, one observation per row"
          - "Parsing and type conversion"
          - "Scaling: min-max normalization and z-score standardization"
          - "Encoding categories: one-hot and label encoding"
          - "Binning, log transforms, and new features [Competitive]"
        notes: "Normalization formula (x - min)/(max - min). Standardization (x - mean)/sd. One-hot creates one column per category (k-1 with drop_first). Scale features for distance-based methods and gradient descent; trees do not need scaling. Fit transforms on training data only. Note that 'normalization' also means something different in databases (Unit 4)."
      - id: u1-l8
        n: 8
        title: The data science process
        summary: The stages of a project in order, the named process models, EDA, and reproducible work.
        minutes: 22
        skills: [ds-process, process-models, eda, reproducibility]
        objectives: [DL7]
        vocab: [Exploratory Data Analysis (EDA)]
        outline:
          - "The lifecycle from question to deployment"
          - "OSEMN"
          - "CRISP-DM's six phases [Competitive]"
          - "IBM's data science methodology (Rollins' 10 stages) [Competitive]"
          - "Exploratory data analysis"
          - "Reproducibility, documentation, and communicating results"
        figures: ["CRISP-DM cycle diagram with six phases and feedback arrows"]
        notes: "First step is always understanding the problem/question. Data preparation is usually the most time-consuming phase. The process is iterative. Use research/facts.md for exact phase names."

  # ------------------------------------------------------------------ UNIT 2
  - id: u2
    n: 2
    area: PS
    title: Probability and Statistics Foundations
    summary: Center, spread, the normal distribution, probability, and expected value, computed fast and understood deeply.
    lessons:
      - id: u2-l1
        n: 1
        title: Mean, median, mode, and range
        summary: Compute each one correctly every time, including from frequency tables and with missing values.
        minutes: 22
        skills: [mean, median, mode-range, center-choice]
        objectives: [PS1]
        vocab: [Mean, Median, Mode, Range]
        outline:
          - "The mean, and what it balances"
          - "Means from frequency tables and weighted means"
          - "Working backward: a missing value from the mean [Competitive]"
          - "The median: sort first"
          - "The mode and the range"
          - "Outliers and skew: which center to report [Competitive]"
        widgets: [stats-explorer]
        notes: "Trap: median of an unsorted list. Right skew pulls the mean above the median. Combined mean of two groups uses weights."
      - id: u2-l2
        n: 2
        title: Quartiles, percentiles, and outliers
        summary: The five-number summary, the IQR, and the 1.5 x IQR rule.
        minutes: 18
        skills: [quartiles, outlier-rule]
        objectives: [PS1, PS2]
        vocab: [Quartile, Percentile, Outlier]
        outline:
          - "Quartiles and the five-number summary"
          - "Percentiles and percentile rank"
          - "The interquartile range"
          - "Fences: the 1.5 x IQR rule"
          - "Other outlier rules: z-scores [Competitive]"
          - "Why software gives slightly different quartiles [Champion]"
        notes: "Teach the median-of-halves method (exclude the median when n is odd) as the default and note that software interpolates. Use research/facts.md."
      - id: u2-l3
        n: 3
        title: Variance and standard deviation
        summary: What spread measures, population versus sample, and how to compute both quickly.
        minutes: 25
        skills: [variance-sd, sd-props, coef-var]
        objectives: [PS2]
        vocab: [Variance, Standard Deviation]
        outline:
          - "Deviations from the mean"
          - "Variance: the average squared deviation"
          - "Standard deviation and why we take the square root"
          - "Population (divide by N) versus sample (divide by n - 1)"
          - "How spread responds to shifting and scaling [Competitive]"
          - "Coefficient of variation [Competitive]"
          - "Software defaults: NumPy versus pandas [Champion]"
        widgets: [stats-explorer]
        notes: "Worked example with full table of deviations and squares. Bessel's correction rationale in plain words. SD is in original units; variance in squared units. Adding a constant leaves SD unchanged; multiplying by k multiplies SD by |k|."
      - id: u2-l4
        n: 4
        title: Covariance and correlation
        summary: How two variables move together, and how to read r.
        minutes: 20
        skills: [covariance, correlation]
        objectives: [PS2]
        vocab: [Covariance, Correlation]
        outline:
          - "Covariance: moving together or apart"
          - "Why covariance is hard to compare [Competitive]"
          - "Correlation r: from -1 to 1"
          - "Reading r from a scatterplot"
          - "r squared [Competitive]"
          - "What r cannot see: curves and outliers [Competitive]"
        notes: "r is unitless and unchanged by changing units (linear rescaling with positive factor). Covariance units are the product of the units. r = cov / (sx sy)."
      - id: u2-l5
        n: 5
        title: The normal distribution and z-scores
        summary: The bell curve's properties, the 68-95-99.7 rule, and standardizing with z.
        minutes: 25
        skills: [normal-props, empirical-rule, z-scores]
        objectives: [PS3]
        vocab: [Gaussian Distribution]
        outline:
          - "The shape and its two parameters"
          - "Why the normal distribution matters, including in AI"
          - "The 68-95-99.7 rule"
          - "z-scores: how many standard deviations from the mean"
          - "Comparing across different scales with z [Competitive]"
          - "Percentiles from common z values [Champion]"
        widgets: [normal-explorer]
        notes: "Mean = median = mode. Tails approach but never touch the axis. Area under the curve = 1. Uses in AI: Gaussian noise, weight initialization, Gaussian naive Bayes, anomaly detection by z-score."
      - id: u2-l6
        n: 6
        title: Samples, the central limit theorem, and inference
        summary: Why sample means are predictable, standard error, and what confidence levels, p-values and power mean.
        minutes: 22
        skills: [clt, inference-basics]
        objectives: [PS3]
        outline:
          - "Population versus sample, parameter versus statistic"
          - "Sampling distributions"
          - "The central limit theorem"
          - "Standard error and sample size [Competitive]"
          - "Confidence intervals and margin of error [Competitive]"
          - "p-values, significance, Type I and II errors, and power [Champion]"
        notes: "SE = sigma / sqrt(n); quadrupling n halves SE. Law of large numbers is a different idea. Keep inference at recognition level: what the terms mean and which way they move with n."
      - id: u2-l7
        n: 7
        title: Probability essentials
        summary: The rules you need, two-way tables, conditional probability, and Bayes' theorem.
        minutes: 28
        skills: [prob-basics, prob-rules, conditional, bayes]
        objectives: [PS4]
        vocab: [Conditional Probability]
        outline:
          - "Probability as a number from 0 to 1"
          - "Complements and 'at least one'"
          - "Addition rule: mutually exclusive or not"
          - "Multiplication rule: independent or not"
          - "Conditional probability and two-way tables"
          - "Bayes' theorem and base rates [Competitive]"
        widgets: [bayes-explorer]
        notes: "Mutually exclusive is not the same as independent. P(A|B) is not P(B|A). Natural-frequency method for Bayes (out of 1,000 people)."
      - id: u2-l8
        n: 8
        title: Random variables and expected value
        summary: Probability distributions, expected value in games and decisions, and the distributions you should recognize.
        minutes: 28
        skills: [rv-dist, expected-value, ev-decisions, ev-rules, distributions, var-types]
        objectives: [PS4, PS5]
        vocab: [Expected Value, Probability Distribution, Discrete Variable, Continuous Variable]
        outline:
          - "Random variables, discrete and continuous"
          - "Probability distributions: tables that sum to 1"
          - "Expected value as a weighted average"
          - "Expected value in games, insurance, and decisions"
          - "Linearity of expectation and variance of a random variable [Champion]"
          - "Distributions to recognize: uniform, binomial, Poisson, normal [Competitive]"
          - "Types of variables in a study: explanatory, response, confounding [Competitive]"
        notes: "Fair die E = 3.5, two dice E = 7. Fair game EV = 0. Binomial mean np, variance np(1-p). Poisson mean = variance. P(X = a) = 0 for continuous X."

  # ------------------------------------------------------------------ UNIT 3
  - id: u3
    n: 3
    area: DA
    title: Data Analysis and Statistics for AI
    summary: Choosing and reading charts, data quality and cleaning, multivariate methods, and how real algorithms are applied and evaluated.
    lessons:
      - id: u3-l1
        n: 1
        title: Choosing the right chart
        summary: Match the chart to the data and the question, and spot charts that mislead.
        minutes: 22
        skills: [chart-choice, chart-types, misleading]
        objectives: [DA1, DA2]
        vocab: [Visualization]
        outline:
          - "Start from the question: distribution, comparison, composition, relationship, change over time"
          - "The core charts and what each is for"
          - "Pie charts and when to avoid them"
          - "Heatmaps, violin plots, and scatterplot matrices [Competitive]"
          - "Charts that mislead [Competitive]"
        notes: "Histogram vs bar chart (continuous bins vs categories). Line charts for time. Scatterplots for two numeric variables. Truncated axes, 3D effects, dual axes."
      - id: u3-l2
        n: 2
        title: Histograms and boxplots
        summary: Read shape, center, spread, and outliers from the two workhorse charts.
        minutes: 22
        skills: [histograms, boxplots]
        objectives: [DA2]
        vocab: [Histogram, Boxplot]
        outline:
          - "Reading a histogram: shape, center, spread"
          - "Skewed, symmetric, bimodal, and uniform shapes"
          - "How bin width changes the picture [Competitive]"
          - "Reading a boxplot: the five-number summary"
          - "Comparing groups with side-by-side boxplots"
          - "What a boxplot hides [Competitive]"
        notes: "Each boxplot section holds about 25% of the data. Boxplots hide sample size and bimodality."
      - id: u3-l3
        n: 3
        title: Scatterplots, correlation, and causation
        summary: Describe relationships, and avoid the reasoning errors that test writers target.
        minutes: 22
        skills: [scatterplots, causation]
        objectives: [DA2, DA3]
        vocab: [Scatterplot]
        outline:
          - "Direction, form, strength, and outliers"
          - "Lines of best fit and residuals [Competitive]"
          - "Correlation is not causation"
          - "Confounding and lurking variables"
          - "Simpson's paradox [Champion]"
        notes: "Residual = actual - predicted. Points above the line are underpredicted. Only randomized experiments establish causation."
      - id: u3-l4
        n: 4
        title: Data quality and where bad data comes from
        summary: The dimensions of data quality and the collection biases that damage it.
        minutes: 22
        skills: [data-quality, sampling-bias]
        objectives: [DA5]
        vocab: [Data Quality]
        outline:
          - "The dimensions of data quality"
          - "Factors that hurt quality: duplicates, low-quality sources, incomplete data"
          - "Sampling methods"
          - "Collection biases: selection, survivorship, nonresponse, and more [Competitive]"
          - "A bigger biased sample is still biased [Competitive]"
        notes: "Dimensions: accuracy, completeness, consistency, timeliness, validity, uniqueness. Match scenarios to the dimension and to the bias."
      - id: u3-l5
        n: 5
        title: Cleaning data
        summary: Why cleaning matters and exactly how to handle missing values, duplicates, inconsistencies, and outliers.
        minutes: 25
        skills: [why-clean, missing-data, clean-issues, validate-clean]
        objectives: [DA4, DA5]
        vocab: [Data Cleaning, Imputation]
        outline:
          - "Garbage in, garbage out"
          - "Missing data: MCAR, MAR, MNAR [Competitive]"
          - "Deleting versus imputing"
          - "Duplicates and inconsistent formats"
          - "Outliers: investigate before you remove"
          - "Validating that cleaning worked"
        notes: "Median imputation is better for skewed data. Mean imputation shrinks variance. Never delete outliers just because they are extreme."
      - id: u3-l6
        n: 6
        title: Working with many variables
        summary: Dependence versus interdependence methods, multiple regression, logistic regression, and PCA.
        minutes: 28
        skills: [multivariate, multiple-regression, logistic-regression, interdependence]
        objectives: [DA3]
        vocab: [Multivariate Analysis, Logistic Regression]
        outline:
          - "Univariate, bivariate, multivariate"
          - "Dependence versus interdependence methods"
          - "Multiple linear regression and its coefficients"
          - "R squared and adjusted R squared [Competitive]"
          - "Logistic regression: probabilities through the sigmoid"
          - "Odds and log-odds [Champion]"
          - "PCA, factor analysis, and cluster analysis [Competitive]"
        figures: ["Sigmoid curve with threshold line at 0.5"]
        notes: "Coefficient interpretation: change in predicted y per one-unit change in x, holding others constant. Multicollinearity. Logistic regression is classification despite the name."
      - id: u3-l7
        n: 7
        title: Algorithms on real problems
        summary: Linear regression, decision trees, and k-means applied to real decisions, and how to match problems to algorithms.
        minutes: 28
        skills: [linreg-applied, tree-applied, kmeans-applied, algo-match]
        objectives: [DA6]
        vocab: [Linear Regression, Decision Tree, K-means Clustering]
        outline:
          - "Linear regression: slope, intercept, prediction"
          - "Residuals and the danger of extrapolation [Competitive]"
          - "Decision trees: following the branches"
          - "k-means: the algorithm step by step"
          - "Choosing k: elbow and silhouette [Competitive]"
          - "Matching problems to algorithms"
        widgets: [kmeans-stepper]
