    objectives: [DL2]
    patterns: ["Classify an example (tweets, sensor table, JSON, email, images)", "Properties: schema, searchability, storage", "Which kind needs NLP or computer vision to analyze", "Why semi-structured data is in between"]
  - id: data-formats
