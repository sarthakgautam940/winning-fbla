# Lesson 1.3 flashcards

- id: fc-numeric-data
  term: Numeric Data
  def: Quantitative data that measure or count something, so arithmetic on them is meaningful. Examples include height, test score, and number of siblings.
  skill: var-num-cat
  virginia: true

- id: fc-categorical-data
  term: Categorical Data
  def: Qualitative data that place each observation into a group or label, so arithmetic on them is meaningless. Examples include blood type, country, and yes or no.
  skill: var-num-cat
  virginia: true

- id: fc-do-math-test
  term: The do-math test
  def: To tell numeric from categorical, ask whether an average of the values would mean anything. ZIP codes, IDs, and jersey numbers fail the test, so they are categorical.
  skill: var-num-cat

- id: fc-binary-coded-mean
  term: Mean of a 0/1 variable
  def: The proportion of 1s. A mean of 0.35 in a "subscribed" column coded 1/0 means 35 percent subscribed. The variable is still categorical.
  skill: var-num-cat

- id: fc-discrete-vs-continuous
  term: Discrete vs. continuous
  def: "Discrete values come from counting, giving separate values such as goals or customers. Continuous values come from measuring and can fall anywhere in a range, such as time or weight."
  skill: var-disc-cont

- id: fc-rounding-not-discrete
  term: Rounding and discreteness
  def: Recording a measurement to the nearest tenth does not make it discrete. Rainfall to 0.1 mm is still continuous.
  skill: var-disc-cont

- id: fc-nominal
  term: Nominal
  def: Categories with no natural order, such as eye color, country, or blood type. Use the mode.
  skill: var-levels

- id: fc-ordinal
  term: Ordinal
  def: Categories with a meaningful order but unmeasured gaps, such as letter grades, ratings, Likert responses, or race place. Use the median.
  skill: var-levels

- id: fc-interval
  term: Interval
  def: Equally spaced numeric values with an arbitrary zero, such as temperature in Celsius or Fahrenheit and calendar years. Differences are meaningful but ratios are not.
  skill: var-levels

- id: fc-ratio-level
  term: Ratio (level of measurement)
  def: Equally spaced values with a true zero, such as height, weight, income, counts, and Kelvin. "Twice as much" is meaningful.
  skill: var-levels

- id: fc-noir
  term: NOIR
  def: The levels of measurement from least to most information, as named by Stevens in 1946. Nominal, ordinal, interval, ratio.
  skill: var-levels

- id: fc-likert
  term: Likert scale
  def: A rating scale from, for example, strongly disagree to strongly agree. The responses are ordinal categorical data.
  skill: var-levels
